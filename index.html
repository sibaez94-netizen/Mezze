erte el huevo batido, la mantequilla derretida tibia y la mezcla de agua, sal y azúcar.","tip":"Mezcla con una cuchara hasta integrar y vuelca a la mesa de trabajo.","durationMinutes":5},{"stepNumber":2,"instruction":"Amasa con firmeza durante 6-8 minutos hasta obtener una masa suave, flexible y elástica que no se pegue. Envuelve en film transparente y deja reposar 30 minutos a temperatura ambiente.","tip":"El reposo relaja el gluten y permite estirar la masa finísima sin que se encoja.","durationMinutes":35},{"stepNumber":3,"instruction":"Estira la masa con un rodillo sobre la mesa ligeramente enharinada hasta dejarla de 1 a 1,5 mm de grosor. Corta tiras longitudinales de unos 2 cm de ancho con un cuchillo afilado o corta-pizzas.","tip":"Cuanto más uniforme sea la tira, más bonito quedará el enrollado.","durationMinutes":10},{"stepNumber":4,"instruction":"Toma un bastón de queso. Pega el extremo de la tira en la punta cubriéndola por completo (sellado vertical), y ve enrollando en espiral diagonal solapando la mitad de la masa en cada vuelta hasta llegar al otro extremo. Sella bien la punta opuesta y rueda el tequeño con la palma sobre la mesa para compactar.","tip":"¡El sellado perfecto evita que el queso se escape y salte en el aceite caliente!","durationMinutes":15},{"stepNumber":5,"instruction":"Calienta abundante aceite a 175°C. Fríe los tequeños en tandas de 5-6 unidades durante 3-4 minutos girándolos con pinzas hasta que estén dorados de manera uniforme. Escurre en papel absorbente.","tip":"Sírvelos inmediatamente mientras el queso esté elástico y fundente con salsa tártara o guasacaca.","durationMinutes":8}],"regionalVariants":[{"name":"Tequeños de Plátano Macho Maduro (Teque-Yoyos)","region":"Zulia y Maracaibo","description":"La masa se elabora mezclando harina de trigo con puré de plátano macho muy maduro, aportando un dulzor sensacional.","optionalAdditions":["Plátano macho maduro en la masa"]},{"name":"Tequeños Dulces de Nutella o Guayaba y Queso (Tequevía)","region":"Caracas moderna","description":"Rellenos de bastón de queso blanco con dulce de guayaba o directamente con bastones de chocolate congelados.","optionalAdditions":["Dulce de guayaba o crema de cacao"]}],"chefTips":["Calcula al menos 4 tequeños por invitado en cualquier fiesta: ¡nunca sobra ni uno!","Se pueden congelar en crudo en una bandeja y freír directamente congelados sin descongelar."],"robot":{"servings":6,"factor":1,"note":"El robot amasa. El enrollado y la fritura, a mano.","ingredients":["350 g · Harina de trigo de todo uso","400 g cortado en bastones de 1x1x7 cm · Queso blanco duro o semiduro llanero (o queso latino de freír)","60 g · Mantequilla sin sal derretida","1 unidad · Huevo campero mediano","120 ml · Agua tibia con 1 cucharadita de sal y 1 de azúcar","500 ml · Aceite de girasol para freír","para acompañar · Salsa tártara o salsa de ajo casera para mojar"],"steps":[{"stepNumber":1,"instruction":"Agua tibia con sal y azúcar, huevo y mantequilla derretida: 10 s a velocidad 4."},{"stepNumber":2,"instruction":"Añade la harina: 3 min en programa amasar. Envuelve en film y reposa 30 min."},{"stepNumber":3,"instruction":"Estira, enrolla el queso y fríe como en la receta original."}]}},{"id":"arepa-reina-pepiada","title":"Arepa Reina Pepiada Tradicional","subtitle":"La ensalada cremosa de pollo deshebrado, aguacate maduro y cilantro en pan de maíz","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Caracas, Venezuela","originFlag":"🇻🇪","desc":"Creada en los años 50 en honor a la Miss Mundo venezolana Susana Duijm (\"pepiada\" significaba mujer hermosa y voluptuosa). Una arepa crujiente de maíz blanco recién asada, abierta y rellena a rebosar con una ensalada jugosa y cremosa de pollo desmechado, aguacate Hass maduro, cebollita dulce picada, cilantro, zumo de lima y un ligero toque de mayonesa casera.","prepTime":20,"cookTime":15,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80","tags":["Sin gluten","Pollo jugoso","Ícono nacional","Cremoso"],"partyRole":"Arepas rellenas templadas para banquete o estación de autoservicio","drinkPairing":"Cerveza rubia bien fría o jugo natural de parchita (maracuyá)","ingredients":[{"id":"rp-1","name":"Harina de maíz blanco precocida (Harina P.A.N.)","amount":350,"unit":"g","category":"despensa"},{"id":"rp-2","name":"Agua tibia con 1 cdta de sal","amount":450,"unit":"ml","category":"despensa"},{"id":"rp-3","name":"Pechuga de pollo cocida y desmechada en hebras finas","amount":450,"unit":"g","category":"carne_pescado"},{"id":"rp-4","name":"Aguacates Hass grandes maduros","amount":2,"unit":"unidades","category":"verdura"},{"id":"rp-5","name":"Cebolla dulce o cebolleta finamente picada","amount":0.5,"unit":"unidad","category":"verdura"},{"id":"rp-6","name":"Diente de ajo prensado","amount":1,"unit":"diente","category":"verdura"},{"id":"rp-7","name":"Cilantro fresco picado finísimo","amount":3,"unit":"cucharadas","category":"verdura"},{"id":"rp-8","name":"Mayonesa de buena calidad","amount":3,"unit":"cucharadas colmadas","category":"despensa"},{"id":"rp-9","name":"Zumo de lima fresca","amount":20,"unit":"ml","category":"verdura"},{"id":"rp-10","name":"Sal marina y pimienta negra molida","amount":1,"unit":"cucharadita","category":"especia"},{"id":"rp-11","name":"Mantequilla para untar las arepas calientes","amount":30,"unit":"g","category":"lacteo"}],"steps":[{"stepNumber":1,"instruction":"Para la masa de arepas: en un bol vierte el agua tibia salada y añade la harina de maíz en lluvia. Amasa 2 minutos hasta lograr una masa suave y flexible que no se agriete. Divide en bolas de unos 60g (tamaño mediano de fiesta) y aplana en discos de 1,5 cm de grosor.","tip":"Si los bordes se agrietan, moja tus dedos con agua tibia y alísalos.","durationMinutes":8},{"stepNumber":2,"instruction":"Asa las arepas en sartén o plancha con un hilo de aceite a fuego medio durante 5-6 minutos por lado hasta que tengan costra tostada. Si quieres, termina 5 minutos al horno a 200°C para que se inflen y suenen huecas al tacto.","tip":"El horneado final crea una cáscara súper crujiente que contrasta con el relleno cremoso.","durationMinutes":12},{"stepNumber":3,"instruction":"Para el relleno: en un bol hondo, machaca 1 aguacate y medio con un tenedor dejando algunos tropezones. El medio aguacate restante córtalo en cubitos firmes.","tip":"Mezclar pulpa machacada con cubos enteros da una textura sublime.","durationMinutes":4},{"stepNumber":4,"instruction":"Añade el pollo desmechado, el ajo prensado, la cebolla picada, el cilantro, la mayonesa, el zumo de lima, sal y pimienta. Mezcla todo con suavidad hasta tener una crema verde untuosa y consistente.","tip":"Prueba y ajusta de sal y lima.","durationMinutes":4},{"stepNumber":5,"instruction":"Abre las arepas calientes por la mitad con cuchillo de sierra sin llegar al fondo. Unta una nuez de mantequilla dentro y rellena generosamente con la mezcla de Reina Pepiada.","tip":"Sírvelas templadas de inmediato.","durationMinutes":2}],"regionalVariants":[{"name":"Sifrina (Reina Pepiada con Queso Amarillo)","region":"Areperas de Caracas","description":"La misma base de reina pepiada coronada con una lluvia de queso gouda amarillo rallado en hebras gruesas.","optionalAdditions":["Queso amarillo gouda rallado"]}],"chefTips":["Prepara el relleno de pollo unas horas antes para que absorba todo el sabor, pero añade el aguacate fresco cerca de la hora de servir."],"robot":{"servings":6,"factor":1,"note":"El robot amasa la masa de arepas y cuece y desmecha el pollo.","ingredients":["350 g · Harina de maíz blanco precocida (Harina P.A.N.)","450 ml · Agua tibia con 1 cdta de sal","450 g · Pechuga de pollo cocida y desmechada en hebras finas","2 unidades · Aguacates Hass grandes maduros","0,5 unidad · Cebolla dulce o cebolleta finamente picada","1 diente · Diente de ajo prensado","3 cucharadas · Cilantro fresco picado finísimo","3 cucharadas colmadas · Mayonesa de buena calidad","20 ml · Zumo de lima fresca","1 cucharadita · Sal marina y pimienta negra molida","30 g · Mantequilla para untar las arepas calientes"],"steps":[{"stepNumber":1,"instruction":"Pollo: 500 ml de agua con sal en el vaso y la pechuga en el cestillo: 20 min a 100 °C, velocidad 4. Escurre."},{"stepNumber":2,"instruction":"Pollo cocido en trozos: 3-4 s a velocidad 4 (giro inverso) para desmecharlo. Reserva."},{"stepNumber":3,"instruction":"Vaso limpio: agua tibia con sal y harina de maíz, 1 min en programa amasar. Forma y asa las arepas en sartén."},{"stepNumber":4,"instruction":"Relleno: aguacate, cebolla, ajo, cilantro, mayonesa, lima, sal y pimienta: 5 s a velocidad 4. Añade el pollo y mezcla 10 s a velocidad 2 (giro inverso)."}]}},{"id":"arepa-pelua-carne-mechada","title":"Arepa Pelúa (Carne Mechada y Queso Amarillo)","subtitle":"Falda de ternera en sofrito criollo jugoso y lluvia de queso gouda","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Venezuela","originFlag":"🇻🇪","desc":"Bautizada como \"Pelúa\" por el aspecto desgreñado que le dan las hebras de carne mechada sobresaliendo junto a las virutas de queso amarillo derretido. La carne de ternera se cocina hasta deshilacharse en hilos finos y se guisa en un sofrito criollo de pimientos dulces, cebolla, ajo y comino.","prepTime":25,"cookTime":45,"difficulty":"Media","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Carne mechada","Queso fundido","Sin gluten","Contundente"],"partyRole":"Arepa caliente contundente y sabrosa para el momento cumbre","drinkPairing":"Cerveza tostada o copa de vino tinto joven","ingredients":[{"id":"ap-1","name":"Carne de ternera para mechar (falda o aleta)","amount":600,"unit":"g cocida y desmechada en hebras finas","category":"carne_pescado"},{"id":"ap-2","name":"Cebolla picada en brunoise fina","amount":1.5,"unit":"unidades","category":"verdura"},{"id":"ap-3","name":"Pimiento rojo y verde en cubitos pequeños","amount":1.5,"unit":"unidades","category":"verdura"},{"id":"ap-4","name":"Tomates maduros triturados o rallados","amount":3,"unit":"unidades","category":"verdura"},{"id":"ap-5","name":"Dientes de ajo picados","amount":3,"unit":"dientes","category":"verdura"},{"id":"ap-6","name":"Comino molido y achiote u onoto en polvo","amount":1,"unit":"cucharadita de cada uno","category":"especia"},{"id":"ap-7","name":"Caldo de la cocción de la carne","amount":150,"unit":"ml","category":"despensa"},{"id":"ap-8","name":"Aceite de oliva o vegetal","amount":40,"unit":"ml","category":"despensa"},{"id":"ap-9","name":"Queso amarillo tipo Gouda o Edam rallado grueso","amount":200,"unit":"g","category":"lacteo"},{"id":"ap-10","name":"Masa de arepas asadas calientes","amount":6,"unit":"unidades recién hechas","category":"panaderia"}],"steps":[{"stepNumber":1,"instruction":"En una cazuela con aceite, sofríe la cebolla, los pimientos y el ajo con una pizca de sal a fuego medio durante 10 minutos hasta que estén bien pochados.","tip":"Añade el comino y el onoto/achiote para darle el tono dorado rojizo tradicional.","durationMinutes":10},{"stepNumber":2,"instruction":"Agrega el tomate triturado y cocina 8 minutos hasta que reduzca el agua. Vierte la carne mechada deshilachada y el caldo de carne.","tip":"Tapa y cocina a fuego bajo 15 minutos para que la carne se impregne del sofrito sin secarse.","durationMinutes":15},{"stepNumber":3,"instruction":"Abre las arepas calientes recién sacadas del budare o plancha. Unta mantequilla.","tip":"Rellena con una porción generosa de carne mechada humeante y cubre inmediatamente con abundante queso amarillo rallado.","durationMinutes":4},{"stepNumber":4,"instruction":"El calor de la carne derretirá parcialmente el queso gouda, creando hilos fundentes irresistibles al morder.","tip":"Sirve acompañada de guasacaca.","durationMinutes":2}],"regionalVariants":[{"name":"Arepa Catira (Pollo y Queso Amarillo)","region":"Variante popular","description":"Se sustituye la carne mechada de ternera por pollo desmechado guisado con sofrito.","optionalAdditions":["Pollo desmechado guisado"]}],"chefTips":["Cocina la carne el día anterior en olla express con sal, laurel y cebolla; fría se desmecha con los dedos con asombrosa facilidad."],"robot":{"servings":4,"factor":0.6,"note":"A 0,6 de cantidad cabe el guiso. Para desmechar la carne cocida: 3 s a velocidad 4 con giro inverso.","ingredients":["360 g cocida y desmechada en hebras finas · Carne de ternera para mechar (falda o aleta)","1 unidades · Cebolla picada en brunoise fina","1 unidades · Pimiento rojo y verde en cubitos pequeños","1,75 unidades · Tomates maduros triturados o rallados","1,75 dientes · Dientes de ajo picados","0,5 cucharadita de cada uno · Comino molido y achiote u onoto en polvo","90 ml · Caldo de la cocción de la carne","25 ml · Aceite de oliva o vegetal","120 g · Queso amarillo tipo Gouda o Edam rallado grueso","4 unidades recién hechas · Masa de arepas asadas calientes"],"steps":[{"stepNumber":1,"instruction":"Cebolla, pimientos y ajo en trozos: 4 s a velocidad 5. Añade el aceite: 10 min a 120 °C, velocidad 1."},{"stepNumber":2,"instruction":"Añade tomate, comino y achiote: 8 min a 110 °C, velocidad 1, sin cubilete."},{"stepNumber":3,"instruction":"Añade la carne mechada y el caldo: 10 min a 100 °C, velocidad 1 (giro inverso)."},{"stepNumber":4,"instruction":"Rellena las arepas calientes con la carne y el queso rallado."}]}},{"id":"guasacaca-criolla-aguacate","title":"Guasacaca Criolla Tradicional","subtitle":"La salsa reina de Venezuela: emulsión de aguacate, pimiento, hierbas y vinagre","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Venezuela","originFlag":"🇻🇪","desc":"El aderezo insignia que acompaña a toda carne a la brasa, arepa, empanada o tequeño. A diferencia del guacamole mexicano, la guasacaca lleva un golpe fresco de vinagre blanco, abundante pimiento verde, cilantro, perejil y ajo emulsionados con aceite de oliva virgen extra. Fresca, aromática y picante al gusto.","prepTime":12,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Sin gluten","Salsa estrella","Rápido"],"partyRole":"Salsa viva indispensable en la mesa para aderezar tequeños y arepas","drinkPairing":"Combina con cualquier comida venezolana","ingredients":[{"id":"gc-1","name":"Aguacates maduros","amount":2,"unit":"unidades medianas","category":"verdura"},{"id":"gc-2","name":"Pimiento verde italiano limpio sin semillas","amount":1,"unit":"unidad troceada","category":"verdura"},{"id":"gc-3","name":"Cebolla blanca o dulce","amount":0.5,"unit":"unidad","category":"verdura"},{"id":"gc-4","name":"Dientes de ajo pelados","amount":2,"unit":"dientes","category":"verdura"},{"id":"gc-5","name":"Hojas frescas de cilantro limpio","amount":1,"unit":"taza colmada","category":"verdura"},{"id":"gc-6","name":"Hojas frescas de perejil limpio","amount":0.5,"unit":"taza","category":"verdura"},{"id":"gc-7","name":"Vinagre blanco o de manzana","amount":35,"unit":"ml","category":"despensa"},{"id":"gc-8","name":"Aceite de oliva virgen extra o vegetal","amount":80,"unit":"ml","category":"despensa"},{"id":"gc-9","name":"Sal marina y pimienta negra molida","amount":1,"unit":"cucharadita","category":"especia"},{"id":"gc-10","name":"Pizca de chile jalapeño o ají dulce (opcional)","amount":1,"unit":"unidad","category":"verdura"}],"steps":[{"stepNumber":1,"instruction":"En el vaso de la licuadora o procesador de alimentos, coloca el pimiento verde troceado, la cebolla, los dientes de ajo, el cilantro, el perejil, el vinagre y la sal.","tip":"Tritura unos segundos primero las verduras con el vinagre para crear la base líquida aromática.","durationMinutes":3},{"stepNumber":2,"instruction":"Añade la pulpa de los dos aguacates y tritura con pulsaciones cortas.","tip":"Si te gusta rústica, tritúrala poco; si te gusta tipo crema emulsionada para biberón, licúa a velocidad continua.","durationMinutes":3},{"stepNumber":3,"instruction":"Con el motor en marcha lenta, vierte el aceite de oliva en hilo continuo para emulsionar como una mayonesa vegetal sedosa.","tip":"Ajusta el punto de sal y vinagre: debe tener una acidez fresca vivaz.","durationMinutes":3},{"stepNumber":4,"instruction":"Vierte en un bol o salsera. Gracias al vinagre blanco, la guasacaca no se oscurece con tanta facilidad como el guacamole.","tip":"Conserva en frío tapada.","durationMinutes":3}],"regionalVariants":[{"name":"Guasacaca Picadita a Cuchillo","region":"Llanos venezolanos","description":"En lugar de licuada, todos los ingredientes se cortan a cuchillo en daditos milimétricos (parecido a un pebre o vinagreta espesa).","optionalAdditions":["Corte a cuchillo sin licuar"]}],"chefTips":["Tenla en la mesa junto a los tequeños calientes: el contraste del queso caliente y la guasacaca ácida y fría es sublime."],"robot":{"servings":6,"factor":1,"note":"Receta perfecta para el robot.","ingredients":["2 unidades medianas · Aguacates maduros","1 unidad troceada · Pimiento verde italiano limpio sin semillas","0,5 unidad · Cebolla blanca o dulce","2 dientes · Dientes de ajo pelados","1 taza colmada · Hojas frescas de cilantro limpio","0,5 taza · Hojas frescas de perejil limpio","35 ml · Vinagre blanco o de manzana","80 ml · Aceite de oliva virgen extra o vegetal","1 cucharadita · Sal marina y pimienta negra molida","1 unidad · Pizca de chile jalapeño o ají dulce (opcional)"],"steps":[{"stepNumber":1,"instruction":"Pimiento, cebolla, ajo, cilantro, perejil, vinagre y sal: 10 s a velocidad 7."},{"stepNumber":2,"instruction":"Añade el aguacate: 10 s a velocidad 5."},{"stepNumber":3,"instruction":"Con el motor a velocidad 4, echa el aceite en hilo por la boca de la tapa durante 30 s."}]}},{"id":"cachapas-maiz-queso-mano","title":"Cachapas de Maíz Tierno con Queso de Mano","subtitle":"Tortas dulces doradas de choclo fresco con mantequilla y queso fundido","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Región Central / Llanos, Venezuela","originFlag":"🇻🇪","desc":"Uno de los manjares más tiernos y añorados de la cocina venezolana. Tortas doradas y esponjosas de granos de maíz tierno (choclo o elote) recién molidos con un toque dulce de azúcar y sal marina, asadas en budare o sartén caliente, bañadas en mantequilla que se derrite y dobladas en media luna envolviendo una rueda gruesa de queso de mano o telita jugoso.","prepTime":20,"cookTime":15,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Maíz dulce","Vegetariano","Sin gluten opcional","Manjar"],"partyRole":"Pase dulce-salado templado para amantes del maíz","drinkPairing":"Papelón con limón fresco bien frío","ingredients":[{"id":"ch-1","name":"Granos de maíz tierno dulce (fresco o mazorcas desgranadas)","amount":500,"unit":"g","category":"verdura"},{"id":"ch-2","name":"Leche entera","amount":60,"unit":"ml","category":"lacteo"},{"id":"ch-3","name":"Huevo campero","amount":1,"unit":"unidad","category":"lacteo"},{"id":"ch-4","name":"Harina de maíz precocida o maicena (para dar consistencia)","amount":2,"unit":"cucharadas","category":"despensa"},{"id":"ch-5","name":"Azúcar blanco o papelón rallado","amount":3,"unit":"cucharadas","category":"despensa"},{"id":"ch-6","name":"Sal marina fina","amount":1,"unit":"cucharadita","category":"especia"},{"id":"ch-7","name":"Mantequilla para engrasar la sartén y untar generosamente","amount":50,"unit":"g","category":"lacteo"},{"id":"ch-8","name":"Ruedas de Queso de Mano o Queso Mozzarella fresco en rodajas gruesas","amount":300,"unit":"g","category":"lacteo"}],"steps":[{"stepNumber":1,"instruction":"En la licuadora o procesador de alimentos, añade los granos de maíz tierno, la leche, el huevo, el azúcar y la sal.","tip":"Tritura con pulsaciones para no convertirlo en agua: la textura debe conservar pequeños trocitos de granos de maíz perceptibles.","durationMinutes":4},{"stepNumber":2,"instruction":"Vierte la mezcla en un bol. Si está demasiado líquida (según la humedad del maíz), añade las 2 cucharadas de harina de maíz o maicena y remueve. Deja reposar 10 minutos para que espese.","tip":"La consistencia debe ser similar a la masa espesa de pancakes o tortitas.","durationMinutes":10},{"stepNumber":3,"instruction":"Calienta una sartén antiadherente o plancha a fuego medio-bajo y engrasa con mantequilla. Vierte un cucharón de masa y extiéndelo con el dorso del cucharón en círculo de 15 cm y 1 cm de grosor.","tip":"Cocina durante 3-4 minutos hasta que salgan agujeritos y la base esté dorada y firme.","durationMinutes":5},{"stepNumber":4,"instruction":"Dale la vuelta con cuidado con una espátula ancha y cocina 2-3 minutos por el otro lado. Unta inmediatamente con abundante mantequilla encima.","tip":"Coloca una rueda de queso de mano en una mitad y dobla la cachapa en media luna.","durationMinutes":4}],"regionalVariants":[{"name":"Cachapa con Cochino Frito","region":"Carreteras de Miranda y El Junquito","description":"Servida con dados de cerdo fritos crujientes (chicharrón de carne) junto al queso de mano.","optionalAdditions":["Dados de cochino frito crujiente"]}],"chefTips":["Si no consigues mazorcas tiernas, puedes usar maíz dulce congelado descongelado y bien escurrido."],"robot":{"servings":6,"factor":1,"note":"La masa se hace en el robot. Las cachapas se cuajan en sartén.","ingredients":["500 g · Granos de maíz tierno dulce (fresco o mazorcas desgranadas)","60 ml · Leche entera","1 unidad · Huevo campero","2 cucharadas · Harina de maíz precocida o maicena (para dar consistencia)","3 cucharadas · Azúcar blanco o papelón rallado","1 cucharadita · Sal marina fina","50 g · Mantequilla para engrasar la sartén y untar generosamente","300 g · Ruedas de Queso de Mano o Queso Mozzarella fresco en rodajas gruesas"],"steps":[{"stepNumber":1,"instruction":"Maíz, leche, huevo, azúcar y sal: 30 s a velocidad 6. Debe quedar con algo de textura."},{"stepNumber":2,"instruction":"Si está muy líquida, añade la harina de maíz: 5 s a velocidad 3. Reposa 10 min."},{"stepNumber":3,"instruction":"Cocina en sartén con mantequilla como en la receta original y rellena con el queso."}]}},{"id":"mandocas-zulianas-anis","title":"Mandocas Zulianas con Queso y Papelón","subtitle":"Rosquillas de harina de maíz, plátano maduro, panela y anís dulce","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Estado Zulia, Venezuela","originFlag":"🇻🇪","desc":"Especialidad entrañable del estado Zulia. Rosquillas en forma de lazo o gota alargada hechas amasando harina de maíz con puré de plátano macho maduro, papelón disuelto, queso blanco rallado y semillas de anís dulce. Fritas hasta quedar doradas y caramelizadas por fuera y tiernas por dentro, servidas con queso blanco rallado que contrasta con el dulzor.","prepTime":20,"cookTime":15,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Dulce y salado","Zuliano","Plátano macho","Tradicional"],"partyRole":"Bocado festivo dulce-salado para picoteo o merienda de fiesta","drinkPairing":"Café con leche o chocolate caliente especiado","ingredients":[{"id":"md-1","name":"Harina de maíz precocida amarilla o blanca","amount":300,"unit":"g","category":"despensa"},{"id":"md-2","name":"Plátano macho muy maduro (piel negra)","amount":1,"unit":"unidad grande hervida","category":"verdura"},{"id":"md-3","name":"Papelón (panela) disuelto en agua tibia","amount":100,"unit":"g en 250ml de agua","category":"despensa"},{"id":"md-4","name":"Queso blanco duro rallado fino","amount":120,"unit":"g","category":"lacteo"},{"id":"md-5","name":"Semillas de anís dulce entero","amount":1,"unit":"cucharadita","category":"especia"},{"id":"md-6","name":"Sal fina","amount":0.5,"unit":"cucharadita","category":"especia"},{"id":"md-7","name":"Aceite para freír","amount":400,"unit":"ml","category":"despensa"},{"id":"md-8","name":"Queso blanco llanero rallado para coronar al servir","amount":100,"unit":"g","category":"lacteo"}],"steps":[{"stepNumber":1,"instruction":"Cuece el plátano macho maduro en agua con sal hasta que esté bien tierno. Pélalo y haz un puré fino con el tenedor.","tip":"Cuanto más madura esté la piel del plátano (casi negra), más dulces y aromáticas quedarán las mandocas.","durationMinutes":10},{"stepNumber":2,"instruction":"En un bol amplio, mezcla el puré de plátano con la harina de maíz, las semillas de anís, la sal y la mitad del queso rallado. Ve agregando el agua de papelón tibia poco a poco mientras amasas.","tip":"Amasa hasta lograr una textura maleable similar a plastilina que no se pegue.","durationMinutes":5},{"stepNumber":3,"instruction":"Toma porciones de masa, haz cilindros o cordones con las palmas de las manos de 15 cm de largo y 1,5 cm de grosor. Junta los extremos formando una gota o herradura.","tip":"Presiona la unión para que no se abra en el aceite.","durationMinutes":8},{"stepNumber":4,"instruction":"Fríe en aceite caliente a 180°C durante 2-3 minutos por lado hasta que estén de un color caoba brillante y crujiente. Escurre sobre papel.","tip":"Sírvelas calientes coronadas con una generosa montaña de queso blanco rallado.","durationMinutes":8}],"regionalVariants":[{"name":"Mandocas con Clavo de Olor","region":"Costa Oriental del Lago","description":"El agua de papelón se aromatiza hirviéndola con 2 clavos de olor y canela en rama.","optionalAdditions":["Canela y clavo de olor en el papelón"]}],"chefTips":["El contraste entre el plátano dulce caramelizado y el queso blanco salado es una experiencia sensorial única."],"robot":{"servings":6,"factor":1,"note":"El robot cuece el plátano y amasa. La fritura, en sartén.","ingredients":["300 g · Harina de maíz precocida amarilla o blanca","1 unidad grande hervida · Plátano macho muy maduro (piel negra)","100 g en 250ml de agua · Papelón (panela) disuelto en agua tibia","120 g · Queso blanco duro rallado fino","1 cucharadita · Semillas de anís dulce entero","0,5 cucharadita · Sal fina","400 ml · Aceite para freír","100 g · Queso blanco llanero rallado para coronar al servir"],"steps":[{"stepNumber":1,"instruction":"Plátano en trozos en el cestillo con 500 ml de agua y sal en el vaso: 20 min a 100 °C, velocidad 4. Vacía el vaso."},{"stepNumber":2,"instruction":"Plátano pelado: 10 s a velocidad 5. Añade la harina de maíz, el anís, la sal y la mitad del queso."},{"stepNumber":3,"instruction":"Añade el agua de papelón tibia: 1 min en programa amasar."},{"stepNumber":4,"instruction":"Forma las herraduras y fríe a 180 °C."}]}},{"id":"kibe-brasileiro-hortela","title":"Kibe Frito Brasileño (Quibe com Hortelã)","subtitle":"La joya de origen libanés adoptada como reina del tapeo en Brasil","category":"brasilena","categoryLabel":"Comida Brasileña","origin":"Brasil / Líbano","originFlag":"🇧🇷","desc":"Heredero de la inmensa comunidad sirio-libanesa de São Paulo, el quibe es el salgadinho de fiesta más adorado de Brasil. Croquetas crujientes en forma de balón de rugby de trigo burgol fino y carne de ternera picada sazonada con hierbabuena fresca, cebolla rallada y pimienta de Jamaica.","prepTime":25,"cookTime":15,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Salgadinho de fiesta","Crujiente","Picoteo caliente","Carne"],"partyRole":"Bocado de mano caliente crujiente con gajos de lima","drinkPairing":"Cerveza rubia helada (tipo chopp) o Caipirinha clásica de cachaça y lima","ingredients":[{"id":"kb-1","name":"Trigo burgol fino (trigo para quibe)","amount":250,"unit":"g","category":"despensa"},{"id":"kb-2","name":"Carne picada de ternera magra","amount":500,"unit":"g","category":"carne_pescado"},{"id":"kb-3","name":"Cebolla blanca mediana rallada finísima","amount":1,"unit":"unidad","category":"verdura"},{"id":"kb-4","name":"Hojas de hierbabuena fresca picadas muy fino","amount":4,"unit":"cucharadas colmadas","category":"verdura"},{"id":"kb-5","name":"Dientes de ajo prensados","amount":2,"unit":"dientes","category":"verdura"},{"id":"kb-6","name":"Pimienta siria (Pimenta síria) o mezcla de pimienta negra, canela y clavo","amount":1,"unit":"cucharadita","category":"especia"},{"id":"kb-7","name":"Sal marina fina","amount":1.5,"unit":"cucharadita","category":"especia"},{"id":"kb-8","name":"Aceite de girasol para freír","amount":500,"unit":"ml","category":"despensa"},{"id":"kb-9","name":"Gajos de lima fresca para exprimir al servir","amount":2,"unit":"limas","category":"verdura"}],"steps":[{"stepNumber":1,"instruction":"Coloca el trigo burgol en un bol hondo y cúbrelo con agua hirviendo (aprox 350ml). Deja hidratar tapado durante 30-40 minutos hasta que absorba el agua y quede tierno.","tip":"Vuelca el trigo en un paño limpio y aprieta con fuerza para extraer toda el agua; el trigo debe quedar húmedo pero sin líquido libre.","durationMinutes":35},{"stepNumber":2,"instruction":"En un bol grande, junta la carne picada con el trigo escurrido, la cebolla rallada con su jugo, el ajo, la hierbabuena picada finísima, la pimienta síria y la sal.","tip":"Amasa con las manos vigorosamente durante 4-5 minutos hasta que la fibra de la carne y el trigo formen una masa compacta y maleable.","durationMinutes":5},{"stepNumber":3,"instruction":"Toma porciones del tamaño de un huevo pequeño. Moldéalas entre las palmas en forma ovalada y ahúsa las dos puntas, creando la clásica silueta de balón de quibe.","tip":"Mójate las manos con agua fría para que la superficie quede lisa y sellada sin grietas.","durationMinutes":10},{"stepNumber":4,"instruction":"Calienta abundante aceite a 180°C. Fríe los kibes en tandas de 4 o 5 unidades para no bajar la temperatura del aceite durante 3-4 minutos hasta que adquieran un color caoba oscuro y crujiente.","tip":"Escurre sobre papel absorbente y sirve humeantes con gajos de lima fresca.","durationMinutes":10}],"regionalVariants":[{"name":"Quibe Recheado com Requeijão ou Catupiry","region":"São Paulo y Minas Gerais","description":"Se hace un hueco longitudinal con el dedo índice, se rellena con queso cremoso Catupiry o mozzarella rallada y se vuelve a sellar antes de freír.","optionalAdditions":["150g queso Catupiry o Requeijão cremoso"]},{"name":"Quibe de Forno (Al Horno en Fuente)","region":"Hogares brasileños","description":"Se monta en bandeja de horno con una capa de masa, relleno de cebolla caramelizada y queso en el centro, y otra capa de masa, horneado 30 min.","optionalAdditions":["Hornear a 200°C 30 min en lugar de freír"]}],"chefTips":["La hierbabuena fresca es el alma de la receta: nunca uses menta seca en polvo.","Puedes congelarlos crudos en una bandeja y freírlos directamente congelados en aceite bien caliente."],"robot":{"servings":6,"factor":1,"note":"El robot pica la cebolla y la hierbabuena y mezcla la masa. La fritura, en sartén.","ingredients":["250 g · Trigo burgol fino (trigo para quibe)","500 g · Carne picada de ternera magra","1 unidad · Cebolla blanca mediana rallada finísima","4 cucharadas colmadas · Hojas de hierbabuena fresca picadas muy fino","2 dientes · Dientes de ajo prensados","1 cucharadita · Pimienta siria (Pimenta síria) o mezcla de pimienta negra, canela y clavo","1,5 cucharadita · Sal marina fina","500 ml · Aceite de girasol para freír","2 limas · Gajos de lima fresca para exprimir al servir"],"steps":[{"stepNumber":1,"instruction":"Hidrata el burgol en agua hirviendo 30-40 min y escúrrelo apretando."},{"stepNumber":2,"instruction":"Cebolla, ajo y hierbabuena: 5 s a velocidad 6."},{"stepNumber":3,"instruction":"Añade la carne, el burgol, la pimienta y la sal: 1 min en programa amasar."},{"stepNumber":4,"instruction":"Forma los kibes y fríe a 180 °C como en la receta original."}]}},{"id":"coxinha-frango-catupiry","title":"Coxinha de Frango com Catupiry","subtitle":"El bocado callejero más emblemático de Brasil con corazón cremoso","category":"brasilena","categoryLabel":"Comida Brasileña","origin":"São Paulo / Río de Janeiro, Brasil","originFlag":"🇧🇷","desc":"El rey indiscutible de cualquier fiesta brasileña (aniversário). Una masa tierna y aterciopelada elaborada con el propio caldo de la cocción del pollo, rellena de pechuga deshilachada jugosa con sofrito de cebolla, ajo, perejil y queso cremoso catupiry, moldeada en forma de muslito de pollo y empanada con crujido dorado.","prepTime":35,"cookTime":25,"difficulty":"Elaborada","baseServings":8,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Rey de fiestas","Pollo jugoso","Salgadinho","Crujiente"],"partyRole":"El salgadinho caliente más deseado de toda la fiesta","drinkPairing":"Guaraná bien fría o cerveza artesanal rubia","ingredients":[{"id":"cx-1","name":"Pechuga de pollo entera de corral","amount":500,"unit":"g","category":"carne_pescado"},{"id":"cx-2","name":"Caldo de pollo sabroso (resultante de cocer el pollo)","amount":450,"unit":"ml","category":"despensa"},{"id":"cx-3","name":"Harina de trigo de todo uso","amount":250,"unit":"g","category":"panaderia"},{"id":"cx-4","name":"Mantequilla o aceite de oliva","amount":30,"unit":"g","category":"lacteo"},{"id":"cx-5","name":"Cebolla picada finísima","amount":1,"unit":"unidad","category":"verdura"},{"id":"cx-6","name":"Dientes de ajo picados","amount":2,"unit":"dientes","category":"verdura"},{"id":"cx-7","name":"Tomate maduro pelado y picado o 1 cda de concentrado","amount":1,"unit":"unidad","category":"verdura"},{"id":"cx-8","name":"Queso Catupiry o queso crema de untar firme","amount":120,"unit":"g","category":"lacteo"},{"id":"cx-9","name":"Perejil fresco picado (cheiro-verde)","amount":3,"unit":"cucharadas","category":"verdura"},{"id":"cx-10","name":"Colorau (achiote en polvo) o pimentón dulce para color","amount":1,"unit":"cucharadita","category":"especia"},{"id":"cx-11","name":"Huevos batidos y pan rallado fino para rebozar","amount":null,"unit":"cantidad necesaria","category":"panaderia"},{"id":"cx-12","name":"Aceite para freír","amount":500,"unit":"ml","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Cuece la pechuga de pollo en una olla con agua, sal, 1 trozo de cebolla y laurel durante 20 minutos. Retira la pechuga y reserva el caldo colado.","tip":"Deshilacha la pechuga tibia con dos tenedores o en la batidora con pala.","durationMinutes":20},{"stepNumber":2,"instruction":"En una sartén con mantequilla o aceite, pocha la cebolla y el ajo. Añade el colorau o pimentón, el tomate y el pollo deshilachado. Saltea 4 minutos y agrega el perejil fresco picado. Deja enfriar.","tip":"El relleno debe quedar bien sazonado y jugoso pero sin exceso de salsa líquida.","durationMinutes":8},{"stepNumber":3,"instruction":"Para la masa: en una cacerola, pon a hervir los 450ml de caldo colado de pollo con 30g de mantequilla y sal. Cuando rompa a hervir, vuelca toda la harina de golpe. Remueve enérgicamente con cuchara de madera a fuego bajo hasta que se forme una bola lisa que se despegue totalmente del fondo y paredes.","tip":"Coloca la masa caliente sobre una mesada y amasa suavemente con espátula 2 minutos hasta que quede aterciopelada.","durationMinutes":6},{"stepNumber":4,"instruction":"Toma una porción de masa (40g para tamaño fiesta). Aplástala en la palma formando un disco cóncavo. Pon una cucharadita de queso catupiry y una cucharada de pollo en el centro.","tip":"Cierra los bordes subiendo la masa hacia arriba y pellizca la punta para dar la característica forma de gota o muslito de coxinha.","durationMinutes":15},{"stepNumber":5,"instruction":"Pasa cada coxinha por huevo batido (o agua fría) y luego por pan rallado fino. Fríe en aceite abundante a 180°C hasta que estén de un rubio dorado uniforme. Escurre en papel de cocina.","tip":"Sírvelas con salsa picante de malagueta o vinagrete brasileño.","durationMinutes":10}],"regionalVariants":[{"name":"Coxinha com Massa de Mandioca (Yuca)","region":"Interior de São Paulo y Minas","description":"Se sustituye parte de la harina de la masa por puré caliente de mandioca/yuca cocida, aportando una elasticidad y sabor aún más rústico.","optionalAdditions":["150g puré de yuca hervida en la masa"]}],"chefTips":["La forma de lágrima se consigue con el giro de la palma y el pellizco final.","Son las reinas de las fiestas infantiles y adultas en Brasil: calcula 3 o 4 por comensal."],"robot":{"servings":8,"factor":1,"note":"El robot cuece el pollo, hace el relleno y cuece la masa sin grumos.","ingredients":["500 g · Pechuga de pollo entera de corral","450 ml · Caldo de pollo sabroso (resultante de cocer el pollo)","250 g · Harina de trigo de todo uso","30 g · Mantequilla o aceite de oliva","1 unidad · Cebolla picada finísima","2 dientes · Dientes de ajo picados","1 unidad · Tomate maduro pelado y picado o 1 cda de concentrado","120 g · Queso Catupiry o queso crema de untar firme","3 cucharadas · Perejil fresco picado (cheiro-verde)","1 cucharadita · Colorau (achiote en polvo) o pimentón dulce para color","cantidad necesaria · Huevos batidos y pan rallado fino para rebozar","500 ml · Aceite para freír"],"steps":[{"stepNumber":1,"instruction":"Pollo en el cestillo con 600 ml de agua, sal, cebolla y laurel en el vaso: 20 min a 100 °C, velocidad 4. Guarda 450 ml de caldo."},{"stepNumber":2,"instruction":"Pollo: 3 s a velocidad 4 (giro inverso) para desmechar. Reserva."},{"stepNumber":3,"instruction":"Cebolla y ajo: 4 s a velocidad 5. Añade mantequilla: 4 min a 120 °C, velocidad 1. Añade colorau, tomate, pollo y perejil: 4 min a 120 °C, velocidad 1 (giro inverso). Reserva."},{"stepNumber":4,"instruction":"Vaso limpio: caldo, mantequilla y sal, 6 min a 100 °C, velocidad 1. Añade la harina: 1 min a 90 °C, velocidad 4, y luego 1 min en programa amasar."},{"stepNumber":5,"instruction":"Forma, reboza y fríe como en la receta original."}]}},{"id":"pao-de-queijo-mineiro","title":"Pão de Queijo Mineiro Tradicional","subtitle":"Los panecillos elásticos y crujientes de almidón de yuca y queso curado","category":"brasilena","categoryLabel":"Comida Brasileña","origin":"Minas Gerais, Brasil","originFlag":"🇧🇷","desc":"Orgullo gastronómico de Minas Gerais. Panecillos dorados sin gluten, naturalmente crujientes por fuera y con un corazón tierno, gomoso y ahuecado gracias a la magia del polvilho (almidón de mandioca) y queso madurado tipo Meia Cura o Parmesano.","prepTime":15,"cookTime":20,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Sin gluten","Vegetariano","Recién horneado","Adicto"],"partyRole":"Cesta de pan caliente recién salido del horno para abrir la fiesta","drinkPairing":"Café brasileño de especialidad o cerveza artesanal","ingredients":[{"id":"pq-1","name":"Polvilho azedo (almidón agrio de yuca) o mezcla al 50% con polvilho doce","amount":350,"unit":"g","category":"despensa"},{"id":"pq-2","name":"Queso curado rallado fino (Queijo Meia Cura, Gouda curado o Parmesano)","amount":200,"unit":"g","category":"lacteo"},{"id":"pq-3","name":"Leche entera","amount":150,"unit":"ml","category":"lacteo"},{"id":"pq-4","name":"Aceite de girasol o maíz","amount":70,"unit":"ml","category":"despensa"},{"id":"pq-5","name":"Agua","amount":50,"unit":"ml","category":"despensa"},{"id":"pq-6","name":"Huevos enteros camperos","amount":2,"unit":"unidades","category":"lacteo"},{"id":"pq-7","name":"Sal marina fina","amount":1,"unit":"cucharadita rasa","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"En un cazo pon a calentar la leche, el agua, el aceite y la sal. Llévalo a ebullición.","tip":"El escaldado hirviendo es el secreto que gelatiniza el almidón de yuca.","durationMinutes":5},{"stepNumber":2,"instruction":"Vierte el polvilho en un cuenco amplio. Vierte la mezcla líquida hirviendo encima (escaldar) y mezcla de inmediato con una cuchara de madera. Quedará una masa grumosa. Deja entibiar 10 minutos.","tip":"No metas los dedos mientras esté hirviendo.","durationMinutes":10},{"stepNumber":3,"instruction":"Una vez tibia la masa, añade los huevos uno a uno amasando con las manos. Al principio parecerá resbaladiza y pegajosa, pero tras 2-3 minutos quedará una masa elástica y brillante.","tip":"Incorpora el queso rallado y amasa para que quede distribuido por igual.","durationMinutes":5},{"stepNumber":4,"instruction":"Unta tus manos con unas gotas de aceite. Forma bolitas del tamaño de una nuez (aprox 25-30g) y colócalas en una bandeja de horno con papel vegetal dejando 3 cm de separación.","tip":"Crecen bastante en el horno.","durationMinutes":8},{"stepNumber":5,"instruction":"Hornea en horno precalentado a 200°C durante 18-20 minutos hasta que estén inflados y con pequeños puntitos dorados.","tip":"¡Sírvelos INMEDIATAMENTE recién salidos del horno para disfrutar del queso fundente y la corteza crujiente!","durationMinutes":20}],"regionalVariants":[{"name":"Pão de Queijo Recheado com Goiabada (Romero y Julieta)","region":"Minas Gerais","description":"Se abren calientes por la mitad y se rellenan con una lámina de dulce de guayaba (goiabada cascão) para el contraste dulce-salado supremo.","optionalAdditions":["Láminas de dulce de guayaba"]}],"chefTips":["Combina polvilho azedo (para inflar y dejar hueco) con polvilho doce (para dar elasticidad mantecosa)."],"robot":{"servings":6,"factor":1,"note":"El robot escalda y amasa en el mismo vaso: es su receta ideal.","ingredients":["350 g · Polvilho azedo (almidón agrio de yuca) o mezcla al 50% con polvilho doce","200 g · Queso curado rallado fino (Queijo Meia Cura, Gouda curado o Parmesano)","150 ml · Leche entera","70 ml · Aceite de girasol o maíz","50 ml · Agua","2 unidades · Huevos enteros camperos","1 cucharadita rasa · Sal marina fina"],"steps":[{"stepNumber":1,"instruction":"Leche, agua, aceite y sal: 6 min a 100 °C, velocidad 1."},{"stepNumber":2,"instruction":"Añade el polvilho: 30 s a velocidad 4. Deja templar 10 min."},{"stepNumber":3,"instruction":"Añade los huevos de uno en uno y el queso: 2 min en programa amasar."},{"stepNumber":4,"instruction":"Forma bolitas y hornea a 200 °C 18-20 min."}]}},{"id":"pastel-de-feira-brasileiro","title":"Pastel de Feira Crocante","subtitle":"La empanadilla frita gigante de masa hojaldrada con burbujas crujientes","category":"brasilena","categoryLabel":"Comida Brasileña","origin":"São Paulo, Brasil","originFlag":"🇧🇷","desc":"El aroma inconfundible de los mercadillos (feiras) de domingo en Brasil. Una masa finísima con un toque de aguardiente (cachaça) que al freírse se llena de miles de pequeñas burbujas crujientes doradas, rellena de carne picada sazonada con aceitunas y huevo duro picado.","prepTime":25,"cookTime":10,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Crujiente","Frito","Fiesta popular","Carne"],"partyRole":"Pastelillos calientes crujientes para picoteo informal","drinkPairing":"Caldo de cana bien frío o cerveza rubia","ingredients":[{"id":"pf-1","name":"Harina de trigo","amount":300,"unit":"g","category":"panaderia"},{"id":"pf-2","name":"Agua tibia con 1 cdta de sal","amount":150,"unit":"ml","category":"despensa"},{"id":"pf-3","name":"Cachaça o aguardiente blanco (toque secreto para las burbujas)","amount":15,"unit":"ml (1 cda)","category":"despensa"},{"id":"pf-4","name":"Aceite de oliva o manteca","amount":15,"unit":"ml","category":"despensa"},{"id":"pf-5","name":"Carne picada de ternera guisada con cebolla, ajo y tomate","amount":250,"unit":"g","category":"carne_pescado"},{"id":"pf-6","name":"Huevos duros picados","amount":2,"unit":"unidades","category":"lacteo"},{"id":"pf-7","name":"Aceitunas verdes picadas","amount":40,"unit":"g","category":"despensa"},{"id":"pf-8","name":"Aceite abundante para freír","amount":400,"unit":"ml","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"En un bol mezcla la harina, el agua tibia salada, la cachaça y el aceite. Amasa 5 minutos hasta que esté uniforme. Envuelve en film y deja reposar 20 minutos.","tip":"La cachaça se evapora instantáneamente en el aceite caliente creando las famosas ampollas o burbujitas crujientes.","durationMinutes":25},{"stepNumber":2,"instruction":"Estira la masa con rodillo muy fina (1 mm) sobre mesa enharinada. Corta rectángulos de unos 12x8 cm.","tip":"Cuanto más fina esté la masa, más crujiente será el bocado.","durationMinutes":10},{"stepNumber":3,"instruction":"Coloca una porción de relleno de carne con huevo picado y aceitunas en un lado. Dobla y sella los tres bordes aplastando firmemente con las púas de un tenedor.","tip":"Asegúrate de que no haya restos de harina en los bordes para un sellado perfecto.","durationMinutes":5},{"stepNumber":4,"instruction":"Fríe en aceite caliente a 190°C bañando la superficie del pastel con la espumadera para que se formen las ampollas. En 2 minutos estará listo.","tip":"Sirve con salsa de vinagrete brasileño.","durationMinutes":5}],"regionalVariants":[{"name":"Pastel de Palmito Cremoso (Opción Vegetariana)","region":"Litoral brasileño","description":"Relleno de corazones de palmito picados en una salsa cremosa de leche, harina y perejil.","optionalAdditions":["Palmito picado en bechamel suave"]}],"chefTips":["El sellado con el tenedor es característico: hazlo por las dos caras del pastel para que no se abra."],"robot":{"servings":6,"factor":1,"note":"El robot amasa y guisa el relleno de carne.","ingredients":["300 g · Harina de trigo","150 ml · Agua tibia con 1 cdta de sal","15 ml (1 cda) · Cachaça o aguardiente blanco (toque secreto para las burbujas)","15 ml · Aceite de oliva o manteca","250 g · Carne picada de ternera guisada con cebolla, ajo y tomate","2 unidades · Huevos duros picados","40 g · Aceitunas verdes picadas","400 ml · Aceite abundante para freír"],"steps":[{"stepNumber":1,"instruction":"Masa: harina, agua salada, cachaça y aceite: 2 min en programa amasar. Envuelve y reposa 20 min."},{"stepNumber":2,"instruction":"Relleno: carne picada con media cebolla, ajo y tomate, 12 min a 120 °C, velocidad 1 (giro inverso). Deja enfriar y mezcla con huevo duro y aceitunas."},{"stepNumber":3,"instruction":"Estira, rellena y fríe a 190 °C."}]}},{"id":"bolinho-de-bacalhau-brasileiro","title":"Bolinhos de Bacalhau Brasileños","subtitle":"Buñuelos dorados de bacalao desalado, patata cremosa y perejil fresco","category":"brasilena","categoryLabel":"Comida Brasileña","origin":"Río de Janeiro / Bahía, Brasil","originFlag":"🇧🇷","desc":"La herencia portuguesa adaptada a los botecos (bares de tapeo) de Río de Janeiro. Masa aireada y crujiente de bacalao de primera calidad desmigado con patata cocida, cebolla pochada, ajo, huevo y abundante perejil fresco. Se moldean con dos cucharas y se fríen hasta quedar dorados.","prepTime":25,"cookTime":15,"difficulty":"Media","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Tapeo de boteco","Pescado","Tradicional","Crujiente"],"partyRole":"Pase de fritura marina dorada para acompañar cócteles","drinkPairing":"Caipirinha o vino verde portugués bien frío","ingredients":[{"id":"bb-1","name":"Bacalao desalado sin piel ni espinas","amount":350,"unit":"g","category":"carne_pescado"},{"id":"bb-2","name":"Patatas monalisa o agrias cocidas con piel","amount":350,"unit":"g","category":"verdura"},{"id":"bb-3","name":"Cebolla muy picada pochada","amount":0.5,"unit":"unidad","category":"verdura"},{"id":"bb-4","name":"Dientes de ajo rallados","amount":2,"unit":"dientes","category":"verdura"},{"id":"bb-5","name":"Huevos camperos","amount":2,"unit":"unidades","category":"lacteo"},{"id":"bb-6","name":"Perejil y cebollino fresco picados","amount":3,"unit":"cucharadas","category":"verdura"},{"id":"bb-7","name":"Pimienta blanca y nuez moscada","amount":1,"unit":"pizca","category":"especia"},{"id":"bb-8","name":"Aceite de oliva y girasol para freír","amount":400,"unit":"ml","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Cuece el bacalao desalado en agua hirviendo durante 5 minutos. Escurre, retira cualquier espina y desmígalo frotándolo dentro de un paño limpio para separar las hebras finas.","tip":"El bacalao en hebras finas aporta una esponjosidad inigualable.","durationMinutes":10},{"stepNumber":2,"instruction":"Pela las patatas aún calientes y pásalas por pasapurés. En un bol, mezcla el puré de patata con el bacalao desmigado, la cebolla pochada, el ajo, el perejil y las especias.","tip":"No uses batidora eléctrica para no hacer el puré correoso.","durationMinutes":8},{"stepNumber":3,"instruction":"Añade los huevos batidos poco a poco hasta obtener una masa que mantenga la forma. Forma quenelles con dos cucharas soperas pasándolas de una a otra.","tip":"La clásica forma de quenelle es el sello de los botecos cariocas.","durationMinutes":7},{"stepNumber":4,"instruction":"Fríe en aceite caliente a 180°C hasta que estén dorados y crujientes por fuera y jugosos por dentro. Escurre y sirve con rodajas de limón y aceite de oliva.","tip":"Sírvelos bien calientes.","durationMinutes":8}],"regionalVariants":[{"name":"Bolinho con Pimenta Biquinho","region":"Bahía","description":"Se acompaña de salsa de pimientos biquinho encurtidos y aceite de dendê.","optionalAdditions":["Pimientos biquinho"]}],"chefTips":["La proporción perfecta es 50% bacalao y 50% patata: si pones demasiada patata pierde sabor, si pones demasiado bacalao se rompe al freír."],"robot":{"servings":6,"factor":1,"note":"El robot cuece patata y bacalao y mezcla la masa.","ingredients":["350 g · Bacalao desalado sin piel ni espinas","350 g · Patatas monalisa o agrias cocidas con piel","0,5 unidad · Cebolla muy picada pochada","2 dientes · Dientes de ajo rallados","2 unidades · Huevos camperos","3 cucharadas · Perejil y cebollino fresco picados","1 pizca · Pimienta blanca y nuez moscada","400 ml · Aceite de oliva y girasol para freír"],"steps":[{"stepNumber":1,"instruction":"Patatas peladas en trozos en el cestillo con 700 ml de agua en el vaso: 20 min a 100 °C, velocidad 4. A los 15 min añade el bacalao al cestillo."},{"stepNumber":2,"instruction":"Vacía el vaso. Cebolla y ajo con un chorro de aceite: 4 s a velocidad 5 y 5 min a 120 °C, velocidad 1."},{"stepNumber":3,"instruction":"Añade patata, bacalao desmigado, perejil, especias y huevos: 30 s a velocidad 3 (giro inverso)."},{"stepNumber":4,"instruction":"Forma quenelles y fríe a 180 °C."}]}},{"id":"vinagrete-brasileiro-festa","title":"Vinagrete Brasileño para Salgadinhos","subtitle":"El aderezo fresco picado de tomate, pimientos, cebolla y cilantro","category":"brasilena","categoryLabel":"Comida Brasileña","origin":"Brasil","originFlag":"🇧🇷","desc":"La salsa fresca y ácida indispensable en todo churrasco y fiesta brasileña. Tomates firmes, pimientos y cebollas cortados en brunoise microscópica, macerados con vinagre de manzana, aceite virgen extra, zumo de lima y perejil con cilantro. Perfecto para poner una cucharadita encima de los kibes, coxinhas y pastéis.","prepTime":15,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Sin gluten","Refrescante","Condimento"],"partyRole":"Salsa viva para refrescar y acompañar todos los fritos","drinkPairing":"Combina con cualquier bebida de fiesta","ingredients":[{"id":"vb-1","name":"Tomates maduros pero firmes (sin pepitas)","amount":3,"unit":"unidades","category":"verdura"},{"id":"vb-2","name":"Cebolla blanca o morada","amount":1,"unit":"unidad mediana","category":"verdura"},{"id":"vb-3","name":"Pimiento verde italiano","amount":1,"unit":"unidad","category":"verdura"},{"id":"vb-4","name":"Pimiento amarillo dulce (para color festivo)","amount":0.5,"unit":"unidad","category":"verdura"},{"id":"vb-5","name":"Cilantro fresco y perejil picados","amount":4,"unit":"cucharadas","category":"verdura"},{"id":"vb-6","name":"Vinagre de manzana o vino blanco","amount":40,"unit":"ml","category":"despensa"},{"id":"vb-7","name":"Zumo de lima fresca","amount":20,"unit":"ml","category":"verdura"},{"id":"vb-8","name":"Aceite de oliva virgen extra","amount":60,"unit":"ml","category":"despensa"},{"id":"vb-9","name":"Sal marina fina y pimienta","amount":null,"unit":"al gusto","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Retira las semillas de los tomates. Pica los tomates, la cebolla y los pimientos en cubitos minúsculos de 3 milímetros.","tip":"El secreto de un buen vinagrete es el corte fino y uniforme.","durationMinutes":10},{"stepNumber":2,"instruction":"Coloca las verduras en un bol, añade las hierbas picadas, el vinagre, el zumo de lima, el AOVE, sal y pimienta recién molida.","tip":"Mezcla bien y deja reposar en nevera al menos 30 minutos antes de la fiesta.","durationMinutes":5}],"regionalVariants":[{"name":"Vinagrete con Piña Asada","region":"Nordeste de Brasil","description":"Se añaden dados minúsculos de piña natural asada a la plancha para sumar un contraste dulce tropical.","optionalAdditions":["Piña natural en dados"]}],"chefTips":["Sírvelo en cuencos pequeños junto a la bandeja de salgadinhos calientes con cucharas pequeñas."],"robot":{"servings":6,"factor":1,"note":"Pulsa con cuidado: el vinagrete debe quedar en daditos, no triturado.","ingredients":["3 unidades · Tomates maduros pero firmes (sin pepitas)","1 unidad mediana · Cebolla blanca o morada","1 unidad · Pimiento verde italiano","0,5 unidad · Pimiento amarillo dulce (para color festivo)","4 cucharadas · Cilantro fresco y perejil picados","40 ml · Vinagre de manzana o vino blanco","20 ml · Zumo de lima fresca","60 ml · Aceite de oliva virgen extra","al gusto · Sal marina fina y pimienta"],"steps":[{"stepNumber":1,"instruction":"Cebolla y pimientos en trozos: 2 golpes de turbo de 1 s."},{"stepNumber":2,"instruction":"Añade los tomates sin pepitas y las hierbas: 1-2 golpes de turbo."},{"stepNumber":3,"instruction":"Pasa a un bol y aliña con vinagre, lima, aceite, sal y pimienta."}]}},{"id":"guacamole-molcajete-totopos","title":"Guacamole Tradicional en Molcajete","subtitle":"Aguacates Hass maduros machacados con serrano, cilantro y totopos dorados","category":"mexicana","categoryLabel":"Comida Mexicana","origin":"Michoacán / México","originFlag":"🇲🇽","desc":"El auténtico guacamole mexicano de fiesta. Sin mayonesas ni añadidos artificiales: aguacates Hass en su punto exacto de maduración, majados a mano en mortero de piedra volcánica con cebolla blanca, chile serrano fresco, sal de grano, zumo de lima y cilantro. Acompañado de totopos caseros de maíz fritos al momento.","prepTime":15,"cookTime":5,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Sin gluten","Rey del dipeo","Fresco"],"partyRole":"Dip mexicano central imprescindible para abrir el apetito","drinkPairing":"Margarita clásica con sal y lima, michelada o cerveza mexicana fría","ingredients":[{"id":"gm-1","name":"Aguacates Hass maduros de piel rugosa y oscura","amount":4,"unit":"unidades grandes","category":"verdura"},{"id":"gm-2","name":"Cebolla blanca finamente picada","amount":0.5,"unit":"unidad","category":"verdura"},{"id":"gm-3","name":"Chile serrano fresco picado (con o sin venas según picor)","amount":2,"unit":"chiles","category":"verdura"},{"id":"gm-4","name":"Tomate rojo bola o saladette sin semillas picado","amount":1,"unit":"unidad","category":"verdura"},{"id":"gm-5","name":"Cilantro fresco picado (hojas y tallos tiernos)","amount":4,"unit":"cucharadas","category":"verdura"},{"id":"gm-6","name":"Zumo de lima recién exprimido","amount":25,"unit":"ml (aprox 1 lima y media)","category":"verdura"},{"id":"gm-7","name":"Sal de grano marina","amount":1,"unit":"cucharadita rasa","category":"especia"},{"id":"gm-8","name":"Tortillas de maíz para totopos","amount":12,"unit":"tortillas cortadas en triángulos","category":"panaderia"},{"id":"gm-9","name":"Aceite vegetal para freír totopos","amount":200,"unit":"ml","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"En un molcajete o mortero amplio, maja la mitad de la cebolla picada con los chiles serranos, la mitad del cilantro y la sal de grano hasta crear una pasta aromática jugosa.","tip":"Majar primero las aromáticas libera sus aceites esenciales y perfuma todo el aguacate.","durationMinutes":4},{"stepNumber":2,"instruction":"Corta los aguacates por la mitad, retira el hueso y saca la pulpa con una cuchara directamente al molcajete.","tip":"Machaca con el mazo o con un tenedor dejando tropezones rústicos visibles; ¡el auténtico guacamole nunca es un puré de papilla!","durationMinutes":3},{"stepNumber":3,"instruction":"Añade el zumo de lima, el resto de la cebolla picada, el tomate en cubitos y el resto del cilantro. Mezcla con suavidad.","tip":"Prueba y ajusta de sal y lima.","durationMinutes":3},{"stepNumber":4,"instruction":"Para los totopos: corta las tortillas de maíz en 6 triángulos cada una. Fríelas en aceite caliente a 180°C durante 2 minutos hasta que estén doradas y crujientes. Escurre sobre papel y espolvorea sal fina inmediatamente.","tip":"Los totopos caseros calientes superan a cualquier bolsa de nachos comerciales.","durationMinutes":5}],"regionalVariants":[{"name":"Guacamole con Granada y Queso Cotija","region":"Ciudad de México","description":"Coronado con granos de granada dulce y queso cotija o queso añejo seco espolvoreado.","optionalAdditions":["Granada fresca","Queso cotija seco"]}],"chefTips":["Si preparas el guacamole con 1 hora de antelación, cubre la superficie con film plástico en contacto directo con la pulpa para que no se oxide con el aire."],"robot":{"servings":6,"factor":1,"note":"El robot sustituye al molcajete. Los totopos, en sartén.","ingredients":["4 unidades grandes · Aguacates Hass maduros de piel rugosa y oscura","0,5 unidad · Cebolla blanca finamente picada","2 chiles · Chile serrano fresco picado (con o sin venas según picor)","1 unidad · Tomate rojo bola o saladette sin semillas picado","4 cucharadas · Cilantro fresco picado (hojas y tallos tiernos)","25 ml (aprox 1 lima y media) · Zumo de lima recién exprimido","1 cucharadita rasa · Sal de grano marina","12 tortillas cortadas en triángulos · Tortillas de maíz para totopos","200 ml · Aceite vegetal para freír totopos"],"steps":[{"stepNumber":1,"instruction":"Mitad de la cebolla, chiles, mitad del cilantro y sal: 5 s a velocidad 6."},{"stepNumber":2,"instruction":"Añade el aguacate y la lima: 5 s a velocidad 4. Debe quedar con tropezones."},{"stepNumber":3,"instruction":"Añade el resto de cebolla, tomate y cilantro: 5 s a velocidad 2 (giro inverso)."},{"stepNumber":4,"instruction":"Fríe los totopos en sartén."}]}},{"id":"tinga-pollo-poblana","title":"Tinga de Pollo Poblana para Tacos y Tostadas","subtitle":"Pollo deshebrado en salsa reducida de tomate asado, cebolla caramelizada y chipotle","category":"mexicana","categoryLabel":"Comida Mexicana","origin":"Puebla, México","originFlag":"🇲🇽","desc":"El relleno más festivo y celebrado de las taquizas mexicanas. Pechuga de pollo deshebrada cocinada a fuego lento en una salsa rica y ahumada de tomates asados con chiles chipotles en adobo, con abundante cebolla caramelizada que aporta un dulzor fascinante. Ideal para que cada invitado se arme sus tacos o tostadas.","prepTime":20,"cookTime":30,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80","tags":["Ahumado","Sin gluten","Fiesta taquiza","Alto en proteína"],"partyRole":"Guiso estrella caliente para autoservicio de tacos y tostadas","drinkPairing":"Cerveza oscura tipo Modelo Negra o agua fresca de jamaica","ingredients":[{"id":"tp-1","name":"Pechuga de pollo cocida y deshebrada en hebras finas","amount":600,"unit":"g","category":"carne_pescado"},{"id":"tp-2","name":"Cebollas blancas grandes cortadas en pluma fina","amount":2,"unit":"unidades","category":"verdura"},{"id":"tp-3","name":"Tomates maduros asados al comal o sartén","amount":4,"unit":"unidades","category":"verdura"},{"id":"tp-4","name":"Chiles chipotles adobados de lata (al gusto de picor)","amount":2,"unit":"chiles más 1 cda del adobo","category":"despensa"},{"id":"tp-5","name":"Dientes de ajo asados","amount":2,"unit":"dientes","category":"verdura"},{"id":"tp-6","name":"Caldo de pollo","amount":150,"unit":"ml","category":"despensa"},{"id":"tp-7","name":"Orégano mexicano seco","amount":1,"unit":"cucharadita","category":"especia"},{"id":"tp-8","name":"Aceite vegetal o manteca","amount":40,"unit":"ml","category":"despensa"},{"id":"tp-9","name":"Tostadas crujientes o tortillas de maíz para taquear","amount":12,"unit":"unidades","category":"panaderia"},{"id":"tp-10","name":"Crema agria mexicana (o crème fraîche) y queso fresco desmoronado","amount":null,"unit":"para coronar","category":"lacteo"}],"steps":[{"stepNumber":1,"instruction":"Asa los tomates y los ajos en una sartén seca hasta que la piel se dore y tateme. Pásalos a la licuadora con los chiles chipotles, una cucharada del adobo, el caldo de pollo y el orégano. Tritura hasta tener una salsa lisa.","tip":"Tatemar los tomates aporta la profundidad ahumada imprescindible de la tinga.","durationMinutes":8},{"stepNumber":2,"instruction":"En una cazuela ancha, calienta el aceite y pocha la cebolla en juliana a fuego medio durante 10-12 minutos hasta que esté translúcida y dorada.","tip":"La cebolla abundante caramelizada equilibra el picor ahumado del chipotle.","durationMinutes":12},{"stepNumber":3,"instruction":"Vierte la salsa de chipotle sobre la cebolla y cocina 5 minutos a fuego vivo para que reduzca y cambie a un rojo más intenso.","tip":"Verás pequeñas gotas de aceite separarse en los bordes.","durationMinutes":5},{"stepNumber":4,"instruction":"Agrega el pollo deshebrado y sal al gusto. Cocina a fuego lento durante 10-15 minutos removiendo para que el pollo absorba toda la salsa.","tip":"La tinga debe quedar jugosa pero no caldosa para que no reblandezca las tostadas.","durationMinutes":10}],"regionalVariants":[{"name":"Tinga de Res o Ternera","region":"Oaxaca y Centro de México","description":"Elaborada con falda de ternera cocida deshebrada en hebras finas en lugar de pollo.","optionalAdditions":["Carne de ternera cocida deshebrada"]}],"chefTips":["Móntalas en una barra de fiesta: pon el bol caliente de tinga en el centro, y platos con tostadas, frijoles refritos, crema, lechuga picada y queso para que cada invitado se arme la suya."],"robot":{"servings":4,"factor":0.75,"note":"El robot cuece el pollo, hace la salsa de chipotle y guisa todo.","ingredients":["450 g · Pechuga de pollo cocida y deshebrada en hebras finas","1,5 unidades · Cebollas blancas grandes cortadas en pluma fina","3 unidades · Tomates maduros asados al comal o sartén","1,5 chiles más 1 cda del adobo · Chiles chipotles adobados de lata (al gusto de picor)","1,5 dientes · Dientes de ajo asados","110 ml · Caldo de pollo","0,75 cucharadita · Orégano mexicano seco","30 ml · Aceite vegetal o manteca","9 unidades · Tostadas crujientes o tortillas de maíz para taquear","para coronar · Crema agria mexicana (o crème fraîche) y queso fresco desmoronado"],"steps":[{"stepNumber":1,"instruction":"Tomates en cuartos, ajos, chipotles, adobo, caldo y orégano: 1 min a velocidad 8. Reserva la salsa."},{"stepNumber":2,"instruction":"Cebolla en pluma a cuchillo con el aceite: 12 min a 120 °C, velocidad 1 (giro inverso)."},{"stepNumber":3,"instruction":"Añade la salsa: 6 min a 110 °C, velocidad 1, sin cubilete."},{"stepNumber":4,"instruction":"Añade el pollo cocido y deshebrado y la sal: 10 min a 100 °C, velocidad 1 (giro inverso)."}]}},{"id":"queso-fundido-chorizo-mexicano","title":"Queso Fundido con Chorizo y Rajas","subtitle":"Cazuela hirviendo de quesos Oaxaca y Chihuahua con chorizo dorado y chiles","category":"mexicana","categoryLabel":"Comida Mexicana","origin":"Norte y Centro de México","originFlag":"🇲🇽","desc":"La botana caliente más irresistible del picoteo mexicano. Quesos elásticos y aromáticos (tipo Oaxaca, Chihuahua o mezcla con Mozzarella y Gouda) fundidos al horno en cazuela de barro, coronados con crujiente chorizo mexicano desmenuzado y tiras de chile poblano asado.","prepTime":15,"cookTime":15,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Queso fundente","Sin gluten","Caliente","Sabor potente"],"partyRole":"Cazuela burbujeante para envolver con tortillas calientes de harina o maíz","drinkPairing":"Cerveza clara con limón o cóctel Paloma con tequila y pomelo","ingredients":[{"id":"qf-1","name":"Queso Oaxaca o queso hebra mexicano (o mezcla de mozzarella y provolone)","amount":250,"unit":"g deshebrado","category":"lacteo"},{"id":"qf-2","name":"Queso Chihuahua o Gouda curado rallado","amount":150,"unit":"g","category":"lacteo"},{"id":"qf-3","name":"Chorizo fresco mexicano de cerdo (especiado con chile y vinagre)","amount":200,"unit":"g sin piel","category":"carne_pescado"},{"id":"qf-4","name":"Chile poblano asado en tiras (rajas)","amount":1,"unit":"chile","category":"verdura"},{"id":"qf-5","name":"Cebolla blanca picada","amount":0.5,"unit":"unidad","category":"verdura"},{"id":"qf-6","name":"Tortillas de harina de trigo o maíz recién calentadas","amount":12,"unit":"unidades","category":"panaderia"}],"steps":[{"stepNumber":1,"instruction":"En una sartén, desmenuza el chorizo sin piel y cocínalo a fuego medio durante 8 minutos hasta que esté bien dorado y crujiente. Escurre el exceso de grasa y reserva.","tip":"Si usas rajas de poblano o cebolla, saltéalas en la misma grasita del chorizo.","durationMinutes":8},{"stepNumber":2,"instruction":"En una cazuela apta para horno (de barro o hierro), mezcla los quesos rallados de manera homogénea.","tip":"Usar una mezcla de queso que estira (tipo mozzarella/Oaxaca) con otro que aporte sabor profundo (tipo gouda/chihuahua) es el secreto de los restaurantes.","durationMinutes":2},{"stepNumber":3,"instruction":"Hornea a 200°C durante 10-12 minutos hasta que el queso esté completamente derretido y burbujeante. Pon el grill los últimos 2 minutos para dorar los bordes.","tip":"Debe formar una costra doradita en las orillas.","durationMinutes":12},{"stepNumber":4,"instruction":"Saca la cazuela del horno, echa por encima el chorizo crujiente caliente y las rajas de poblano. Sirve inmediatamente con una cesta de tortillas de harina calientes.","tip":"Cada invitado coge una tortilla y se hace un taco enrollando el queso estirado.","durationMinutes":2}],"regionalVariants":[{"name":"Queso Fundido con Champiñones al Epazote (Opción Vegetariana)","region":"Ciudad de México","description":"Se sustituye el chorizo por champiñones salteados con ajo y hojas de epazote fresco.","optionalAdditions":["200g champiñones al ajillo con epazote"]}],"chefTips":["Se debe comer al momento para que el queso conserve su maravillosa elasticidad."],"robot":{"servings":6,"factor":1,"note":"El robot hace el chorizo. El queso se gratina mejor al horno.","ingredients":["250 g deshebrado · Queso Oaxaca o queso hebra mexicano (o mezcla de mozzarella y provolone)","150 g · Queso Chihuahua o Gouda curado rallado","200 g sin piel · Chorizo fresco mexicano de cerdo (especiado con chile y vinagre)","1 chile · Chile poblano asado en tiras (rajas)","0,5 unidad · Cebolla blanca picada","12 unidades · Tortillas de harina de trigo o maíz recién calentadas"],"steps":[{"stepNumber":1,"instruction":"Chorizo desmenuzado y cebolla: 8 min a 120 °C, velocidad 1 (giro inverso). Escurre la grasa."},{"stepNumber":2,"instruction":"Mezcla los quesos en una cazuela de barro y hornea a 200 °C 10-12 min."},{"stepNumber":3,"instruction":"Cubre con el chorizo y las rajas y sirve con tortillas."}]}},{"id":"pico-de-gallo-mango-serrano","title":"Pico de Gallo con Mango y Chile Serrano","subtitle":"Salsa fresca de fiesta con contraste dulce y picante cítrico","category":"mexicana","categoryLabel":"Comida Mexicana","origin":"Península de Yucatán / México","originFlag":"🇲🇽","desc":"La evolución más alegre del pico de gallo tradicional. Dados dulces de mango maduro pero firme combinados con tomates rojos, cebolla morada picada, chiles serranos verdes, cilantro fresco y zumo de lima. Aporta un estallido de color, dulzor y frescor para coronar tacos o comer con totopos.","prepTime":15,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Sin gluten","Frutal","Rápido"],"partyRole":"Guarnición vibrante y salsa fresca para contrastar guisos pesados","drinkPairing":"Cerveza Corona con lima o cóctel Mezcalita","ingredients":[{"id":"pg-1","name":"Mango maduro pero firme cortado en cubitos pequeños","amount":1,"unit":"unidad grande (aprox 300g)","category":"verdura"},{"id":"pg-2","name":"Tomates maduros firmes sin pepitas en cubitos","amount":2,"unit":"unidades","category":"verdura"},{"id":"pg-3","name":"Cebolla morada finamente picada","amount":0.5,"unit":"unidad","category":"verdura"},{"id":"pg-4","name":"Chile serrano o jalapeño verde picado fino","amount":1.5,"unit":"chiles","category":"verdura"},{"id":"pg-5","name":"Cilantro fresco picado","amount":4,"unit":"cucharadas","category":"verdura"},{"id":"pg-6","name":"Zumo de lima fresca","amount":30,"unit":"ml","category":"verdura"},{"id":"pg-7","name":"Aceite de oliva virgen extra","amount":15,"unit":"ml","category":"despensa"},{"id":"pg-8","name":"Sal marina y pizca de chile tajín (opcional)","amount":1,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Pela el mango y córtalo en dados regulares de 0,5 cm. Corta el tomate y la cebolla morada en dados del mismo tamaño.","tip":"La uniformidad en el corte es lo que hace que cada bocado tenga un balance perfecto de sabores.","durationMinutes":10},{"stepNumber":2,"instruction":"En un bol hondo, mezcla suavemente el mango, el tomate, la cebolla morada, el serrano y el cilantro.","tip":"Aliña con el zumo de lima, el chorrito de AOVE y la sal marina.","durationMinutes":3},{"stepNumber":3,"instruction":"Deja reposar en la nevera 20 minutos antes de servir para que la cebolla morada se macere con la lima y pierda agresividad.","tip":"Corona con una pizca de chile Tajín para un toque mexicano callejero.","durationMinutes":2}],"regionalVariants":[{"name":"Pico de Gallo con Piña Asada","region":"Costas de Oaxaca","description":"Sustituye el mango por piña previamente asada al comal con una pizca de canela.","optionalAdditions":["Piña asada en dados"]}],"chefTips":["Es el complemento perfecto para la tinga de pollo o para acompañar pescados a la brasa."],"robot":{"servings":6,"factor":1,"note":"Solo pica el chile y la cebolla: el mango y el tomate van mejor a cuchillo.","ingredients":["1 unidad grande (aprox 300g) · Mango maduro pero firme cortado en cubitos pequeños","2 unidades · Tomates maduros firmes sin pepitas en cubitos","0,5 unidad · Cebolla morada finamente picada","1,5 chiles · Chile serrano o jalapeño verde picado fino","4 cucharadas · Cilantro fresco picado","30 ml · Zumo de lima fresca","15 ml · Aceite de oliva virgen extra","1 cucharadita · Sal marina y pizca de chile tajín (opcional)"],"steps":[{"stepNumber":1,"instruction":"Cebolla morada y serrano: 3 s a velocidad 5."},{"stepNumber":2,"instruction":"Pasa a un bol con el mango, el tomate en dados y el cilantro, y aliña con lima, aceite y sal."}]}},{"id":"aguachile-verde-camaron","title":"Aguachile Verde de Camarón al Cilantro","subtitle":"Gambas o langostinos frescos marinados al momento en caldo verde de lima y serrano","category":"mexicana","categoryLabel":"Comida Mexicana","origin":"Sinaloa, México","originFlag":"🇲🇽","desc":"El ceviche supremo del Pacífico mexicano. Langostinos crudos pelados en mariposa, marinados en una emulsión helada de zumo de lima recién exprimido, chiles serranos, cilantro fresco y pepino. Acompañado de medialunas de pepino crujiente y cebolla morada desangrada.","prepTime":20,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Marisco fresco","Sin gluten","Picante fresco","Gourmet"],"partyRole":"Plato frío refrescante de lujo para empezar el banquete","drinkPairing":"Cerveza Pacífico bien helada con sal o vino blanco Albariño fresco","ingredients":[{"id":"ac-1","name":"Colas de langostinos o gambas frescas de máxima calidad","amount":500,"unit":"g peladas y desvenadas","category":"carne_pescado"},{"id":"ac-2","name":"Zumo de lima recién exprimido","amount":150,"unit":"ml (aprox 6-7 limas)","category":"verdura"},{"id":"ac-3","name":"Chiles serranos verdes frescos","amount":2,"unit":"chiles","category":"verdura"},{"id":"ac-4","name":"Manojo de cilantro fresco limpio","amount":1,"unit":"taza colmada","category":"verdura"},{"id":"ac-5","name":"Pepino pelado y cortado en medialunas delgadas","amount":1,"unit":"unidad","category":"verdura"},{"id":"ac-6","name":"Cebolla morada cortada en juliana finísima (pluma)","amount":0.5,"unit":"unidad","category":"verdura"},{"id":"ac-7","name":"Diente de ajo pequeño","amount":0.5,"unit":"diente","category":"verdura"},{"id":"ac-8","name":"Sal de grano marina y pimienta negra molida","amount":1,"unit":"cucharadita","category":"especia"},{"id":"ac-9","name":"Aguacate maduro en láminas para decorar","amount":1,"unit":"unidad","category":"verdura"},{"id":"ac-10","name":"Tostadas crujientes de maíz","amount":10,"unit":"unidades","category":"panaderia"}],"steps":[{"stepNumber":1,"instruction":"Limpia los langostinos: córtalos por el lomo longitudinalmente en forma de mariposa retirando el conducto intestinal. Colócalos bien extendidos en una fuente llana bien fría.","tip":"Sazónalos con sal marina y déjalos en la nevera 10 minutos.","durationMinutes":10},{"stepNumber":2,"instruction":"En la licuadora, pon el zumo de lima fresco, los chiles serranos, el cilantro fresco, medio pepino troceado, el medio diente de ajo y una cucharadita de sal. Licúa a máxima potencia durante 1 minuto hasta tener un caldo verde esmeralda brillante y líquido.","tip":"Si añades 1 cubito de hielo a la licuadora, el color verde del cilantro quedará fosforito e intacto.","durationMinutes":3},{"stepNumber":3,"instruction":"Vierte el aguachile verde colado sobre los langostinos en la fuente. Añade las medialunas de pepino y la cebolla morada por encima.","tip":"El ácido de la lima cocina la carne translúcida de los langostinos en apenas 10-15 minutos dejándolos de un blanco nacarado y textura tierna.","durationMinutes":5},{"stepNumber":4,"instruction":"Decora con abanicos de aguacate fresco y sirve de inmediato con tostadas de maíz crujientes.","tip":"El aguachile nunca debe reposar horas: se come recién marinado y helado.","durationMinutes":2}],"regionalVariants":[{"name":"Aguachile Negro de Chiltepín","region":"Sonora","description":"Se elabora con chiles chiltepines tostados en cazuela con salsa inglesa y salsa de soja, dando un color oscuro ahumado espectacular.","optionalAdditions":["Salsa de soja","Chiltepines secos tostados"]}],"chefTips":["Al ser marisco semicurado en ácido, usa siempre producto fresco de máxima confianza o congelado previamente."],"robot":{"servings":6,"factor":1,"note":"El robot hace el aguachile en segundos.","ingredients":["500 g peladas y desvenadas · Colas de langostinos o gambas frescas de máxima calidad","150 ml (aprox 6-7 limas) · Zumo de lima recién exprimido","2 chiles · Chiles serranos verdes frescos","1 taza colmada · Manojo de cilantro fresco limpio","1 unidad · Pepino pelado y cortado en medialunas delgadas","0,5 unidad · Cebolla morada cortada en juliana finísima (pluma)","0,5 diente · Diente de ajo pequeño","1 cucharadita · Sal de grano marina y pimienta negra molida","1 unidad · Aguacate maduro en láminas para decorar","10 unidades · Tostadas crujientes de maíz"],"steps":[{"stepNumber":1,"instruction":"Lima, serranos, cilantro, medio pepino, ajo y sal: 1 min a velocidad 9. Cuela."},{"stepNumber":2,"instruction":"Vierte sobre los langostinos abiertos, añade pepino y cebolla, y sirve enseguida."}]}},{"id":"ensalada-fattoush-libanesa","title":"Ensalada Fattoush Libanesa con Pita Tostada","subtitle":"La ensalada más crujiente de Oriente Medio con aliño cítrico de zumaque","category":"ensaladas","categoryLabel":"Ensaladas","origin":"Líbano / Oriente Próximo","originFlag":"🇱🇧","desc":"La reina indiscutible de las ensaladas de la mesa mezze. Nació del sabio aprovechamiento del pan de pita del día anterior, tostado o frito hasta quedar crujiente, mezclado con lechuga romana crujiente, pepinos libaneses, rabanitos rosados picantes, hierbabuena fresca y un aderezo magistral de zumaque (sumac), melaza de granada y aceite virgen extra.","prepTime":20,"cookTime":5,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Crujiente","Refrescante","Mezze estrella"],"partyRole":"Ensalada crujiente central para limpiar el paladar entre platos","drinkPairing":"Limonada libanesa con agua de azahar y menta o vino blanco fresco","ingredients":[{"id":"ef-1","name":"Panes de pita artesanos (preferiblemente del día anterior)","amount":2,"unit":"unidades","category":"panaderia"},{"id":"ef-2","name":"Lechuga romana fresca crujiente troceada","amount":1,"unit":"cogollo grande","category":"verdura"},{"id":"ef-3","name":"Pepinos medianos firmes cortados en cuartos","amount":2,"unit":"unidades","category":"verdura"},{"id":"ef-4","name":"Rabanitos frescos cortados en láminas finas","amount":6,"unit":"unidades","category":"verdura"},{"id":"ef-5","name":"Tomates cherry maduros cortados por la mitad","amount":200,"unit":"g","category":"verdura"},{"id":"ef-6","name":"Hojas de hierbabuena fresca limpias","amount":0.5,"unit":"taza colmada","category":"verdura"},{"id":"ef-7","name":"Perejil fresco picado grueso","amount":0.5,"unit":"taza","category":"verdura"},{"id":"ef-8","name":"Cebolletas tiernas cortadas en aros finos","amount":2,"unit":"unidades","category":"verdura"},{"id":"ef-9","name":"Zumaque molido (Sumac)","amount":2,"unit":"cucharadas soperas","category":"especia"},{"id":"ef-10","name":"Melaza de granada espesa","amount":2,"unit":"cucharadas","category":"despensa"},{"id":"ef-11","name":"Zumo de limón fresco","amount":35,"unit":"ml","category":"verdura"},{"id":"ef-12","name":"Aceite de oliva virgen extra","amount":60,"unit":"ml","category":"despensa"},{"id":"ef-13","name":"Diente de ajo pequeño machacado","amount":1,"unit":"diente","category":"verdura"},{"id":"ef-14","name":"Sal marina","amount":1,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Corta el pan de pita en cuadritos de 2 cm. Pincélalos con un chorrito de AOVE y espolvorea 1 cucharada de zumaque. Hornéalos a 190°C durante 6-8 minutos hasta que estén dorados y ultra crujientes. Deja enfriar.","tip":"Si lo prefieres al estilo callejero libanés, puedes freír los cuadritos de pan en aceite caliente durante 1 minuto.","durationMinutes":8},{"stepNumber":2,"instruction":"En una ensaladera amplia, junta la lechuga romana limpia y bien seca, los pepinos, los rabanitos en rodajas, los tomates cherry, las hojas enteras de hierbabuena, el perejil y las cebolletas.","tip":"Tener las verduras bien secas es clave para que el aliño no resbale.","durationMinutes":8},{"stepNumber":3,"instruction":"En un frasco con tapa, prepara la vinagreta agitando: el AOVE, zumo de limón, melaza de granada, el diente de ajo machacado, 1 cucharada de zu
