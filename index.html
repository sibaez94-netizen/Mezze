maque y la sal.","tip":"La emulsión debe quedar de un color púrpura oscuro y con un perfil ácido delicioso.","durationMinutes":2},{"stepNumber":4,"instruction":"Justo en el momento de servir en la mesa de la fiesta, vierte el aliño sobre las verduras, añade los chips crujientes de pan de pita y remueve suavemente.","tip":"Nunca agregues el pan ni el aliño con horas de antelación o el pan perderá su mordisco crujiente.","durationMinutes":2}],"regionalVariants":[{"name":"Fattoush con Verdolaga Fresca (Baqleh)","region":"Beirut y Trípoli","description":"La versión tradicional de primavera añade brotes tiernos de verdolaga, una hierba suculenta ligeramente ácida imprescindible en los hogares libaneses.","optionalAdditions":["Hojas de verdolaga fresca"]}],"chefTips":["El zumaque es una baya rojiza molida con acidez cítrica que no amarga; si no tienes, potencia con ralladura fina de limón."],"robot":{"servings":6,"factor":1,"note":"Ensalada en crudo: el robot solo emulsiona la vinagreta.","ingredients":["2 unidades · Panes de pita artesanos (preferiblemente del día anterior)","1 cogollo grande · Lechuga romana fresca crujiente troceada","2 unidades · Pepinos medianos firmes cortados en cuartos","6 unidades · Rabanitos frescos cortados en láminas finas","200 g · Tomates cherry maduros cortados por la mitad","0,5 taza colmada · Hojas de hierbabuena fresca limpias","0,5 taza · Perejil fresco picado grueso","2 unidades · Cebolletas tiernas cortadas en aros finos","2 cucharadas soperas · Zumaque molido (Sumac)","2 cucharadas · Melaza de granada espesa","35 ml · Zumo de limón fresco","60 ml · Aceite de oliva virgen extra","1 diente · Diente de ajo pequeño machacado","1 cucharadita · Sal marina"],"steps":[{"stepNumber":1,"instruction":"Vinagreta: aceite, limón, melaza de granada, ajo, zumaque y sal: 15 s a velocidad 5."},{"stepNumber":2,"instruction":"Tuesta la pita al horno y monta la ensalada como en la receta original."}]}},{"id":"taboule-libanes-tradicional","title":"Taboulé Tradicional de Hierbas Frescas","subtitle":"La ensalada verde auténtica: 80% perejil y hierbabuena con toque de trigo fino","category":"ensaladas","categoryLabel":"Ensaladas","origin":"Líbano / Siria","originFlag":"🇱🇧","desc":"El auténtico taboulé de las montañas del Líbano. Nada que ver con las ensaladas comerciales de cuscús: aquí el rey absoluto es el perejil fresco de hoja lisa cortado minuciosamente a cuchillo, con hojas de hierbabuena fresca, tomate maduro picado en dados milimétricos, una cantidad mínima de trigo burgol fino hidratado en zumo de limón y abundante AOVE.","prepTime":25,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Bomba de antioxidantes","Fresco","Tradicional"],"partyRole":"Ensalada herbal fresca para servir con hojas de cogollos como barquitas","drinkPairing":"Arak con agua y hielo o vino blanco bien frío","ingredients":[{"id":"tb-1","name":"Manojos grandes de perejil fresco de hoja lisa","amount":3,"unit":"manojos (aprox 250g hojas limpias)","category":"verdura"},{"id":"tb-2","name":"Hierbabuena fresca limpia","amount":1,"unit":"manojo (aprox 50g hojas)","category":"verdura"},{"id":"tb-3","name":"Trigo burgol fino (nº 1)","amount":40,"unit":"g (aprox 3 cucharadas)","category":"despensa"},{"id":"tb-4","name":"Tomates maduros pero firmes cortados en brunoise fina","amount":3,"unit":"unidades","category":"verdura"},{"id":"tb-5","name":"Cebolletas tiernas con su parte verde","amount":3,"unit":"unidades picadas fino","category":"verdura"},{"id":"tb-6","name":"Zumo de limón recién exprimido","amount":60,"unit":"ml (aprox 2 limones)","category":"verdura"},{"id":"tb-7","name":"Aceite de oliva virgen extra de máxima calidad","amount":80,"unit":"ml","category":"despensa"},{"id":"tb-8","name":"Pimienta de Jamaica molida y pizca de canela","amount":0.5,"unit":"cucharadita","category":"especia"},{"id":"tb-9","name":"Sal marina fina","amount":1,"unit":"cucharadita","category":"especia"},{"id":"tb-10","name":"Cogollos de lechuga romana tiernos para acompañar","amount":2,"unit":"cogollos","category":"verdura"}],"steps":[{"stepNumber":1,"instruction":"Pon el trigo burgol fino en un cuenco pequeño y cúbrelo con el zumo de limón recién exprimido y sal. Deja que se hidrate 15 minutos en el propio zumo; se ablandará sin necesidad de cocerlo ni añadir agua.","tip":"El trigo absorberá el zumo de limón y se hinchará aportando una acidez limpia.","durationMinutes":15},{"stepNumber":2,"instruction":"Lava muy bien las hojas de perejil y hierbabuena y sécalas al 100% con centrifugadora de ensaladas y papel de cocina.","tip":"Si picas el perejil húmedo, se machacará y soltará agua amarga en lugar de quedar suelto y aromático.","durationMinutes":10},{"stepNumber":3,"instruction":"Con un cuchillo de chef muy afilado, pica el perejil y la hierbabuena en un solo corte limpio sin repicar encima.","tip":"El corte a cuchillo fino es el arte del taboulé: nunca uses procesador eléctrico o crearás una papilla.","durationMinutes":10},{"stepNumber":4,"instruction":"En un bol hondo mezcla el perejil y menta picados con el tomate en dados, la cebolleta, el trigo hinchado en limón y las especias. Riega con el AOVE y mezcla suavemente.","tip":"Sírvelo acompañado de hojas de cogollo de lechuga limpias para que los invitados las usen como cucharas comestibles.","durationMinutes":3}],"regionalVariants":[{"name":"Taboulé con Granada Fresca","region":"Siria y Armenia","description":"Se añaden granos de granada agridulce que explotan en boca y suman un contraste rojo bellísimo.","optionalAdditions":["Granos de granada fresca"]}],"chefTips":["Recuerda: el taboulé auténtico es una ensalada de perejil con un toque de trigo, NO una ensalada de trigo con perejil."],"robot":{"servings":6,"factor":1,"note":"El perejil se pica a cuchillo para que no se oxide. El robot hace el aliño.","ingredients":["3 manojos (aprox 250g hojas limpias) esca."}]}},{"id":"ensalada-caprese-burrata-pesto","title":"Caprese de Fiesta con Burrata de Puglia y Pesto Casero","subtitle":"Tomates cherry multicolores, burrata cremosa, albahaca y piñones tostados","category":"ensaladas","categoryLabel":"Ensaladas","origin":"Campania / Puglia, Italia","originFlag":"🇮🇹","desc":"La ensalada tricolor más elegante y vistosa del Mediterráneo en su versión para fiesta. Un tapiz de tomates reliquia y cherry de colores confitados y frescos, coronados con una gran bola de cremosa burrata de Puglia, cucharaditas de pesto genovés recién majado, piñones tostados crujientes y reducción balsámica de Módena.","prepTime":15,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegetariano","Sin gluten","Gourmet","Rápido"],"partyRole":"Plato fresco elegante para deslumbrar a la vista","drinkPairing":"Prosecco italiano brut o vino blanco Pinot Grigio","ingredients":[{"id":"cp-1","name":"Burrata fresca artesanal de Puglia","amount":2,"unit":"bolas de 150g (300g total)","category":"lacteo"},{"id":"cp-2","name":"Tomates variados de colores (cherry rojos, amarillos, kumato y raf)","amount":500,"unit":"g","category":"verdura"},{"id":"cp-3","name":"Hojas frescas de albahaca genovesa","amount":1,"unit":"taza colmada","category":"verdura"},{"id":"cp-4","name":"Piñones tostados","amount":30,"unit":"g","category":"despensa"},{"id":"cp-5","name":"Parmesano Reggiano rallado fino (para el pesto)","amount":30,"unit":"g","category":"lacteo"},{"id":"cp-6","name":"Aceite de oliva virgen extra monovarietal","amount":70,"unit":"ml","category":"despensa"},{"id":"cp-7","name":"Diente de ajo pequeño","amount":0.5,"unit":"diente","category":"verdura"},{"id":"cp-8","name":"Reducción de vinagre balsámico de Módena I.G.P.","amount":20,"unit":"ml en hilo","category":"despensa"},{"id":"cp-9","name":"Flor de sal o sal en escamas y pimienta negra","amount":1,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Para el pesto exprés: en un mortero o picadora pequeña, procesa la albahaca con los piñones, el medio diente de ajo, el parmesano rallado y el AOVE hasta tener una salsa verde esmeralda aromática.","tip":"Añadir una gota de zumo de limón preserva el color verde vibrante de la albahaca.","durationMinutes":5},{"stepNumber":2,"instruction":"Corta los tomates variados en mitades, rodajas y cuartos creando un tapiz de formas y colores sobre una bandeja llana amplia.","tip":"Sazona los tomates con flor de sal y un chorro de buen AOVE.","durationMinutes":5},{"stepNumber":3,"instruction":"Coloca las bolas de burrata en el centro sobre el lecho de tomates. Haz un corte en cruz sobre la parte superior de cada burrata para dejar ver su cremoso corazón de stracciatella.","tip":"Corona con cucharaditas de pesto, hojas de albahaca fresca enteras, piñones tostados y un fino hilo de reducción balsámica.","durationMinutes":3}],"regionalVariants":[{"name":"Caprese con Higos Frescos o Melocotón a la Plancha","region":"Costa Amalfitana","description":"En temporada de verano se incorporan higos maduros abiertos en flor o gajos de melocotón marcados en sartén.","optionalAdditions":["Higos frescos o melocotón a la plancha"]}],"chefTips":["Saca la burrata de la nevera 30 minutos antes de servir: a temperatura ambiente la crema interior fluye con máxima untuosidad."],"robot":{"servings":6,"factor":1,"note":"El robot hace el pesto. Con el vaso frío, la albahaca no se oscurece.","ingredients":["2 bolas de 150g (300g total) · Burrata fresca artesanal de Puglia","500 g · Tomates variados de colores (cherry rojos, amarillos, kumato y raf)","1 taza colmada · Hojas frescas de albahaca genovesa","30 g · Piñones tostados","30 g · Parmesano Reggiano rallado fino (para el pesto)","70 ml · Aceite de oliva virgen extra monovarietal","0,5 diente · Diente de ajo pequeño","20 ml en hilo · Reducción de vinagre balsámico de Módena I.G.P.","1 cucharadita · Flor de sal o sal en escamas y pimienta negra"],"steps":[{"stepNumber":1,"instruction":"Parmesano en trozos: 10 s a velocidad 10."},{"stepNumber":2,"instruction":"Añade albahaca, piñones y ajo: 5 s a velocidad 7."},{"stepNumber":3,"instruction":"Añade el aceite: 10 s a velocidad 4."},{"stepNumber":4,"instruction":"Monta los tomates y la burrata y riega con el pesto y el balsámico."}]}},{"id":"bizcocho-yogur-abuela-clasico","title":"Bizcocho Clásico de Yogur de la Abuela (Regla 1-2-3)","subtitle":"El bizcocho infalible más esponjoso con ralladura de limón y costra de azúcar","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"España","originFlag":"🇪🇸","desc":"El rey indiscutible de las meriendas familiares. La receta de oro donde el vasito del yogur sirve de medidor universal: 1 medida de aceite, 2 de azúcar y 3 de harina, aromatizado con ralladura de limón fresco de huerta y coronado con una capa de azúcar que forma una costra crujiente dorada en el horno.","prepTime":15,"cookTime":35,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Clásico de oro","Esponjoso","Fácil","Desayuno y fiesta"],"partyRole":"El bizcocho casero tradicional para la mesa de café y postres","drinkPairing":"Café con leche, infusión de rooibos o copa de vino dulce moscatel","ingredients":[{"id":"by-1","name":"Yogur natural o de limón (125g)","amount":1,"unit":"vasito (125g)","category":"lacteo"},{"id":"by-2","name":"Huevos camperos a temperatura ambiente","amount":3,"unit":"unidades (talla L)","category":"lacteo"},{"id":"by-3","name":"Aceite de girasol o de oliva suave","amount":1,"unit":"medida del vasito (100ml)","category":"despensa"},{"id":"by-4","name":"Azúcar blanco","amount":2,"unit":"medidas del vasito (200g)","category":"despensa"},{"id":"by-5","name":"Harina de trigo de repostería","amount":3,"unit":"medidas del vasito (240g)","category":"panaderia"},{"id":"by-6","name":"Levadura química en polvo (tipo Royal)","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"by-7","name":"Limón fresco (solo la ralladura sin la parte blanca)","amount":1,"unit":"limón","category":"verdura"},{"id":"by-8","name":"Pizca de sal fina","amount":1,"unit":"pizca","category":"especia"},{"id":"by-9","name":"Azúcar extra para espolvorear la superficie antes de hornear","amount":2,"unit":"cucharadas","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Precalienta el horno a 180°C con calor arriba y abajo. Engrasa un molde redondo de 22 cm con mantequilla y espolvorea harina (o fórralo con papel de horno).","tip":"Tener el molde listo y el horno a temperatura exacta evita que la masa espere y pierda gas.","durationMinutes":5},{"stepNumber":2,"instruction":"En un bol amplio, bate los 3 huevos con el azúcar durante 4-5 minutos con varillas eléctricas hasta que blanqueen, doblen su volumen y queden espumosos.","tip":"El batido prolongado de huevos con azúcar es el secreto para un bizcocho que sube recto y esponjoso.","durationMinutes":5},{"stepNumber":3,"instruction":"Añade el yogur, el aceite y la ralladura fina del limón. Bate a velocidad baja durante 1 minuto solo hasta integrar.","tip":"No batas de más en este paso para no expulsar el aire atrapado.","durationMinutes":2},{"stepNumber":4,"instruction":"Tamiza la harina con la levadura y la pizca de sal. Incorpórala al bol en dos tandas mezclando con espátula con movimientos envolventes de abajo hacia arriba.","tip":"Los movimientos envolventes mantienen la masa aireada.","durationMinutes":3},{"stepNumber":5,"instruction":"Vierte la masa en el molde. Espolvorea 2 cucharadas de azúcar por toda la superficie para crear la famosa costra crujiente. Hornea a 180°C durante 35-40 minutos.","tip":"¡No abras el horno durante los primeros 25 minutos! Comprueba con un palillo en el centro: si sale limpio y seco, está perfecto. Deja templar 10 min antes de desmoldar sobre rejilla.","durationMinutes":40}],"regionalVariants":[{"name":"Bizcocho de Yogur con Canela y Manzana en Dados","region":"Castilla y León","description":"Se añade 1 cucharadita de canela a la masa y dados pequeños de manzana reineta rebozados en harina para que no se hundan al fondo.","optionalAdditions":["Manzana en dados","Canela molida"]}],"chefTips":["Usa los huevos a temperatura ambiente: montan mucho más rápido y atrapan el doble de microburbujas."],"robot":{"servings":8,"factor":1,"note":"El robot monta y mezcla con la mariposa. Se hornea igual.","ingredients":["1 vasito (125g) · Yogur natural o de limón (125g)","3 unidades (talla L) · Huevos camperos a temperatura ambiente","1 medida del vasito (100ml) · Aceite de girasol o de oliva suave","2 medidas del vasito (200g) · Azúcar blanco","3 medidas del vasito (240g) · Harina de trigo de repostería","1 sobre (16g) · Levadura química en polvo (tipo Royal)","1 limón · Limón fresco (solo la ralladura sin la parte blanca)","1 pizca · Pizca de sal fina","2 cucharadas · Azúcar extra para espolvorear la superficie antes de hornear"],"steps":[{"stepNumber":1,"instruction":"Precalienta el horno a 180 °C. Azúcar y ralladura: 10 s a velocidad 10."},{"stepNumber":2,"instruction":"Coloca la mariposa. Añade los huevos: 4 min a 37 °C, velocidad 4, hasta que blanqueen."},{"stepNumber":3,"instruction":"Añade yogur y aceite: 20 s a velocidad 3. Quita la mariposa."},{"stepNumber":4,"instruction":"Añade harina, levadura y sal: 10 s a velocidad 3, terminando con espátula."},{"stepNumber":5,"instruction":"Molde, azúcar por encima y horno a 180 °C 35-40 min."}]}},{"id":"bizcocho-chocolate-intenso-pepitas","title":"Bizcocho de Chocolate Intenso con Pepitas Fundentes","subtitle":"Masa húmeda de cacao puro 100% con corazones de chocolate fundido","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Repostería Creativa","originFlag":"🍫","desc":"La perdición absoluta de los amantes del chocolate. Una miga húmeda, oscura y sedosa con cacao puro desgrasado, yogur griego para mantener la ternura y una generosa lluvia de pepitas de chocolate negro al 70% que se derriten creando bolsas cremosas al cortar cada porción.","prepTime":20,"cookTime":40,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Chocolate lovers","Miga húmeda","Gourmet","Irresistible"],"partyRole":"El centro dulce más deseado de la mesa de postres","drinkPairing":"Vaso de leche fría, café expreso o licor de avellana","ingredients":[{"id":"bc-1","name":"Harina de trigo de repostería","amount":200,"unit":"g","category":"panaderia"},{"id":"bc-2","name":"Cacao puro en polvo desgrasado 100% (tipo Valor)","amount":60,"unit":"g","category":"despensa"},{"id":"bc-3","name":"Pepitas o gotas de chocolate negro al 70%","amount":150,"unit":"g","category":"despensa"},{"id":"bc-4","name":"Huevos medianos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bc-5","name":"Azúcar moreno o panela","amount":180,"unit":"g","category":"despensa"},{"id":"bc-6","name":"Yogur griego natural sin azúcar","amount":125,"unit":"g","category":"lacteo"},{"id":"bc-7","name":"Aceite de girasol","amount":100,"unit":"ml","category":"despensa"},{"id":"bc-8","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bc-9","name":"Extracto natural de vainilla","amount":1,"unit":"cucharadita","category":"especia"},{"id":"bc-10","name":"Pizca de sal marina","amount":0.5,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Precalienta el horno a 175°C. Forra un molde tipo plum cake o redondo de 22 cm con papel sulfurizado.","tip":"Mezcla las pepitas de chocolate con 1 cucharada de harina para que no se vayan al fondo del molde al hornear.","durationMinutes":5},{"stepNumber":2,"instruction":"Bate los huevos con el azúcar moreno y la vainilla durante 4 minutos hasta tener una crema espesa.","tip":"El azúcar moreno aporta humedad y notas acarameladas al chocolate.","durationMinutes":4},{"stepNumber":3,"instruction":"Añade el yogur griego y el aceite batiendo suavemente. Tamiza encima la harina, el cacao en polvo, la levadura y la pizca de sal.","tip":"Tamizar el cacao es vital porque suele formar bolitas compactas.","durationMinutes":4},{"stepNumber":4,"instruction":"Integra con espátula de goma e incorpora dos tercios de las pepitas de chocolate enharinadas a la masa.","tip":"Vierte en el molde y reparte el resto de pepitas por encima para que queden visibles en la corteza.","durationMinutes":3},{"stepNumber":5,"instruction":"Hornea a 175°C durante 38-42 minutos. Pincha con brocheta de madera: debe salir sin masa líquida pero con alguna miga húmeda de chocolate fundido.","tip":"Deja enfriar sobre rejilla antes de desmoldar.","durationMinutes":40}],"regionalVariants":[{"name":"Bizcocho de Chocolate con Naranja Confitada","region":"Valencia","description":"Se añaden dados de naranja confitada y ralladura de naranja que armonizan con el chocolate negro de manera celestial.","optionalAdditions":["Dados de naranja confitada","Ralladura de naranja"]}],"chefTips":["Si lo calientas 15 segundos en el microondas antes de comer, las pepitas volverán a fundirse como lava líquida."],"robot":{"servings":8,"factor":1,"note":"El robot hace la masa. Las pepitas se añaden con espátula.","ingredients":["200 g · Harina de trigo de repostería","60 g · Cacao puro en polvo desgrasado 100% (tipo Valor)","150 g · Pepitas o gotas de chocolate negro al 70%","3 unidades · Huevos medianos camperos","180 g · Azúcar moreno o panela","125 g · Yogur griego natural sin azúcar","100 ml · Aceite de girasol","1 sobre (16g) · Levadura química en polvo","1 cucharadita · Extracto natural de vainilla","0,5 cucharadita · Pizca de sal marina"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 175 °C. Con la mariposa: huevos, azúcar y vainilla, 4 min a 37 °C, velocidad 4."},{"stepNumber":2,"instruction":"Añade yogur y aceite: 20 s a velocidad 3. Quita la mariposa."},{"stepNumber":3,"instruction":"Añade harina, cacao, levadura y sal: 10 s a velocidad 3."},{"stepNumber":4,"instruction":"Mezcla dos tercios de las pepitas con espátula, molde y horno a 175 °C 38-42 min."}]}},{"id":"bizcocho-naranja-entera-glaseado","title":"Bizcocho de Naranja Entera con Glaseado Cítrico","subtitle":"Naranja entera triturada con su cáscara limpia para una jugosidad extrema","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Comunidad Valenciana, España","originFlag":"🍊","desc":"La revelación cítrica de la repostería mediterránea. No lleva solo zumo: se tritura la naranja entera con su piel (bien lavada) junto a los huevos y el azúcar, lo que confiere una humedad densa, un color anaranjado deslumbrante y una fragancia que inunda toda la casa mientras se hornea. Terminado con un baño de glaseado translúcido de naranja.","prepTime":20,"cookTime":40,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Cítrico aromático","Ultra jugoso","Fruta entera","Elegante"],"partyRole":"Bizcocho aromático y fresco ideal para media tarde","drinkPairing":"Té negro Earl Grey o cava brut bien frío","ingredients":[{"id":"bn-1","name":"Naranja de mesa madura entera con piel fina","amount":1,"unit":"unidad grande (aprox 250g)","category":"verdura"},{"id":"bn-2","name":"Huevos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bn-3","name":"Azúcar blanco","amount":220,"unit":"g","category":"despensa"},{"id":"bn-4","name":"Aceite de girasol o AOVE arbequina suave","amount":100,"unit":"ml","category":"despensa"},{"id":"bn-5","name":"Yogur natural sin azúcar","amount":1,"unit":"vasito (125g)","category":"lacteo"},{"id":"bn-6","name":"Harina de trigo de repostería","amount":250,"unit":"g","category":"panaderia"},{"id":"bn-7","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bn-8","name":"Azúcar glas y zumo de naranja para el glaseado final","amount":100,"unit":"g azúcar + 2 cdas zumo","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Lava muy bien la naranja frotando la cáscara bajo el grifo. Córtala en trozos con piel, retirando las pepitas y la parte blanca central gruesa.","tip":"Usa naranjas de piel fina y sin tratar químicamente para un sabor puro sin amargor.","durationMinutes":5},{"stepNumber":2,"instruction":"En un vaso de batidora o robot de cocina, coloca los trozos de naranja con piel, los 3 huevos y el azúcar. Tritura a máxima potencia durante 2 minutos hasta conseguir una crema naranja densa, homogénea y espumosa.","tip":"La piel se pulveriza liberando los aceites esenciales de la corteza.","durationMinutes":3},{"stepNumber":3,"instruction":"Vierte la mezcla en un bol. Añade el aceite y el yogur y mezcla con varilla de mano.","tip":"Tamiza la harina con la levadura química e integra con movimientos suaves.","durationMinutes":4},{"stepNumber":4,"instruction":"Vierte en un molde engrasado y hornea a 180°C durante 40-45 minutos hasta que al pinchar con un palillo salga limpio.","tip":"Deja templar 10 minutos y desmolda sobre rejilla.","durationMinutes":42},{"stepNumber":5,"instruction":"Para el glaseado: mezcla en un cuenco el azúcar glas con 2 cucharadas de zumo de naranja hasta tener una textura de jarabe espeso. Vierte sobre el bizcocho tibio dejando que caiga por los laterales.","tip":"Al secarse formará una capa crujiente y translúcida irresistible.","durationMinutes":3}],"regionalVariants":[{"name":"Bizcocho de Mandarinas de Castellón","region":"Comarca de la Plana","description":"Se sustituye la naranja por 3 mandarinas enteras sin pepitas, resultando en un aroma aún más dulce y floral.","optionalAdditions":["3 mandarinas en lugar de naranja"]}],"chefTips":["Gana jugosidad al día siguiente: envuélvelo en papel de aluminio y estará aún más tierno y húmedo."],"robot":{"servings":8,"factor":1,"note":"El robot tritura la naranja con piel mejor que una batidora.","ingredients":["1 unidad grande (aprox 250g) · Naranja de mesa madura entera con piel fina","3 unidades · Huevos camperos","220 g · Azúcar blanco","100 ml · Aceite de girasol o AOVE arbequina suave","1 vasito (125g) · Yogur natural sin azúcar","250 g · Harina de trigo de repostería","1 sobre (16g) · Levadura química en polvo","100 g azúcar + 2 cdas zumo · Azúcar glas y zumo de naranja para el glaseado final"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 180 °C. Naranja en trozos, huevos y azúcar: 1 min a velocidad 10."},{"stepNumber":2,"instruction":"Añade aceite y yogur: 20 s a velocidad 4."},{"stepNumber":3,"instruction":"Añade harina y levadura: 10 s a velocidad 3."},{"stepNumber":4,"instruction":"Hornea a 180 °C 40-45 min."},{"stepNumber":5,"instruction":"Glaseado: azúcar glas y zumo, 10 s a velocidad 3. Viértelo sobre el bizcocho tibio."}]}},{"id":"bizcocho-zanahoria-nueces-especias","title":"Bizcocho de Zanahoria, Nueces y Especias (Carrot Cake)","subtitle":"Miga especiada con canela de Ceilán, jengibre, nueces crujientes y frosting opcional","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Internacional / Anglo-americano","originFlag":"🥕","desc":"Un clásico universal que nunca defrauda. La zanahoria finamente rallada aporta una humedad profunda y natural que mantiene el bizcocho tierno durante días, combinada con el calor reconfortante de la canela, la nuez moscada, el jengibre y el crujido mantecoso de las nueces tostadas.","prepTime":25,"cookTime":45,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Zanahoria jugosa","Especias cálidas","Nueces","Favorito"],"partyRole":"Bizcocho sofisticado para celebraciones y meriendas de fiesta","drinkPairing":"Té Chai especiado con leche o café con hielo","ingredients":[{"id":"bz-1","name":"Zanahorias frescas ralladas finas","amount":300,"unit":"g (aprox 3-4 unidades)","category":"verdura"},{"id":"bz-2","name":"Harina de trigo de repostería","amount":240,"unit":"g","category":"panaderia"},{"id":"bz-3","name":"Huevos camperos","amount":4,"unit":"unidades","category":"lacteo"},{"id":"bz-4","name":"Azúcar moreno o panela","amount":180,"unit":"g","category":"despensa"},{"id":"bz-5","name":"Aceite de girasol","amount":150,"unit":"ml","category":"despensa"},{"id":"bz-6","name":"Nueces peladas troceadas gruesas","amount":80,"unit":"g","category":"despensa"},{"id":"bz-7","name":"Canela molida de Ceilán","amount":1.5,"unit":"cucharadita","category":"especia"},{"id":"bz-8","name":"Jengibre molido y nuez moscada","amount":0.5,"unit":"cucharadita de cada uno","category":"especia"},{"id":"bz-9","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bz-10","name":"Bicarbonato de sodio","amount":0.5,"unit":"cucharadita","category":"despensa"},{"id":"bz-11","name":"Pizca de sal fina","amount":0.5,"unit":"cucharadita","category":"especia"},{"id":"bz-12","name":"Frosting de queso crema (opcional para decorar)","amount":150,"unit":"g queso crema + 50g mantequilla + 60g azúcar glas","category":"lacteo"}],"steps":[{"stepNumber":1,"instruction":"Pela y ralla las zanahorias por la parte fina del rallador. Tuesta las nueces picadas 4 minutos en sartén seca para despertar sus aceites.","tip":"Rallar fino permite que la zanahoria se funda con la masa creando una miga jugosísima sin hebras duras.","durationMinutes":10},{"stepNumber":2,"instruction":"En un bol grande bate los 4 huevos con el azúcar moreno durante 4 minutos hasta tener una mezcla cremosa y aireada. Vierte el aceite en hilo mientras sigues batiendo suavemente.","tip":"El aceite garantiza que el bizcocho permanezca blando incluso refrigerado.","durationMinutes":4},{"stepNumber":3,"instruction":"Tamiza la harina con la levadura, el bicarbonato, la canela, el jengibre, la nuez moscada y la sal. Añádelos al bol con movimientos envolventes.","tip":"Incorpora la zanahoria rallada y las nueces tostadas integrando todo.","durationMinutes":4},{"stepNumber":4,"instruction":"Vierte la masa en un molde de 22 cm forrado con papel de hornear. Hornea a 175°C durante 45-50 minutos.","tip":"Comprueba con brocheta en el centro: debe salir seca. Deja enfriar totalmente sobre rejilla.","durationMinutes":50},{"stepNumber":5,"instruction":"Si deseas coronarlo con frosting: bate el queso crema con la mantequilla a temperatura ambiente y el azúcar glas hasta lograr una crema suave. Extiéndela sobre el bizcocho frío con espátula.","tip":"Decora con medias nueces tostadas por encima.","durationMinutes":5}],"regionalVariants":[{"name":"Carrot Cake con Pasas Sultanas al Ron","region":"Versión clásica británica","description":"Se añaden 60g de uvas pasas hidratadas en ron añejo caliente escurridas dentro de la masa.","optionalAdditions":["Pasas maceradas en ron"]}],"chefTips":["El bicarbonato reacciona con la acidez de la zanahoria y el azúcar moreno, dando ese tono dorado tostado tan apetecible."],"robot":{"servings":8,"factor":1,"note":"El robot ralla la zanahoria y pica las nueces.","ingredients":["300 g (aprox 3-4 unidades) · Zanahorias frescas ralladas finas","240 g · Harina de trigo de repostería","4 unidades · Huevos camperos","180 g · Azúcar moreno o panela","150 ml · Aceite de girasol","80 g · Nueces peladas troceadas gruesas","1,5 cucharadita · Canela molida de Ceilán","0,5 cucharadita de cada uno · Jengibre molido y nuez moscada","1 sobre (16g) · Levadura química en polvo","0,5 cucharadita · Bicarbonato de sodio","0,5 cucharadita · Pizca de sal fina","150 g queso crema + 50g mantequilla + 60g azúcar glas · Frosting de queso crema (opcional para decorar)"],"steps":[{"stepNumber":1,"instruction":"Nueces: 3 s a velocidad 5. Reserva. Zanahorias en trozos: 6 s a velocidad 5. Reserva."},{"stepNumber":2,"instruction":"Con la mariposa: huevos y azúcar moreno, 4 min a 37 °C, velocidad 4. Añade el aceite en hilo a velocidad 3. Quita la mariposa."},{"stepNumber":3,"instruction":"Añade harina, levadura, bicarbonato, especias y sal: 10 s a velocidad 3. Añade zanahoria y nueces: 10 s a velocidad 2 (giro inverso)."},{"stepNumber":4,"instruction":"Hornea a 175 °C 45-50 min."},{"stepNumber":5,"instruction":"Frosting: queso crema, mantequilla y azúcar glas, 20 s a velocidad 4."}]}},{"id":"bizcocho-marmolado-vainilla-cacao","title":"Bizcocho Marmolado de Vainilla y Cacao Puro","subtitle":"El clásico dibujo en espiral entrelazando dos masas contrastadas","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Centroeuropa / Alemania (Marmorkuchen)","originFlag":"🇩🇪","desc":"Un deleite tanto visual como gustativo. Una misma masa sedosa de mantequilla y vainilla dividida en dos: una mitad se aromatiza con vainilla de Madagascar y la otra con cacao puro holandés. Al verterlas alternadas en el molde y dibujar una espiral con brocheta, cada rebanada revela un dibujo marmolado único.","prepTime":20,"cookTime":40,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Doble sabor","Visual","Mantequilla","Clásico"],"partyRole":"Bizcocho vistoso para cortar en rebanadas perfectas de cóctel","drinkPairing":"Capuchino espumoso, chocolate caliente o vaso de leche","ingredients":[{"id":"bm-1","name":"Mantequilla a temperatura ambiente (en pomada)","amount":150,"unit":"g","category":"lacteo"},{"id":"bm-2","name":"Azúcar blanco","amount":180,"unit":"g","category":"despensa"},{"id":"bm-3","name":"Huevos medianos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bm-4","name":"Harina de trigo de repostería","amount":260,"unit":"g","category":"panaderia"},{"id":"bm-5","name":"Leche entera","amount":100,"unit":"ml","category":"lacteo"},{"id":"bm-6","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bm-7","name":"Cacao puro en polvo sin azúcar","amount":30,"unit":"g (2 cdas colmadas)","category":"despensa"},{"id":"bm-8","name":"Leche extra para la masa de cacao","amount":30,"unit":"ml (2 cdas)","category":"lacteo"},{"id":"bm-9","name":"Extracto natural de vainilla","amount":1,"unit":"cucharada","category":"especia"},{"id":"bm-10","name":"Pizca de sal","amount":0.5,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"En un bol bate la mantequilla en pomada con el azúcar durante 4-5 minutos hasta que la mezcla blanquee y esté muy cremosa. Añade los huevos uno a uno, esperando que se integre bien cada uno antes de añadir el siguiente.","tip":"La mantequilla debe estar blanda al tacto, nunca derretida líquida.","durationMinutes":6},{"stepNumber":2,"instruction":"Añade la harina tamizada con la levadura y la sal, alternándola con los 100ml de leche entera. Bate a velocidad baja hasta tener una masa lisa y homogénea.","tip":"No batas en exceso para no endurecer la masa.","durationMinutes":3},{"stepNumber":3,"instruction":"Divide la masa en dos partes iguales en dos recipientes. A una mitad agrégale la vainilla líquida. A la otra mitad agrégale el cacao en polvo y las 2 cucharadas extra de leche para compensar la densidad.","tip":"La leche extra asegura que ambas masas tengan la misma consistencia al hornearse.","durationMinutes":3},{"stepNumber":4,"instruction":"En un molde de plum cake o de corona previamente engrasado, ve alternando cucharadas de masa blanca y masa oscura una sobre otra. Al terminar, introduce un cuchillo o brocheta y haz movimientos en zigzag o espiral de un extremo a otro.","tip":"Ese zigzag crea el característico efecto marmolado sin mezclar las masas por completo.","durationMinutes":4},{"stepNumber":5,"instruction":"Hornea a 180°C durante 40-45 minutos hasta que al pinchar salga limpio. Desmolda tibio sobre rejilla y espolvorea azúcar glas.","tip":"Al cortar cada rebanada verás un dibujo diferente.","durationMinutes":42}],"regionalVariants":[{"name":"Marmolado con Toque de Café Espresso","region":"Viena","description":"Se disuelve 1 cucharadita de café soluble en la leche de la masa de cacao para potenciar el amargor del chocolate.","optionalAdditions":["1 cdta café soluble"]}],"chefTips":["Se conserva esponjoso y fresco durante casi una semana bien tapado bajo campana de cristal."],"robot":{"servings":8,"factor":1,"note":"El robot bate la mantequilla en pomada.","ingredients":["150 g · Mantequilla a temperatura ambiente (en pomada)","180 g · Azúcar blanco","3 unidades · Huevos medianos camperos","260 g · Harina de trigo de repostería","100 ml · Leche entera","1 sobre (16g) · Levadura química en polvo","30 g (2 cdas colmadas) · Cacao puro en polvo sin azúcar","30 ml (2 cdas) · Leche extra para la masa de cacao","1 cucharada · Extracto natural de vainilla","0,5 cucharadita · Pizca de sal"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 180 °C. Mantequilla y azúcar: 1 min a velocidad 4. Añade los huevos de uno en uno: 20 s a velocidad 4 cada uno."},{"stepNumber":2,"instruction":"Añade harina, levadura, sal y leche: 15 s a velocidad 4."},{"stepNumber":3,"instruction":"Saca la mitad de la masa a un bol con la vainilla. Añade al vaso el cacao y la leche extra: 10 s a velocidad 3."},{"stepNumber":4,"instruction":"Alterna las dos masas en el molde, dibuja el marmolado y hornea a 180 °C 40-45 min."}]}},{"id":"bizcocho-manzana-canela-caramelizada","title":"Bizcocho de Manzanas Caramelizadas y Canela","subtitle":"Capas de finas láminas de manzana que se funden con la masa tierna","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Normandía / España","originFlag":"🍎","desc":"El bizcocho más meloso y jugoso del recetario. Manzanas reineta o fuji cortadas en láminas finísimas: la mitad se integra en la masa para aportar una humedad frutal impresionante, y la otra mitad se dispone en abanico sobre la superficie espolvoreada con canela y azúcar moreno que se carameliza en el horno.","prepTime":20,"cookTime":45,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Fruta fresca","Meloso","Canela","Tarta casera"],"partyRole":"Postre tibio reconfortante con bola de helado de vainilla","drinkPairing":"Sidra asturiana dulce, té especiado o vino dulce Pedro Ximénez","ingredients":[{"id":"bma-1","name":"Manzanas Reineta, Golden o Fuji","amount":3,"unit":"unidades grandes (aprox 500g)","category":"verdura"},{"id":"bma-2","name":"Harina de trigo de repostería","amount":220,"unit":"g","category":"panaderia"},{"id":"bma-3","name":"Huevos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bma-4","name":"Azúcar blanco","amount":150,"unit":"g","category":"despensa"},{"id":"bma-5","name":"Mantequilla derretida o aceite suave","amount":80,"unit":"g","category":"lacteo"},{"id":"bma-6","name":"Leche entera","amount":80,"unit":"ml","category":"lacteo"},{"id":"bma-7","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bma-8","name":"Canela molida de Ceilán","amount":1.5,"unit":"cucharadita","category":"especia"},{"id":"bma-9","name":"Azúcar moreno y dados de mantequilla para la cubierta","amount":2,"unit":"cucharadas","category":"despensa"},{"id":"bma-10","name":"Mermelada de albaricoque o melocotón para abrillantar","amount":2,"unit":"cucharadas con 1 cda agua","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Pela las manzanas y descorazónalas. Corta una manzana en dados pequeños y las otras dos en láminas muy finas con cuchillo o mandolina.","tip":"Rocía con unas gotas de zumo de limón para que no se oxiden.","durationMinutes":8},{"stepNumber":2,"instruction":"Bate los huevos con el azúcar durante 4 minutos hasta blanquear. Añade la mantequilla derretida tibia y la leche sin dejar de batir suavemente.","tip":"Tamiza la harina con la levadura y 1 cucharadita de canela e incorpora con espátula.","durationMinutes":4},{"stepNumber":3,"instruction":"Añade los dados de manzana a la masa y mezcla. Vierte la masa en un molde redondo de 22 cm con papel de hornear.","tip":"Los dados internos se desharán durante el horneado creando una textura casi de crema pastelera frutal.","durationMinutes":3},{"stepNumber":4,"instruction":"Coloca las láminas de manzana sobre la superficie en círculos concéntricos solapadas en abanico. Espolvorea con el azúcar moreno, media cucharadita de canela y pequeños daditos de mantequilla.","tip":"La mantequilla y el azúcar caramelizarán la manzana en el horno.","durationMinutes":5},{"stepNumber":5,"instruction":"Hornea a 180°C durante 45 minutos. Al salir, pincela la superficie caliente con la mermelada templada para darle un brillo de pastelería profesional.","tip":"Delicioso tanto tibio como frío.","durationMinutes":45}],"regionalVariants":[{"name":"Bizcocho Invisible de Manzana (Gâteau Invisible)","region":"Francia","description":"Lleva muchísima manzana y casi nada de masa: todas las láminas se bañan en masa líquida resultando en un pastel de capas que parece milhojas.","optionalAdditions":["5 manzanas en láminas con mitad de harina"]}],"chefTips":["La manzana Reineta aporta un toque ácido perfecto que contrasta con el dulzor del azúcar caramelizado."],"robot":{"servings":8,"factor":1,"note":"El robot pica la manzana en dados y hace la masa.","ingredients":["3 unidades grandes (aprox 500g) · Manzanas Reineta, Golden o Fuji","220 g · Harina de trigo de repostería","3 unidades · Huevos camperos","150 g · Azúcar blanco","80 g · Mantequilla derretida o aceite suave","80 ml · Leche entera","1 sobre (16g) · Levadura química en polvo","1,5 cucharadita · Canela molida de Ceilán","2 cucharadas · Azúcar moreno y dados de mantequilla para la cubierta","2 cucharadas con 1 cda agua · Mermelada de albaricoque o melocotón para abrillantar"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 180 °C. Una manzana en cuartos: 3 s a velocidad 4. Reserva. Lamina las otras dos a cuchillo."},{"stepNumber":2,"instruction":"Con la mariposa: huevos y azúcar, 4 min a 37 °C, velocidad 4. Añade mantequilla y leche: 15 s a velocidad 3. Quita la mariposa."},{"stepNumber":3,"instruction":"Añade harina, levadura y canela: 10 s a velocidad 3. Añade los dados de manzana: 5 s a velocidad 2 (giro inverso)."},{"stepNumber":4,"instruction":"Molde, láminas de manzana encima, azúcar moreno y mantequilla, y horno a 180 °C 45 min."}]}},{"id":"bizcocho-limon-semillas-amapola","title":"Bizcocho de Limón y Semillas de Amapola (Lemon Poppy)","subtitle":"El clásico anglosajón bañado en almíbar cítrico con crujido sutil","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Reino Unido / Repostería Internacional","originFlag":"🇬🇧","desc":"Elegancia pura para la hora del té. Una masa esponjosa perfumada con abundante ralladura y zumo de limones frescos, salpicada con diminutas semillas de amapola azul que aportan un contraste crujiente sofisticado. Al salir del horno se cala con un almíbar caliente de limón que lo mantiene intensamente jugoso durante días.","prepTime":15,"cookTime":40,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Cítrico elegante","Amapola crujiente","Calado jugoso","Gourmet"],"partyRole":"Bizcocho aromático y limpio para amantes de los cítricos","drinkPairing":"Té verde Sencha, infusión de menta o café aromático","ingredients":[{"id":"bl-1","name":"Harina de trigo de repostería","amount":220,"unit":"g","category":"panaderia"},{"id":"bl-2","name":"Semillas de amapola azul","amount":25,"unit":"g (aprox 2 cdas colmadas)","category":"especia"},{"id":"bl-3","name":"Mantequilla en pomada (o aceite de girasol)","amount":120,"unit":"g","category":"lacteo"},{"id":"bl-4","name":"Azúcar blanco","amount":180,"unit":"g","category":"despensa"},{"id":"bl-5","name":"Huevos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bl-6","name":"Yogur natural o crème fraîche","amount":100,"unit":"g","category":"lacteo"},{"id":"bl-7","name":"Limones frescos (ralladura de 2 y zumo de 1)","amount":2,"unit":"unidades","category":"verdura"},{"id":"bl-8","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bl-9","name":"Pizca de sal","amount":0.5,"unit":"cucharadita","category":"especia"},{"id":"bl-10","name":"Almíbar de calado: zumo de 1 limón + 40g azúcar","amount":null,"unit":"hervido 2 min","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"En un bol frota con las yemas de los dedos el azúcar con la ralladura de los 2 limones durante 1 minuto.","tip":"La fricción del azúcar con la ralladura extrae los aceites esenciales del limón multiplicando el aroma por diez.","durationMinutes":3},{"stepNumber":2,"instruction":"Añade la mantequilla en pomada y bate con varillas eléctricas durante 4 minutos hasta tener una pomada esponjosa. Añade los huevos uno a uno batiendo bien.","tip":"La emulsión debe quedar aireada.","durationMinutes":4},{"stepNumber":3,"instruction":"Añade el yogur y el zumo de medio limón. Tamiza encima la harina con la levadura y la sal, y agrega las semillas de amapola.","tip":"Mezcla suavemente con espátula para distribuir los puntos negros de amapola uniformemente.","durationMinutes":3},{"stepNumber":4,"instruction":"Vierte en molde de plum cake forrado y hornea a 175°C durante 40-45 minutos hasta que al pinchar salga seco.","tip":"Mientras se hornea, hierve el zumo del limón restante con los 40g de azúcar 2 minutos para el almíbar.","durationMinutes":42},{"stepNumber":5,"instruction":"Nada más sacar el bizcocho caliente del horno, pincha toda la superficie con una brocheta fina y vierte el almíbar de limón poco a poco con una cuchara.","tip":"El bizcocho absorberá el almíbar como una esponja quedando húmedo sin desmoronarse.","durationMinutes":3}],"regionalVariants":[{"name":"Lemon Poppy con Glaseado Blanco de Limón","region":"Pastelería de Londres","description":"Se cubre con un glaseado blanco opaco de azúcar glas y zumo de limón coronado con semillas de amapola espolvoreadas.","optionalAdditions":["Glaseado espeso de azúcar glas"]}],"chefTips":["Las semillas de amapola no solo aportan estética: dan un crujido pequeñito maravilloso en cada mordisco."],"robot":{"servings":8,"factor":1,"note":"El robot perfuma el azúcar con la ralladura.","ingredients":["220 g · Harina de trigo de repostería","25 g (aprox 2 cdas colmadas) · Semillas de amapola azul","120 g · Mantequilla en pomada (o aceite de girasol)","180 g · Azúcar blanco","3 unidades · Huevos camperos","100 g · Yogur natural o crème fraîche","2 unidades · Limones frescos (ralladura de 2 y zumo de 1)","1 sobre (16g) · Levadura química en polvo","0,5 cucharadita · Pizca de sal","hervido 2 min · Almíbar de calado: zumo de 1 limón + 40g azúcar"],"steps":[{"stepNumber":1,"instruction":"Azúcar y piel de 2 limones (sin la parte blanca): 15 s a velocidad 10."},{"stepNumber":2,"instruction":"Añade la mantequilla: 1 min a velocidad 4. Añade los huevos de uno en uno: 20 s a velocidad 4 cada uno."},{"stepNumber":3,"instruction":"Añade yogur y zumo, y luego harina, levadura, sal y amapola: 15 s a velocidad 3."},{"stepNumber":4,"instruction":"Hornea a 175 °C 40-45 min."},{"stepNumber":5,"instruction":"Almíbar: zumo de limón y 40 g de azúcar, 3 min a 100 °C, velocidad 2. Riega el bizcocho caliente."}]}},{"id":"bizcocho-platano-maduro-banana-bread","title":"Bizcocho Esponjoso de Plátano Maduro (Banana Bread)","subtitle":"El mejor aprovechamiento dulce: plátanos maduros, mantequilla y nueces","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Internacional","originFlag":"🍌","desc":"El aroma más reconfortante que puede salir de un horno. El auténtico Banana Bread artesano: plátanos maduros de piel moteada machacados a mano, combinados con mantequilla dorada, azúcar moreno, canela, nueces y pepitas de chocolate opcionales. Miga tierna, densa y deliciosamente caramelizada.","prepTime":15,"cookTime":50,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Aprovechamiento","Plátano dulce","Nueces","Desayuno estrella"],"partyRole":"Bizcocho denso y jugoso cortado en rebanadas gruesas","drinkPairing":"Café solo, batido de avena o té especiado","ingredients":[{"id":"bb-1","name":"Plátanos maduros con piel moteada o negra","amount":3,"unit":"unidades grandes (aprox 350g pulpa)","category":"verdura"},{"id":"bb-2","name":"Mantequilla sin sal derretida","amount":100,"unit":"g","category":"lacteo"},{"id":"bb-3","name":"Azúcar moreno o panela","amount":140,"unit":"g","category":"despensa"},{"id":"bb-4","name":"Huevos camperos","amount":2,"unit":"unidades","category":"lacteo"},{"id":"bb-5","name":"Harina de trigo de repostería","amount":220,"unit":"g","category":"panaderia"},{"id":"bb-6","name":"Bicarbonato de sodio","amount":1,"unit":"cucharadita","category":"despensa"},{"id":"bb-7","name":"Canela molida","amount":1,"unit":"cucharadita","category":"especia"},{"id":"bb-8","name":"Nueces peladas picadas en trozos medianos","amount":70,"unit":"g","category":"despensa"},{"id":"bb-9","name":"Extracto de vainilla y pizca de sal","amount":1,"unit":"cucharadita","category":"especia"},{"id":"bb-10","name":"Plátano extra cortado longitudinalmente para decorar la superficie (opcional)","amount":1,"unit":"unidad","category":"verdura"}],"steps":[{"stepNumber":1,"instruction":"En un plato hondo machaca los 3 plátanos maduros con un tenedor hasta tener un puré rústico con algún tropezón.","tip":"Cuanto más maduro y oscuro esté el plátano, más azúcares naturales tendrá y menos azúcar añadido necesitarás.","durationMinutes":4},{"stepNumber":2,"instruction":"En un bol amplio, mezcla con varilla de mano la mantequilla derretida con el azúcar moreno y la vainilla. Añade los 2 huevos y bate 1 minuto.","tip":"Incorpora el puré de plátano machacado.","durationMinutes":3},{"stepNumber":3,"instruction":"Tamiza encima la harina con el bicarbonato de sodio, la canela y la sal. Mezcla con espátula solo hasta que no haya harina visible. Añade las nueces picadas.","tip":"No batas de más: la masa de banana bread debe tratarse suavemente para que no quede gomosa.","durationMinutes":3},{"stepNumber":4,"instruction":"Vierte en un molde de plum cake forrado con papel vegetal. Si deseas, coloca las dos mitades del plátano extra en la superficie con el corte hacia arriba y espolvorea un poco de azúcar moreno.","tip":"Se caramelizará en el horno con un aspecto rústico precioso.","durationMinutes":3},{"stepNumber":5,"instruction":"Hornea a 175°C durante 50-55 minutos. Al pinchar en el centro debe salir limpio. Deja enfriar en el molde 15 minutos y pasa a rejilla.","tip":"Al día siguiente es todavía más jugoso y fácil de cortar en rebanadas limpias.","durationMinutes":52}],"regionalVariants":[{"name":"Banana Bread con Dulce de Leche","region":"Río de la Plata","description":"Se añaden cucharadas de dulce de leche repostero intercaladas en la masa antes de hornear creando vetas caramelizadas.","optionalAdditions":["Cucharadas de dulce de leche"]}],"chefTips":["Si tienes plátanos poniéndose negros en el frutero, nunca los tires: ¡este es su destino glorioso!"],"robot":{"servings":8,"factor":1,"note":"El robot pica las nueces y aplasta el plátano.","ingredients":["3 unidades grandes (aprox 350g pulpa) · Plátanos maduros con piel moteada o negra","100 g · Mantequilla sin sal derretida","140 g · Azúcar moreno o panela","2 unidades · Huevos camperos","220 g · Harina de trigo de repostería","1 cucharadita · Bicarbonato de sodio","1 cucharadita · Canela molida","70 g · Nueces peladas picadas en trozos medianos","1 cucharadita · Extracto de vainilla y pizca de sal","1 unidad · Plátano extra cortado longitudinalmente para decorar la superficie (opcional)"],"steps":[{"stepNumber":1,"instruction":"Nueces: 3 s a velocidad 5. Reserva."},{"stepNumber":2,"instruction":"Plátanos: 5 s a velocidad 4. Añade mantequilla derretida, azúcar, vainilla y huevos: 20 s a velocidad 4."},{"stepNumber":3,"instruction":"Añade harina, bicarbonato, canela y sal: 10 s a velocidad 3. Añade las nueces: 5 s a velocidad 2 (giro inverso)."},{"stepNumber":4,"instruction":"Hornea a 175 °C 50-55 min."}]}},{"id":"bizcocho-genoves-tartas-sin-levadura","title":"Bizcocho Genovés Tradicional para Tartas (Sin Levadura)","subtitle":"La técnica maestra de aireado de huevos para una esponja etérea y ligera","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Génova, Italia / Pastelería Clásica","originFlag":"🇮🇹","desc":"La base universal de la alta pastelería europea. No lleva ni un gramo de levadura química ni grasas: su increíble altura y esponjosidad etérea se consiguen batiendo los huevos enteros con el azúcar al baño maría o a alta velocidad hasta alcanzar el \"punto de letra\". Es la esponja perfecta para emborrachar con almíbar, rellenar de nata o crema pastelera y hacer brazos de gitano o tartas de pisos.","prepTime":20,"cookTime":25,"difficulty":"Media","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Sin levadura","Pastelería clásica","Base de tartas","Etéreo"],"partyRole":"La base reina para tartas de cumpleaños y celebraciones","drinkPairing":"Cava brut, café de filtro o licor de frutas","ingredients":[{"id":"bg-1","name":"Huevos enteros a temperatura ambiente","amount":4,"unit":"unidades grandes (talla L)","category":"lacteo"},{"id":"bg-2","name":"Azúcar blanco","amount":120,"unit":"g (30g por huevo)","category":"despensa"},{"id":"bg-3","name":"Harina de trigo de repostería tamizada dos veces","amount":120,"unit":"g (30g por huevo)","category":"panaderia"},{"id":"bg-4","name":"Pizca de sal fina","amount":1,"unit":"pizca","category":"especia"},{"id":"bg-5","name":"Extracto natural de vainilla o ralladura de limón","amount":1,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Precalienta el horno a 170°C con calor arriba y abajo. Forra la base de un molde desmontable de 20-22 cm con papel sulfurizado. Engrasa solo la base, ¡no los laterales!","tip":"No engrasar los laterales del molde permite que la masa se agarre al subir y no se desinfle en el centro.","durationMinutes":5},{"stepNumber":2,"instruction":"En un bol resistente al calor, pon los 4 huevos con el azúcar y la pizca de sal. Colócalo sobre un cazo con agua caliente a fuego mínimo (baño maría suave, el bol no debe tocar el agua) y bate con varillas eléctricas durante 8-10 minutos hasta alcanzar los 40°C y que la mezcla blanquee, triplique su volumen y forme el \"punto de cinta o de letra\".","tip":"Sabrás que está en su punto cuando al levantar las varillas puedes \"escribir\" sobre la masa y el trazo se mantiene visible unos segundos antes de fundirse.","durationMinutes":10},{"stepNumber":3,"instruction":"Retira del baño maría y añade la vainilla. Tamiza la harina en dos tandas sobre la masa.","tip":"Mezcla con espátula de silicona con movimientos envolventes lentos y delicados desde el centro hacia el fondo y subiendo por las paredes, girando el bol con la otra mano. ¡Cero prisas para no perder el aire!","durationMinutes":4},{"stepNumber":4,"instruction":"Vierte la masa con suavidad en el molde desde poca altura para no romper las burbujas. Da un golpecito seco sobre la mesa para asentar burbujas grandes.","tip":"Hornea a 170°C durante 25-28 minutos.","durationMinutes":28},{"stepNumber":5,"instruction":"¡Prohibido abrir el horno antes de los 20 minutos! Al salir, deja templar 5 minutos y pasa una espátula fina por el borde. Desmolda y deja enfriar boca abajo sobre una rejilla.","tip":"Enfriar boca abajo garantiza una superficie completamente plana para montar tartas.","durationMinutes":5}],"regionalVariants":[{"name":"Genovés de Chocolate para Tartas Selva Negra","region":"Alsacia y Selva Negra","description":"Se sustituyen 25g de harina por 25g de cacao puro en polvo tamizado junto a la harina.","optionalAdditions":["25g cacao puro tamizado"]}],"chefTips":["Al no llevar grasa (mantequilla ni aceite), es la esponja más sedienta del mundo: absorbe almíbar de licor, café o frutas sin deshacerse jamás."],"robot":{"servings":8,"factor":1,"note":"El robot sustituye el baño maría: monta los huevos templados con la mariposa.","ingredients":["4 unidades grandes (talla L) · Huevos enteros a temperatura ambiente","120 g (30g por huevo) · Azúcar blanco","120 g (30g por huevo) · Harina de trigo de repostería tamizada dos veces","1 pizca · Pizca de sal fina","1 cucharadita · Extracto natural de vainilla o ralladura de limón"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 170 °C. Coloca la mariposa. Huevos, azúcar y sal: 6 min a 37 °C, velocidad 4."},{"stepNumber":2,"instruction":"Sin temperatura: 8 min más a velocidad 4, hasta que doble varias veces su volumen y forme cordón."},{"stepNumber":3,"instruction":"Quita la mariposa. Añade la vainilla y la harina tamizada a mano, con espátula y movimientos envolventes."},{"stepNumber":4,"instruction":"Al molde y al horno a 170 °C sin abrir antes de 20 min."}]}},{"id":"mc-pisto","title":"Pisto","subtitle":"Monsieur Cuisine Compact · 2-3 raciones · 30 min","category":"robot","categoryLabel":"Cocina con robot","origin":"Monsieur Cuisine","originFlag":"🇪🇸","emoji":"🥘","desc":"Receta pensada para el vaso de 1,5 L del Monsieur Cuisine Compact (2-3 raciones).","prepTime":10,"cookTime":20,"difficulty":"Fácil","baseServings":3,"image":"","tags":["Monsieur Cuisine","Cremas y verduras"],"partyRole":"Plato del día o para dejar en táper","drinkPairing":"Vino tinto joven o agua con gas y limón","ingredients":[{"id":"mc-pisto-i0","name":"Cebolla grande","amount":1.0,"unit":"","category":"verdura"},{"id":"mc-pisto-i1","name":"Pimientos verdes grandes","amount":2.0,"unit":"","cat
