Variants":[{"name":"Variante de El Cabanyal Clásica","region":"Barrio Marinero de Valencia","description":"Hecha estrictamente con ventresca de atún en salazón curada en salmuera (tonyina de sorra) desalada a mano.","optionalAdditions":["Tonyina de sorra auténtica","Servir con rosquilletas valencianas"]},{"name":"Variante para Relleno de Clóchinas o Pepitos","region":"Semana Santa Marinera","description":"Se usa como relleno para panecillos fritos rebozados en leche y huevo (los famosos pepitos valencianos).","optionalAdditions":["Rellenar panecillos vieneses y hornear o freír"]}],"chefTips":["Es el relleno más aclamado de España para empanadillas caseras al horno.","Sírvela acompañada de rosquilletas valencianas artesanas o tostas finas de trigo."],"robot":{"servings":3,"factor":0.6,"note":"Los piñones se tuestan mejor en sartén. El resto, en el robot.","ingredients":["1,25 unidades · Pimiento rojo maduro grueso","0,5 unidad · Pimiento verde carnoso","360 g · Tomates maduros triturados (o pera rallados)","25 g · Piñones nacionales","120 g · Tonyina de sorra (atún en salazón) o bonito del norte en conserva","1,25 dientes · Dientes de ajo picados muy fino","55 ml · Aceite de oliva virgen extra","al gusto · Pizca de sal y azúcar"],"steps":[{"stepNumber":1,"instruction":"Tuesta los piñones en una sartén seca 2-3 min y reserva."},{"stepNumber":2,"instruction":"Ajo y pimientos en trozos: 4 s a velocidad 4. Añade el aceite: 20 min a 120 °C, velocidad 1 (giro inverso), sin cubilete."},{"stepNumber":3,"instruction":"Añade el tomate y una pizca de azúcar: 20 min a 120 °C, velocidad 1 (giro inverso), sin cubilete y con el cestillo sobre la tapa."},{"stepNumber":4,"instruction":"Añade el atún desmigado y los piñones: 2 min a 90 °C, velocidad 1 (giro inverso). Deja templar antes de servir."}]}},{"id":"asadillo-manchego","title":"Asadillo Manchego Tradicional","subtitle":"Pimientos asados a la leña con majado de comino y ajo crudo","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Castilla-La Mancha","originFlag":"🇪🇸","desc":"Tapa manchega por excelencia. Pimientos rojos carnosos asados al horno hasta que la piel se carbonice, pelados a mano y combinados con tomate reducido, aderezados con un majado tradicional de mortero con ajo morado, sal gorda y comino en grano.","prepTime":15,"cookTime":45,"difficulty":"Fácil","baseServings":4,"image":"https://images.unsplash.com/photo-1592417817098-8f3d6eb22515?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Sin gluten","Para preparar antes","Tapa fría"],"partyRole":"Entrante refrescante y sabroso para compartir al centro","drinkPairing":"Vino blanco Airén manchego o tinto ligero de Valdepeñas","ingredients":[{"id":"am-1","name":"Pimientos rojos de asar carnosos (morrones)","amount":4,"unit":"unidades grandes","category":"verdura"},{"id":"am-2","name":"Tomates maduros triturados o salsa de tomate frito casera","amount":300,"unit":"g","category":"despensa"},{"id":"am-3","name":"Dientes de ajo morado de Las Pedroñeras","amount":3,"unit":"dientes","category":"verdura"},{"id":"am-4","name":"Comino en grano","amount":1,"unit":"cucharadita colmada","category":"especia"},{"id":"am-5","name":"Aceite de oliva virgen extra","amount":70,"unit":"ml","category":"despensa"},{"id":"am-6","name":"Vinagre de Jerez reserva (opcional)","amount":1,"unit":"cucharada","category":"despensa"},{"id":"am-7","name":"Huevos cocidos y ventresca de bonito (para decorar)","amount":2,"unit":"huevos","category":"carne_pescado"}],"steps":[{"stepNumber":1,"instruction":"Unta los pimientos con un hilo de AOVE y ásalos en horno precalentado a 200°C durante 40-45 minutos, dándoles la vuelta a mitad. Sácalos, envuélvelos en papel aluminio o tápalos en un bol 15 minutos para que suden.","tip":"El sudado hace que la piel se desprenda sin ningún esfuerzo y conserve todos los jugos caramelizados del asado.","durationMinutes":45},{"stepNumber":2,"instruction":"Pela los pimientos, retira pepitas y desgárralos en tiras longitudinales con las manos. ¡Guarda el jugo que sueltan!","tip":"Nunca laves los pimientos bajo el grifo de agua o perderán todo su sabor a asado.","durationMinutes":10},{"stepNumber":3,"instruction":"En un mortero tradicional, maja los ajos con una pizca de sal gorda y el comino en grano hasta lograr una pasta homogénea.","tip":"Tostar ligeramente el comino antes en una sartén seca despierta sus aceites esenciales.","durationMinutes":5},{"stepNumber":4,"instruction":"En una cazuela con un chorro de aceite, sofríe ligeramente el tomate. Añade las tiras de pimiento con su jugo colado y el majado del mortero. Cocina a fuego lento durante 8-10 minutos para integrar los sabores.","tip":"Deja enfriar por completo antes de servir. Decora con cuartos de huevo duro y lascas de bonito en conserva.","durationMinutes":10}],"regionalVariants":[{"name":"Asadillo con Huevo y Ventresca de Atún","region":"Ciudad Real / Toledo","description":"La presentación festiva habitual corona el asadillo con ventresca de atún de calidad superior y láminas de huevo cocido de corral.","optionalAdditions":["1 lata de ventresca de atún en aceite","2 huevos cocidos"]}],"chefTips":["El asadillo gana enteros si se toma del tiempo o ligeramente frío con pan rústico tostado.","El jugo de asar los pimientos es oro líquido: agrégalo siempre al sofrito de tomate."],"robot":{"servings":4,"factor":1,"note":"Los pimientos se siguen asando al horno. El robot hace el majado y el guiso final.","ingredients":["4 unidades grandes · Pimientos rojos de asar carnosos (morrones)","300 g · Tomates maduros triturados o salsa de tomate frito casera","3 dientes · Dientes de ajo morado de Las Pedroñeras","1 cucharadita colmada · Comino en grano","70 ml · Aceite de oliva virgen extra","1 cucharada · Vinagre de Jerez reserva (opcional)","2 huevos · Huevos cocidos y ventresca de bonito (para decorar)"],"steps":[{"stepNumber":1,"instruction":"Asa los pimientos al horno a 200 °C 40-45 min, pélalos y córtalos en tiras. Guarda su jugo."},{"stepNumber":2,"instruction":"Ajos, comino y una pizca de sal gorda: 5 s a velocidad 7. Baja los restos con la espátula."},{"stepNumber":3,"instruction":"Añade el aceite y el tomate: 6 min a 120 °C, velocidad 1."},{"stepNumber":4,"instruction":"Añade las tiras de pimiento con su jugo: 10 min a 100 °C, velocidad 1 (giro inverso). Sirve templado con huevo cocido y bonito."}]}},{"id":"samfaina-catalana","title":"Samfaina Catalana Melosa","subtitle":"La armonía mediterránea de berenjena, calabacín y tomate confitado","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Cataluña","originFlag":"🇪🇸","desc":"La prima hermana catalana del pisto y del ratatouille provenzal. Un guiso melosísimo de verduras de huerta cortadas en dados que se incorporan en orden estricto de dureza para que cada hortaliza conserve su textura mantecosa sin desmoronarse.","prepTime":20,"cookTime":45,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1572449043416-55f4685c9bb7?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Sin gluten","Guiso de fiesta","Versátil"],"partyRole":"Guarnición caliente o cazuela central para mojar pan","drinkPairing":"Vino tinto del Penedès (Garnacha) o Cava brut nature bien frío","ingredients":[{"id":"sc-1","name":"Berenjena grande morada","amount":1,"unit":"unidad (aprox 350g)","category":"verdura"},{"id":"sc-2","name":"Calabacín fresco","amount":1,"unit":"unidad (aprox 300g)","category":"verdura"},{"id":"sc-3","name":"Pimiento rojo carnoso","amount":1,"unit":"unidad","category":"verdura"},{"id":"sc-4","name":"Pimiento verde italiano","amount":1,"unit":"unidad","category":"verdura"},{"id":"sc-5","name":"Cebollas medianas","amount":2,"unit":"unidades","category":"verdura"},{"id":"sc-6","name":"Tomates maduros carnosos rallados","amount":4,"unit":"unidades","category":"verdura"},{"id":"sc-7","name":"Dientes de ajo","amount":2,"unit":"dientes","category":"verdura"},{"id":"sc-8","name":"Aceite de oliva virgen extra","amount":80,"unit":"ml","category":"despensa"},{"id":"sc-9","name":"Sal, pimienta y ramita de tomillo fresco","amount":null,"unit":"al gusto","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Corta la berenjena y el calabacín en dados de 1,5 cm. Corta los pimientos y la cebolla en dados del mismo tamaño. Pica el ajo fino.","tip":"Si la berenjena amarga, espolvoréala con sal 15 min y sécala con papel antes de saltear.","durationMinutes":15},{"stepNumber":2,"instruction":"En una cazuela de fondo grueso con aceite de oliva, sofríe la cebolla y los pimientos durante 15 minutos a fuego medio hasta que empiecen a caramelizar.","tip":"El orden de las verduras es crucial: pimientos y cebolla necesitan más tiempo que el calabacín.","durationMinutes":15},{"stepNumber":3,"instruction":"Añade la berenjena y el calabacín con el ajo y la ramita de tomillo. Tapa la cazuela durante 10 minutos para que el vapor ablande los dados de berenjena en su propio jugo.","tip":"Tapar al principio permite reducir la cantidad de aceite absorbido por la berenjena.","durationMinutes":10},{"stepNumber":4,"instruction":"Destapa, añade el tomate rallado, sal y pimienta negra. Cocina a fuego lento durante 20 minutos destapado, removiendo ocasionalmente hasta que el agua evapore y quede una textura densa y brillante.","tip":"El punto óptimo es cuando el sofrito se funde casi como mermelada de verduras salada.","durationMinutes":20}],"regionalVariants":[{"name":"Samfaina amb Bacallà o Mandonguilles","region":"Costas de Girona y Maresme","description":"Para formato de fiesta grande, se añaden albóndigas de carne doradas o lomos de bacalao desalado que terminan de hacerse dentro de la samfaina.","optionalAdditions":["Albóndigas de ternera caseras","Lomos de bacalao confitados"]}],"chefTips":["Acompañamiento sublime tanto para carnes asadas como para comer directamente fría sobre coca de pan tostada."],"robot":{"servings":3,"factor":0.5,"note":"Mitad de cantidad: la berenjena abulta mucho en crudo.","ingredients":["0,5 unidad · Berenjena grande morada","0,5 unidad · Calabacín fresco","0,5 unidad · Pimiento rojo carnoso","0,5 unidad · Pimiento verde italiano","1 unidades · Cebollas medianas","2 unidades · Tomates maduros carnosos rallados","1 dientes · Dientes de ajo","40 ml · Aceite de oliva virgen extra","al gusto · Sal, pimienta y ramita de tomillo fresco"],"steps":[{"stepNumber":1,"instruction":"Cebolla y pimientos en trozos: 4 s a velocidad 4. Añade el aceite: 12 min a 120 °C, velocidad 1 (giro inverso)."},{"stepNumber":2,"instruction":"Añade berenjena y calabacín en dados, el ajo y el tomillo: 10 min a 120 °C, velocidad 1 (giro inverso)."},{"stepNumber":3,"instruction":"Añade el tomate rallado, sal y pimienta: 20 min a 110 °C, velocidad 1 (giro inverso), sin cubilete, hasta que se evapore el agua."}]}},{"id":"caponata-siciliana","title":"Caponata Siciliana Agridulce","subtitle":"El clásico siciliano agrodolce con alcaparras, apio y aceitunas","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Sicilia, Italia","originFlag":"🇮🇹","desc":"Plato insignia de la cocina siciliana de raíces árabes y españolas. Berenjenas fritas crujientes combinadas con apio blanqueado, cebolla caramelizada, aceitunas verdes Nocellara, alcaparras de Pantelleria y una reducción irresistible de vinagre y azúcar (agrodolce). Servida siempre fría o del tiempo.","prepTime":25,"cookTime":35,"difficulty":"Media","baseServings":6,"image":"https://images.unsplash.com/photo-1592417817098-8f3d6eb22515?auto=format&fit=crop&w=800&q=80","tags":["Agridulce","Vegano","Para preparar antes","Mezze estrella"],"partyRole":"Antipasto gourmet frío con tostas crujientes de focaccia","drinkPairing":"Vino blanco siciliano Grillo, Nero d’Avola o Aperol Spritz","ingredients":[{"id":"cs-1","name":"Berenjenas firmes","amount":2,"unit":"unidades grandes (aprox 700g)","category":"verdura"},{"id":"cs-2","name":"Ramas de apio fresco","amount":2,"unit":"tallos limpios","category":"verdura"},{"id":"cs-3","name":"Cebolla blanca grande","amount":1,"unit":"unidad en juliana","category":"verdura"},{"id":"cs-4","name":"Aceitunas verdes deshuesadas","amount":80,"unit":"g","category":"despensa"},{"id":"cs-5","name":"Alcaparras desaladas","amount":30,"unit":"g","category":"despensa"},{"id":"cs-6","name":"Piñones tostados","amount":25,"unit":"g","category":"despensa"},{"id":"cs-7","name":"Tomate triturado passata","amount":250,"unit":"g","category":"despensa"},{"id":"cs-8","name":"Vinagre de vino blanco o manzana","amount":50,"unit":"ml","category":"despensa"},{"id":"cs-9","name":"Azúcar blanco","amount":25,"unit":"g","category":"despensa"},{"id":"cs-10","name":"Aceite de oliva virgen extra para freír","amount":120,"unit":"ml","category":"despensa"},{"id":"cs-11","name":"Hojas de albahaca fresca","amount":8,"unit":"hojas","category":"verdura"}],"steps":[{"stepNumber":1,"instruction":"Corta las berenjenas en cubos de 2 cm. Fríelas en abundante aceite de oliva bien caliente hasta que estén doradas por fuera y cremosas por dentro. Escúrrelas sobre papel absorbente y reserva.","tip":"Freír las berenjenas por separado y a temperatura alta evita que se vuelvan gomosas y grasientas.","durationMinutes":15},{"stepNumber":2,"instruction":"Corta el apio en trocitos de 1 cm y blanquéalo en agua hirviendo con sal durante 3 minutos. Escurre bien.","tip":"Blanquear el apio suaviza su amargor y mantiene su agradable mordida crujiente.","durationMinutes":5},{"stepNumber":3,"instruction":"En una cazuela con 3 cucharadas de aceite, pocha la cebolla en juliana hasta que esté tierna. Agrega el apio blanqueado, las aceitunas troceadas, las alcaparras y los piñones. Saltea 3 minutos.","tip":"El aroma de las alcaparras y aceitunas calientes es inconfundible.","durationMinutes":5},{"stepNumber":4,"instruction":"Añade el tomate passata y cocina 10 minutos a fuego suave. Mezcla en un vasito el vinagre con el azúcar e incorpóralo a la cazuela junto con los cubos de berenjena frita.","tip":"Cocina a fuego medio 5 minutos más hasta que se evapore el golpe alcohólico del vinagre y quede una salsa almibarada agridulce.","durationMinutes":10},{"stepNumber":5,"instruction":"Apaga el fuego, añade las hojas de albahaca fresca rasgadas a mano y deja reposar al menos 4 horas antes de servir (ideal de un día para otro en nevera, sacando 30 min antes).","tip":"La caponata fría al día siguiente es gloria bendita.","durationMinutes":5}],"regionalVariants":[{"name":"Caponata Palermitana con Cacao Amargo","region":"Palermo, Sicilia","description":"La aristocrática versión palermitana incluye una pizca de cacao puro amargo en polvo (1 cdta) que aporta un color caoba oscuro y un regusto complejo adictivo.","optionalAdditions":["1 cucharadita de cacao puro desgrasado"]},{"name":"Variante con Pasas de Corinto","region":"Catania y Mesina","description":"Añaden uvas pasas remojadas en vino dulce junto con los piñones para intensificar el contraste dulce.","optionalAdditions":["30g de pasas sultanas hidratadas"]}],"chefTips":["Nunca la sirvas hirviendo: la caponata se concibe para temperatura ambiente o ligeramente fresca."],"robot":{"servings":3,"factor":0.5,"note":"La berenjena frita en sartén queda mejor. El robot hace la base agridulce.","ingredients":["1 unidades grandes · Berenjenas firmes","1 tallos limpios · Ramas de apio fresco","0,5 unidad en juliana · Cebolla blanca grande","40 g · Aceitunas verdes deshuesadas","15 g · Alcaparras desaladas","12 g · Piñones tostados","125 g · Tomate triturado passata","25 ml · Vinagre de vino blanco o manzana","12 g · Azúcar blanco","60 ml · Aceite de oliva virgen extra para freír","4 hojas · Hojas de albahaca fresca"],"steps":[{"stepNumber":1,"instruction":"Fríe los dados de berenjena en sartén con el aceite hasta dorar y escurre."},{"stepNumber":2,"instruction":"Cebolla en juliana a cuchillo con 3 cucharadas de aceite: 8 min a 120 °C, velocidad 1 (giro inverso)."},{"stepNumber":3,"instruction":"Añade el apio en trocitos, aceitunas, alcaparras y piñones: 5 min a 120 °C, velocidad 1 (giro inverso)."},{"stepNumber":4,"instruction":"Añade el tomate: 10 min a 100 °C, velocidad 1 (giro inverso). Añade el vinagre con el azúcar y la berenjena frita: 3 min a 100 °C, velocidad 1 (giro inverso)."},{"stepNumber":5,"instruction":"Pasa a una fuente, añade la albahaca y deja reposar al menos 4 h."}]}},{"id":"zaalouk-marroqui","title":"Zaalouk Marroquí (Caviar de Berenjena)","subtitle":"Berenjenas asadas y machacadas al comino, pimentón y cilantro","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Marruecos","originFlag":"🇲🇦","desc":"El estandarte de las ensaladas cocinadas marroquíes. Berenjenas asadas o cocidas, reducidas a fuego vivo con tomates rallados, ajo machacado, pimentón dulce, comino molido y un generoso golpe de cilantro y limón fresco.","prepTime":15,"cookTime":30,"difficulty":"Fácil","baseServings":4,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Sin gluten","Mezze exótico","Dip especiado"],"partyRole":"Dip caliente o templado para servir con pan de pita caliente","drinkPairing":"Té verde a la menta moruno o vino rosado fresco","ingredients":[{"id":"zk-1","name":"Berenjenas medianas","amount":2,"unit":"unidades (aprox 600g)","category":"verdura"},{"id":"zk-2","name":"Tomates maduros grandes rallados","amount":3,"unit":"unidades","category":"verdura"},{"id":"zk-3","name":"Dientes de ajo prensados","amount":4,"unit":"dientes","category":"verdura"},{"id":"zk-4","name":"Pimentón dulce ahumado","amount":1.5,"unit":"cucharadita","category":"especia"},{"id":"zk-5","name":"Comino molido fresco","amount":1.5,"unit":"cucharadita","category":"especia"},{"id":"zk-6","name":"Pizca de cayena molida o harissa (opcional)","amount":0.5,"unit":"cucharadita","category":"especia"},{"id":"zk-7","name":"Cilantro y perejil fresco picados","amount":3,"unit":"cucharadas colmadas","category":"verdura"},{"id":"zk-8","name":"Zumo de medio limón","amount":1,"unit":"cucharada","category":"verdura"},{"id":"zk-9","name":"Aceite de oliva virgen extra","amount":60,"unit":"ml","category":"despensa"},{"id":"zk-10","name":"Sal marina","amount":1,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Pela las berenjenas a rayas (dejando tiras de piel alternadas) y córtalas en dados. Cuécelas al vapor o en agua hirviendo con sal durante 12-15 minutos hasta que estén blandas. Escurre presionando en un colador.","tip":"Si prefieres un toque ahumado supremo, puedes asarlas enteras sobre la llama directa o al horno a 220°C en lugar de hervirlas.","durationMinutes":15},{"stepNumber":2,"instruction":"En una sartén grande, calienta el AOVE y añade el tomate rallado, los ajos prensados, el pimentón, el comino y la sal. Sofríe a fuego medio durante 8 minutos hasta que el tomate reduzca a pasta espesa.","tip":"La combinación de comino, pimentón y ajo en el aceite caliente creará el aroma base marroquí.","durationMinutes":8},{"stepNumber":3,"instruction":"Añade las berenjenas cocidas y escurridas. Con un tenedor de madera o machacador de patatas, ve triturando la berenjena mientras se cocina a fuego vivo para evaporar toda el agua residual.","tip":"No debe quedar líquido: la berenjena debe absorber toda la pasta de tomate especiada.","durationMinutes":10},{"stepNumber":4,"instruction":"Cuando tenga textura de puré espeso y rústico, añade el cilantro y perejil picados y un chorro de zumo de limón fresco. Remueve 1 minuto más y retira del fuego.","tip":"Sirve decorado con unas aceitunas negras marroquíes arrugadas y un hilo de buen AOVE.","durationMinutes":2}],"regionalVariants":[{"name":"Zaalouk Fesí Ahumado a la Brasa","region":"Fez, Marruecos","description":"La berenjena se quema directamente sobre el fuego hasta que la piel se carboniza como en el Baba Ganoush, aportando notas ahumadas profundas.","optionalAdditions":["Asar a llama viva"]}],"chefTips":["Increíble para dipear tanto frío como templado; acompaña a la perfección platos de carne o brochetas."],"robot":{"servings":3,"factor":0.75,"note":"Receta ideal para el robot: cuece, sofríe y tritura en el mismo vaso.","ingredients":["1,5 unidades · Berenjenas medianas","2,25 unidades · Tomates maduros grandes rallados","3 dientes · Dientes de ajo prensados","1 cucharadita · Pimentón dulce ahumado","1 cucharadita · Comino molido fresco","0,5 cucharadita · Pizca de cayena molida o harissa (opcional)","2,25 cucharadas colmadas · Cilantro y perejil fresco picados","0,75 cucharada · Zumo de medio limón","45 ml · Aceite de oliva virgen extra","0,75 cucharadita · Sal marina"],"steps":[{"stepNumber":1,"instruction":"Berenjena en dados en el cestillo, con 500 ml de agua y sal en el vaso: 15 min a 100 °C, velocidad 4. Escurre y vacía el vaso."},{"stepNumber":2,"instruction":"Ajo, aceite, tomate rallado, pimentón, comino y sal: 8 min a 120 °C, velocidad 1."},{"stepNumber":3,"instruction":"Añade la berenjena: 10 min a 120 °C, velocidad 2, sin cubilete, para que evapore y se deshaga."},{"stepNumber":4,"instruction":"Añade cilantro, perejil y limón: 5 s a velocidad 3. Debe quedar rústico, no hecho puré."}]}},{"id":"shakshuka-tunecina","title":"Shakshuka Magrebí / Tunecina","subtitle":"El sofrito especiado con pimientos, harissa y tomate para mojar pan","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Túnez / Oriente Medio","originFlag":"🇹🇳","desc":"Un sofrito suculento y especiado a fuego lento con pimientos dulces, cebolla pochada, comino, pimentón y pasta de harissa. Para una fiesta, es la base perfecta de dipping o se puede servir con huevitos de codorniz pochados en la salsa.","prepTime":15,"cookTime":30,"difficulty":"Fácil","baseServings":4,"image":"https://images.unsplash.com/photo-1590412200988-a436970781fa?auto=format&fit=crop&w=800&q=80","tags":["Dipeable","Picante opcional","Vegetariano","Especiado"],"partyRole":"Cazuela caliente al centro para rebañar hasta la última gota","drinkPairing":"Cerveza artesana IPA o vino tinto afrutado","ingredients":[{"id":"sh-1","name":"Cebolla morada o dulce en juliana","amount":2,"unit":"unidades medianas","category":"verdura"},{"id":"sh-2","name":"Pimientos rojos en tiras finas","amount":2,"unit":"unidades","category":"verdura"},{"id":"sh-3","name":"Pimiento amarillo o verde","amount":1,"unit":"unidad","category":"verdura"},{"id":"sh-4","name":"Dientes de ajo laminados","amount":3,"unit":"dientes","category":"verdura"},{"id":"sh-5","name":"Tomate troceado o triturado de calidad","amount":500,"unit":"g","category":"despensa"},{"id":"sh-6","name":"Pasta de Harissa tunecina o pimentón picante","amount":1,"unit":"cucharada colmada","category":"despensa"},{"id":"sh-7","name":"Comino molido","amount":1,"unit":"cucharadita","category":"especia"},{"id":"sh-8","name":"Cilantro fresco y perejil picados","amount":2,"unit":"cucharadas","category":"verdura"},{"id":"sh-9","name":"Huevos camperos (o de codorniz para fiesta)","amount":4,"unit":"unidades","category":"lacteo"},{"id":"sh-10","name":"Queso feta desmenuzado (opcional)","amount":60,"unit":"g","category":"lacteo"},{"id":"sh-11","name":"Aceite de oliva virgen extra","amount":60,"unit":"ml","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Calienta el AOVE en una sartén ancha (preferiblemente de hierro fundido). Añade la cebolla y los pimientos en tiras. Saltea a fuego medio durante 15 minutos hasta que estén muy tiernos y con bordes dorados.","tip":"No tapes la sartén para que los pimientos caramelicen y no se cocinen al vapor.","durationMinutes":15},{"stepNumber":2,"instruction":"Añade el ajo laminado, el comino y la harissa. Remueve durante 1-2 minutos para tostar ligeramente las especias en el aceite caliente.","tip":"Si hay comensales sensibles al picante, puedes usar harissa suave o pimentón dulce.","durationMinutes":2},{"stepNumber":3,"instruction":"Vierte los tomates troceados con su jugo, sal y pimienta. Reduce a fuego lento durante 15 minutos removiendo de vez en cuando hasta que la salsa espese notablemente.","tip":"La consistencia debe ser bien densa para sostener los huevos.","durationMinutes":15},{"stepNumber":4,"instruction":"Haz pequeños huecos en la salsa con una cuchara. Casca un huevo en cada hueco. Tapa la sartén y cocina a fuego suave 5-7 minutos hasta que las claras estén cuajadas pero las yemas sigan completamente líquidas.","tip":"Para fiestas tipo picoteo, usa huevitos de codorniz: cuajan en 2 minutos y son perfectos para tostas individuales.","durationMinutes":6},{"stepNumber":5,"instruction":"Espolvorea queso feta desmenuzado, hojas de cilantro fresco y sirve directamente en la misma sartén bien caliente.","tip":"Acompaña con pan jalá o pan pita recién horneado.","durationMinutes":2}],"regionalVariants":[{"name":"Variante con Salchichas Merguez Especiadas","region":"Argelia y Túnez","description":"Se doran trocitos de salchicha de cordero magrebí (merguez) con los pimientos antes de añadir el tomate.","optionalAdditions":["150g salchicha merguez en rodajas"]},{"name":"Variante Verde (Green Shakshuka)","region":"Tel Aviv","description":"Sustituye el tomate por acelgas, espinacas tiernas, puerro y calabacín pochados en mantequilla clarificada con comino.","optionalAdditions":["Espinacas frescas","Puerro pochado"]}],"chefTips":["Puedes preparar toda la base del sofrito con 24 horas de antelación y solo calentarlo y cascar los huevos justo cuando lleguen tus invitados."],"robot":{"servings":4,"factor":1,"note":"La salsa se hace en el robot. Los huevos se cuajan en sartén para que queden enteros.","ingredients":["2 unidades medianas · Cebolla morada o dulce en juliana","2 unidades · Pimientos rojos en tiras finas","1 unidad · Pimiento amarillo o verde","3 dientes · Dientes de ajo laminados","500 g · Tomate troceado o triturado de calidad","1 cucharada colmada · Pasta de Harissa tunecina o pimentón picante","1 cucharadita · Comino molido","2 cucharadas · Cilantro fresco y perejil picados","4 unidades · Huevos camperos (o de codorniz para fiesta)","60 g · Queso feta desmenuzado (opcional)","60 ml · Aceite de oliva virgen extra"],"steps":[{"stepNumber":1,"instruction":"Cebolla y pimientos en tiras a cuchillo con el aceite: 12 min a 120 °C, velocidad 1 (giro inverso)."},{"stepNumber":2,"instruction":"Añade ajo, comino y harissa: 2 min a 120 °C, velocidad 1 (giro inverso)."},{"stepNumber":3,"instruction":"Añade el tomate, sal y pimienta: 15 min a 110 °C, velocidad 1 (giro inverso), sin cubilete."},{"stepNumber":4,"instruction":"Pasa la salsa a una sartén, haz huecos y cuaja los huevos tapados 5-7 min. Termina con feta y cilantro."}]}},{"id":"escalivada-catalana","title":"Escalivada Catalana a la Llama","subtitle":"Verduras asadas al humo con ventresca de bonito y anchoas del Cantábrico","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Cataluña","originFlag":"🇪🇸","desc":"Berenjenas, pimientos rojos y cebollas asados enteros a fuego vivo hasta quedar tiernos y profundamente perfumados de humo. Pelados a mano en hebras sedosas y aliñados con aceite virgen extra, escamas de sal y coronados con anchoas y ventresca.","prepTime":20,"cookTime":50,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1594998893017-36147cbcae05?auto=format&fit=crop&w=800&q=80","tags":["Sin gluten","Bajo en calorías","Plato frío","Gourmet"],"partyRole":"Entrante templado o frío servido sobre tostadas de payés","drinkPairing":"Cava brut nature o vino blanco de Alella","ingredients":[{"id":"es-1","name":"Berenjenas medianas enteras","amount":2,"unit":"unidades","category":"verdura"},{"id":"es-2","name":"Pimientos rojos de asar carnosos","amount":2,"unit":"unidades","category":"verdura"},{"id":"es-3","name":"Cebollas grandes con piel","amount":2,"unit":"unidades","category":"verdura"},{"id":"es-4","name":"Filetes de anchoas del Cantábrico en aceite","amount":8,"unit":"filetes","category":"carne_pescado"},{"id":"es-5","name":"Ventresca  Filetes de anchoas del Cantábrico en aceite","150 g · Ventresca de bonito del norte en aceite de oliva","1 diente · Diente de ajo frotado","80 ml · Aceite de oliva virgen extra arbequina","al gusto · Sal en escamas (Maldon)"],"steps":[{"stepNumber":1,"instruction":"Asa las verduras al horno a 200 °C 45-50 min y déjalas sudar tapadas 15 min. Pélalas y córtalas en tiras."},{"stepNumber":2,"instruction":"Vinagreta: aceite, ajo, sal y un chorrito de vinagre: 10 s a velocidad 5."},{"stepNumber":3,"instruction":"Monta la fuente con las verduras, las anchoas y la ventresca, y riega con la vinagreta."}]}},{"id":"tumbet-mallorquin","title":"Tumbet Mallorquín Tradicional","subtitle":"Capas doradas de patata, berenjena y pimientos con salsa de tomate de ramillete","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Mallorca, Islas Baleares","originFlag":"🇪🇸","desc":"Una de las grandes obras de la cocina balear. Capas sucesivas de patatas fritas en rodajas, berenjenas tiernas doradas y pimientos rojos dulces, cubiertas por un sofrito concentrado de tomate con ajo y laurel. Se sirve en cazuela de barro típica.","prepTime":30,"cookTime":40,"difficulty":"Media","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegetariano","Sin gluten","Tradición balear","Festín"],"partyRole":"Cazuela templada central para cortar y servir en porciones","drinkPairing":"Vino tinto de Binissalem (Manto Negro) o blanco de Prensal Blanc","ingredients":[{"id":"tb-1","name":"Patatas agrias para freír","amount":3,"unit":"unidades medianas","category":"verdura"},{"id":"tb-2","name":"Berenjenas medianas","amount":2,"unit":"unidades","category":"verdura"},{"id":"tb-3","name":"Pimientos rojos dulces","amount":2,"unit":"unidades en tiras","category":"verdura"},{"id":"tb-4","name":"Tomates maduros triturados","amount":600,"unit":"g","category":"verdura"},{"id":"tb-5","name":"Dientes de ajo con piel chafados","amount":4,"unit":"dientes","category":"verdura"},{"id":"tb-6","name":"Hoja de laurel fresca","amount":1,"unit":"hoja","category":"especia"},{"id":"tb-7","name":"Aceite de oliva virgen para freír","amount":200,"unit":"ml","category":"despensa"},{"id":"tb-8","name":"Sal marina","amount":null,"unit":"al gusto","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Corta las patatas y las berenjenas en rodajas de 0,5 cm. Pela y desala las berenjenas 20 min con un poco de sal.","tip":"Seca con papel antes de freír para que no salte el aceite.","durationMinutes":20},{"stepNumber":2,"instruction":"Fríe primero las patatas en AOVE hasta que estén tiernas y doraditas. Escurre y colócalas cubriendo el fondo de una cazuela de barro o fuente de servir. Sazona con sal.","tip":"Las patatas forman la base que recogerá todos los jugos de las verduras superiores.","durationMinutes":15},{"stepNumber":3,"instruction":"En el mismo aceite fríe las rodajas de berenjena y colócalas en una segunda capa sobre las patatas. Luego fríe las tiras de pimiento rojo y ponlas en la tercera capa.","tip":"Escurre bien cada verdura sobre papel de cocina antes de montar las capas.","durationMinutes":15},{"stepNumber":4,"instruction":"En 3 cucharadas del mismo aceite aromatizado, dora los ajos chafados y el laurel. Añade el tomate triturado con sal y cocina 20 minutos hasta tener una salsa espesa y brillante.","tip":"Cubre el tumbet con la salsa de tomate bien caliente y deja reposar antes de servir.","durationMinutes":20}],"regionalVariants":[{"name":"Tumbet con Lomo de Cerdo o Huevos","region":"Poblaciones del Raiguer","description":"Se corona el tumbet con cinta de lomo adobada a la plancha o huevos fritos de corral.","optionalAdditions":["Filetes de lomo de cerdo adobado","Huevos fritos"]}],"chefTips":["Gana una melosidad increíble si se deja reposar 2 o 3 horas; las patatas absorben la salsa de tomate y el perfume del pimiento."],"robot":{"servings":6,"factor":1,"note":"Las capas fritas se hacen e  para decorar"],"steps":[{"stepNumber":1,"instruction":"Tahini, limón, ajo y sal: 1 min a velocidad 7."},{"stepNumber":2,"instruction":"Añade remolacha en trozos y garbanzos: 2 min a velocidad 8, bajando los restos a mitad."},{"stepNumber":3,"instruction":"Añade los cubitos de hielo uno a uno con el motor en marcha a velocidad 8: 2 min más."},{"stepNumber":4,"instruction":"Decora con feta, sésamo negro y aceite."}]}},{"id":"hummus-pimiento-asado","title":"Hummus de Pimiento Asado y Pimentón","subtitle":"Toque ahumado y color rojizo cálido","category":"untables","categoryLabel":"Untables (Hummus)","origin":"Mediterráneo Español / Oriente","originFlag":"🇪🇸","desc":"La fusión perfecta entre el mezze oriental y el alma del pimiento asado español. Garbanzos sedosos fundidos con tiras de pimiento rojo asado al fuego y una caricia de pimentón dulce ahumado de La Vera.","prepTime":10,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Sin gluten","Ahumado","Dipeable"],"partyRole":"Dip cálido y reconfortante para picos y regañás","drinkPairing":"Cerveza tostada o vino tinto joven","ingredients":[{"id":"hp-1","name":"Garbanzos cocidos","amount":400,"unit":"g","category":"despensa"},{"id":"hp-2","name":"Pimientos rojos asados bien escurridos","amount":150,"unit":"g","category":"verdura"},{"id":"hp-3","name":"Tahini","amount":60,"unit":"g","category":"despensa"},{"id":"hp-4","name":"Pimentón dulce ahumado de La Vera","amount":1,"unit":"cucharadita","category":"especia"},{"id":"hp-5","name":"Zumo de limón","amount":30,"unit":"ml","category":"verdura"},{"id":"hp-6","name":"Diente de ajo","amount":1,"unit":"diente","category":"verdura"},{"id":"hp-7","name":"Aceite de oliva virgen extra","amount":30,"unit":"ml","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Seca los pimientos asados con papel de cocina para no incorporar exceso de agua al hummus.","tip":"El exceso de agua arruinaría la cremosidad de la mezcla.","durationMinutes":2},{"stepNumber":2,"instruction":"Tritura los garbanzos con los pimientos asados, tahini, limón, ajo, pimentón y sal hasta lograr una consistencia cremosa.","tip":"Añade agua helada en hilo para emulsionar a la perfección.","durationMinutes":4},{"stepNumber":3,"instruction":"Emplata con pimentón espolvoreado y tiras finas de pimiento rojo asado por encima.","tip":"Sírvelo con regañás andaluzas o pan de pita tostado.","durationMinutes":2}],"regionalVariants":[{"name":"Variante Picante con Guindilla Ahumada","region":"Extremadura y Levante","description":"Sustituye la mitad del pimentón dulce por pimentón picante para una chispa vibrante.","optionalAdditions":["Pimentón picante de La Vera"]}],"chefTips":["Si tienes restos del asadillo manchego o de escalivada, úsalos como pimiento asado para un sabor aún más complejo."],"robot":{"servings":6,"factor":1,"note":"Seca bien los pimientos para que no quede aguado.","ingredients":["400 g · Garbanzos cocidos","150 g · Pimientos rojos asados bien escurridos","60 g · Tahini","1 cucharadita · Pimentón dulce ahumado de La Vera","30 ml · Zumo de limón","1 diente · Diente de ajo","30 ml · Aceite de oliva virgen extra"],"steps":[{"stepNumber":1,"instruction":"Todo en el vaso: 1 min a velocidad 8."},{"stepNumber":2,"instruction":"Baja los restos de las paredes y otro minuto a velocidad 8 hasta que quede cremoso."},{"stepNumber":3,"instruction":"Emplata con pimentón y tiras de pimiento."}]}},{"id":"baba-ganoush-mutabal","title":"Baba Ganoush (Mutabal Libanés)","subtitle":"Puré sedoso de berenjena asada con perfume ahumado y tahini","category":"untables","categoryLabel":"Untables (Hummus)","origin":"Líbano / Siria","originFlag":"🇱🇧","desc":"Uno de los platos más sublimes de todo Oriente Próximo. Berenjenas enteras quemadas a fuego vivo hasta que la piel se arruga y la carne interior absorbe un aroma a brasa arrebatador. Se maja con tahini, ajo, limón, un toque de yogur y se corona con rubíes de granada fresca.","prepTime":15,"cookTime":40,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Ahumado supremo","Vegetariano","Sin gluten","Mezze estrella"],"partyRole":"Dip estrella de berenjena para competir con el hummus","drinkPairing":"Vino blanco libanés (Château Ksara) o cerveza rubia","ingredients":[{"id":"bg-1","name":"Berenjenas medianas y firmes","amount":2,"unit":"unidades grandes (aprox 700g)","category":"verdura"},{"id":"bg-2","name":"Tahini (pasta de sésamo)","amount":50,"unit":"g (2 cdas colmadas)","category":"despensa"},{"id":"bg-3","name":"Diente de ajo prensado","amount":1,"unit":"diente","category":"verdura"},{"id":"bg-4","name":"Zumo de limón fresco","amount":30,"unit":"ml","category":"verdura"},{"id":"bg-5","name":"Yogur griego natural sin azúcar","amount":50,"unit":"g (2 cdas)","note":"opcional tradicional mutabal","category":"lacteo"},{"id":"bg-6","name":"Granos de granada fresca","amount":3,"unit":"cucharadas para decorar","category":"verdura"},{"id":"bg-7","name":"Aceite de oliva virgen extra","amount":30,"unit":"ml","category":"despensa"},{"id":"bg-8","name":"Sal fina marina","amount":1,"unit":"cucharadita","category":"especia"},{"id":"bg-9","name":"Hojas de menta fresca o perejil","amount":1,"unit":"cucharada picada","category":"verdura"}],"steps":[{"stepNumber":1,"instruction":"Pincha las berenjenas con un tenedor en varios puntos. Para el auténtico sabor ahumado, colócalas directamente sobre la llama del fuego de gas de la cocina girándolas con pinzas durante 15 minutos hasta que la piel esté carbonizada y crujiente como papel. (Si no tienes gas, hornéalas a 220°C en posición grill durante 40 min).","tip":"El quemado de la piel no se comerá, pero transmite a la pulpa ese toque ahumado que distingue un baba ganoush memorable.","durationMinutes":20},{"stepNumber":2,"instruction":"Coloca las berenjenas en un plato, córtalas por la mitad longitudinalmente y extrae la pulpa blanca con una cuchara. Pon la pulpa en un colador durante 15 minutos para que suelte sus jugos amargos.","tip":"Escurrir bien el agua residual es la diferencia entre un puré aguado y una pasta densa y cremosa.","durationMinutes":15},{"stepNumber":3,"instruction":"Pica la pulpa a cuchillo sobre una tabla en lugar de batidora (o bate con 2 toques rápidos) para preservar su textura rústica y sedosa.","tip":"En Oriente Medio se maja con mortero o tenedor para no romper en exceso la fibra de la berenjena.","durationMinutes":5},{"stepNumber":4,"instruction":"En un bol, mezcla la pulpa con el tahini, el ajo prensado, el zumo de limón, el yogur griego y la sal hasta integrar.","tip":"Emplata haciendo surcos con una cuchara, baña en AOVE y decora con los granos de granada roja y menta picada.","durationMinutes":5}],"regionalVariants":[{"name":"Diferencia Tradicional: Baba Ganoush vs Mutabal","region":"Siria y Líbano","description":"Técnicamente, en Damasco el Baba Ganoush lleva berenjena, tomate picado, pimiento verde, nueces y melaza de granada SIN tahini. Al que lleva tahini y yogur se le llama Mutabal. En occidente se suelen usar ambos nombres para esta versión cremosa.","optionalAdditions":["Tomate y pimiento verde picados","Melaza de granada"]}],"chefTips":["Los granos de granada no son solo adorno: su estallido dulce y ácido en boca equilibra el sabor tostado del tahini de forma sublime."],"robot":{"servings":6,"factor":1,"note":"El ahumado sale de la llama: asa la berenjena fuera. El robot solo mezcla, sin triturar del todo.","ingredients":["2 unidades grandes (aprox 700g) · Berenjenas medianas y firmes","50 g (2 cdas colmadas) · Tahini (pasta de sésamo)","1 diente · Diente de ajo prensado","30 ml · Zumo de limón fresco","50 g (2 cdas) · Yogur griego natural sin azúcar","3 cucharadas para decorar · Granos de granada fresca","30 ml · Aceite de oliva virgen extra","1 cucharadita · Sal fina marina","1 cucharada picada · Hojas de menta fresca o perejil"],"steps":[{"stepNumber":1,"instruction":"Asa las berenjenas sobre la llama o al horno a 220 °C 40 min. Saca la pulpa y escúrrela 15 min."},{"stepNumber":2,"instruction":"Pulpa, tahini, ajo, limón, yogur y sal: 5 s a velocidad 4. Debe quedar con textura, no batido."},{"stepNumber":3,"instruction":"Sirve con granada, menta y aceite."}]}},{"id":"tzatziki-griego","title":"Tzatziki Griego Artesanal","subtitle":"Yogur colado, pepino prensado, eneldo fresco y ajo","category":"untables","categoryLabel":"Untables (Hummus)","origin":"Grecia","originFlag":"🇬🇷","desc":"El frescor absoluto del Egeo. La salsa griega más famosa del mundo: yogur griego auténtico y espeso, pepino rallado y exprimido hasta la última gota, eneldo fresco picado, ajo y un chorro de aceite de oliva virgen extra. Indispensable para limpiar el paladar y contrastar con guisos calientes.","prepTime":15,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegetariano","Sin gluten","Refrescante","Rápido"],"partyRole":"Contrapunto refrescante e higienizante de grasas para la mesa","drinkPairing":"Ouzo griego con hielo, vino blanco Retsina o cerveza lager","ingredients":[{"id":"tz-1","name":"Yogur griego auténtico natural (10% materia grasa)","amount":400,"unit":"g (no yogur desnatado)","category":"lacteo"},{"id":"tz-2","name":"Pepino mediano firme","amount":1,"unit":"unidad (aprox 250g)","category":"verdura"},{"id":"tz-3","name":"Dientes de ajo","amount":1.5,"unit":"dientes prensados muy fino","category":"verdura"},{"id":"tz-4","name":"Eneldo fresco picado","amount":2,"unit":"cucharadas colmadas","category":"verdura"},{"id":"tz-5","name":"Zumo de limón o vinagre de vino blanco","amount":15,"unit":"ml (1 cda)","category":"verdura"},{"id":"tz-6","name":"Aceite de oliva virgen extra griego o español","amount":30,"unit":"ml","category":"despensa"},{"id":"tz-7","name":"Sal marina","amount":1,"unit":"cucharadita","category":"especia"},{"id":"tz-8","name":"Aceituna Kalamata para decorar","amount":1,"unit":"unidad en el centro","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Pela el pepino (o déjalo a rayas) y rállalo por la parte gruesa del rallador de queso. Ponlo en un colador fino con media cucharadita de sal durante 10 minutos.","tip":"La sal ayuda a que el pepino suelte su agua libre por ósmosis.","durationMinutes":10},{"stepNumber":2,"instruction":"Envuelve el pepino rallado en un trapo de cocina limpio o gasa y apriétalo con fuerza extrema con las dos manos hasta que no caiga ni una sola gota de líquido.","tip":"¡Este es el paso sagrado del tzatziki! Si el pepino conserva agua, convertirá el yogur en una sopa lechosa en lugar de una crema densa.","durationMinutes":5},{"stepNumber":3,"instruction":"En un bol, vierte el yogur griego, el pepino estrujado, el ajo prensado, el eneldo fresco picado finísimo, el zumo de limón, el AOVE y una pizca de sal.","tip":"Mezcla enérgicamente con cuchara hasta integrar.","durationMinutes":3},{"stepNumber":4,"instruction":"Refrigera al menos 1 hora antes de servir para que los sabores se asienten y se sirva helado. Corona con una aceituna Kalamata entera y un hilo de aceite.","tip":"El frío resalta el crujido del pepino y la acidez balsámica del eneldo.","durationMinutes":2}],"regionalVariants":[{"name":"Variante con Menta Fresca (Cipriota)","region":"Chipre (Talattouri)","description":"En Chipre sustituyen o complementan el eneldo con menta seca y fresca picada, aportando un frescor aún más balsámico.","optionalAdditions":["Menta fresca finamente picada"]}],"chefTips":["Si el yogur no es lo bastante denso, ponlo a colar 30 minutos sobre un filtro de café antes de mezclarlo."],"robot":{"servings":6,"factor":1,"note":"El robot pica el pepino. El escurrido sigue siendo a mano y es clave.","ingredients":["400 g (no yogur desnatado) · Yogur griego auténtico natural (10% materia grasa)","1 unidad (aprox 250g) · Pepino mediano firme","1,5 dientes prensados muy fino · Dientes de ajo","2 cucharadas colmadas · Eneldo fresco picado","15 ml (1 cda) · Zumo de limón o vinagre de vino blanco","30 ml · Aceite de oliva virgen extra griego o español","1 cucharadita · Sal marina","1 unidad en el centro · Aceituna Kalamata para decorar"],"steps":[{"stepNumber":1,"instruction":"Pepino en trozos: 4 s a velocidad 5. Pásalo a un colador con media cucharadita de sal 10 min y estrújalo bien en un paño."},{"stepNumber":2,"instruction":"Ajo y eneldo: 3 s a velocidad 7."},{"stepNumber":3,"instruction":"Añade yogur, pepino escurrido, limón, aceite y sal: 10 s a velocidad 3 (giro inverso). Refrigera 1 h."}]}},{"id":"tirokafteri-griego","title":"Tirokafteri (Crema Picante de Feta)","subtitle":"El dip griego más potente: queso feta maduro, pimientos asados y chile","category":"untables","categoryLabel":"Untables (Hummus)","origin":"Grecia Septentrional (Tesalia)","originFlag":"🇬🇷","desc":"Para los amantes de las sensaciones intensas. Combina la salinidad penetrante del auténtico queso feta con la dulzura de los pimientos asados y el picante vivo de guindilla o chile, redondeado con yogur griego y aceite de oliva virgen.","prepTime":10,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Picante","Vegetariano","Sin gluten","Sabor potente"],"partyRole":"Dip contundente e irresistible para amantes del queso y el picor","drinkPairing":"Cerveza helada o vino blanco mineral Assyrtiko de Santorini","ingredients":[{"id":"tk-1","name":"Queso feta auténtico D.O.P. griego","amount":250,"unit":"g","category":"lacteo"},{"id":"tk-2","name":"Pimientos rojos asados bien escurridos","amount":2,"unit":"unidades","category":"verdura"},{"id":"tk-3","name":"Guindilla roja fresca picante o jalapeño","amount":1,"unit":"unidad (sin pepitas)","category":"verdura"},{"id":"tk-4","name":"Yogur griego natural","amount":60,"unit":"g (2 cdas)","category":"lacteo"},{"id":"tk-5","name":"Aceite de oliva virgen extra","amount":50,"unit":"ml","category":"despensa"},{"id":"tk-6","name":"Vinagre de vino blanco","amount":1,"unit":"cucharadita","category":"despensa"},{"id":"tk-7","name":"Orégano seco griego para espolvorear","amount":1,"unit":"pizca","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Desmenuza el queso feta con las manos en el vaso del procesador de alimentos.","tip":"Usa queso feta elaborado con leche de oveja y cabra, no quesos estilo feta de leche de vaca (pierden carácter salino).","durationMinutes":2},{"stepNumber":2,"instruction":"Añade los pimientos rojos asados secos, el chile picado fino, el yogur griego, el vinagre y la mitad del AOVE.","tip":"Si quieres controlar el picor, empieza con media guindilla y prueba antes de añadir el resto.","durationMinutes":3},{"stepNumber":3,"instruction":"Tritura con pulsaciones intermitentes. La textura no debe ser un puré líquido, sino una pasta rústica con pequeños grumos visibles de queso feta.","tip":"Añade el resto del aceite en hilo mientras pulsas.","durationMinutes":3},{"stepNumber":4,"instruction":"Sirve en un cuenco espolvoreando abundante orégano seco y escamas de chile.","tip":"Perfecto para untar en pan de pita caliente o mojar picos artesanos.","durationMinutes":2}],"regionalVariants":[{"name":"Variante Blanca Clásica (Sin Pimiento Rojo)","region":"Macedonia griega","description":"La versión tradicional de Salónica no lleva pimiento rojo asado: es blanca, hecha únicamente con queso feta, guindillas verdes encurtidas y aceite.","optionalAdditions":["Sustituir pimiento rojo por 2 guindillas verdes encurtidas"]}],"chefTips":["No le añadas sal: el queso feta ya aporta toda la sal necesaria para el plato."],"robot":{"servings":6,"factor":1,"note":"Pulsa con la tecla turbo en golpes cortos para dejar grumos de feta.","ingredients":["250 g · Queso feta auténtico D.O.P. griego","2 unidades · Pimientos rojos asados bien escurridos","1 unidad (sin pepitas) · Guindilla roja fresca picante o jalapeño","60 g (2 cdas) · Yogur griego natural","50 ml · Aceite de oliva virgen extra","1 cucharadita · Vinagre de vino blanco","1 pizca · Orégano seco griego para espolvorear"],"steps":[{"stepNumber":1,"instruction":"Pimientos, guindilla, yogur, vinagre y la mitad del aceite: 5 s a velocidad 5."},{"stepNumber":2,"instruction":"Añade el feta desmenuzado y pulsa turbo 3-4 golpes de 1 s. Debe quedar rústico."},{"stepNumber":3,"instruction":"Sirve con orégano y escamas de chile."}]}},{"id":"muhammara-siria","title":"Muhammara Siria Tradicional","subtitle":"Paté de pimientos asados, nueces tostadas y melaza de granada","category":"untables","categoryLabel":"Untables (Hummus)","origin":"Alepo, Siria","originFlag":"🇸🇾","desc":"Una de las joyas más reverenciadas de la gastronomía de Oriente Próximo nacida en Alepo. Una pasta de color caoba y textura untuosa que mezcla la dulzura del pimiento asado, el crujido mantecoso de las nueces tostadas, la acidez balsámica de la melaza de granada y un toque de comino.","prepTime":15,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Gourmet","Frutos secos","Agridulce"],"partyRole":"Dip sofisticado y elegante para sorprender a invitados sibaritas","drinkPairing":"Vino tinto especiado (Syrah) o cerveza de trigo","ingredients":[{"id":"mh-1","name":"Pimientos rojos asados escurridos","amount":3,"unit":"unidades grandes (aprox 300g)","category":"verdura"},{"id":"mh-2","name":"Nueces peladas de buena calidad","amount":120,"unit":"g","category":"despensa"},{"id":"mh-3","name":"Pan rallado o panko japonés","amount":40,"unit":"g (aprox 1/2 taza)","category":"panaderia"},{"id":"mh-4","name":"Melaza de granada (Dibs el Remman)","amount":2,"unit":"cucharadas soperas","note":"o reducción de vinagre balsámico dulce","category":"despensa"},{"id":"mh-5","name":"Zumo de limón fresco","amount":15,"unit":"ml (1 cda)","category":"verdura"},{"id":"mh-6","name":"Diente de ajo pequeño","amount":1,"unit":"diente","category":"verdura"},{"id":"mh-7","name":"Comino molido","amount":1,"unit":"cucharadita","category":"especia"},{"id":"mh-8","name":"Chile de Alepo o pimentón dulce con pizca picante","amount":1,"unit":"cucharadita","category":"especia"},{"id":"mh-9","name":"Aceite de oliva virgen extra","amount":50,"unit":"ml","category":"despensa"},{"id":"mh-10","name":"Sal marina","amount":1,"unit":"cucharadita rasa","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Tuesta las nueces en una sartén seca a fuego medio durante 4-5 minutos removiendo constantemente hasta que desprendan su fragancia tostada. Deja enfriar.","tip":"Tostar las nueces potencia su mantecosidad y elimina cualquier regusto amargo de la piel.","durationMinutes":5},{"stepNumber":2,"instruction":"En el procesador de alimentos, añade las nueces tostadas y el pan rallado. Pulsa 3 o 4 veces hasta lograr una molienda gruesa.","tip":"El pan rallado absorbe el agua del pimiento y confiere esa densidad característica que se mantiene firme en la cuchara.","durationMinutes":2},{"stepNumber":3,"instruction":"Agrega los pimientos asados secos, la melaza de granada, el ajo, comino, chile de Alepo, zumo de limón y sal. Tritura mientras añades el AOVE en hilo.","tip":"La textura ideal debe tener pequeños trocitos de nuez perceptibles que crujan suavemente.","durationMinutes":4},{"stepNumber":4,"instruction":"Emplata en plato hondo, decora con mitades de nuez entera tostada, un hilo generoso de melaza de granada y AOVE.","tip":"Sírvelo a temperatura ambiente acompañado de pan pita tostado.","durationMinutes":2}],"regionalVariants":[{"name":"Variante con Tahini (Estilo Damasquino)","region":"Damasco, Siria","description":"Se añade 1 cucharada sopera de tahini a la mezcla para darle una untuosidad más envolvente.","optionalAdditions":["1 cucharada de tahini tostado"]}],"chefTips":["La melaza de granada es el ingrediente mágico que no debes omitir; se encuentra en tiendas de alimentación árabe y dura meses en la despensa."],"robot":{"servings":6,"factor":1,"note":"El robot tuesta las nueces en el propio vaso.","ingredients":["3 unidades grandes (aprox 300g) · Pimientos rojos asados escurridos","120 g · Nueces peladas de buena calidad","40 g (aprox 1/2 taza) · Pan rallado o panko japonés","2 cucharadas soperas · Melaza de granada (Dibs el Remman)","15 ml (1 cda) · Zumo de limón fresco","1 diente · Diente de ajo pequeño","1 cucharadita · Comino molido","1 cucharadita · Chile de Alepo o pimentón dulce con pizca picante","50 ml · Aceite de oliva virgen extra","1 cucharadita rasa · Sal marina"],"steps":[{"stepNumber":1,"instruction":"Nueces: 5 min a 120 °C, velocidad 1, hasta que huelan a tostado. Deja enfriar 5 min."},{"stepNumber":2,"instruction":"Añade el pan rallado: 3 s a velocidad 6."},{"stepNumber":3,"instruction":"Añade pimientos, melaza, ajo, comino, chile, limón y sal: 20 s a velocidad 6, echando el aceite en hilo por la boca de la tapa."},{"stepNumber":4,"instruction":"Sirve con nueces enteras, melaza y aceite."}]}},{"id":"labneh-alinao-zaatar","title":"Labneh Aliñado con Za'atar y AOVE","subtitle":"El queso crema de yogur colado libanés bañado en aceite virgen extra","category":"untables","categoryLabel":"Untables (Hummus)","origin":"Líbano / Oriente Medio","originFlag":"🇱🇧","desc":"El tesoro lácteo de Oriente. Yogur natural colado durante 24 horas a través de gasa hasta que pierde todo el suero, convirtiéndose en un queso crema denso, sedoso y ligeramente ácido. Servido en pozo con aceite de oliva virgen extra y generoso za'atar silvestre.","prepTime":10,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegetariano","Sin gluten","Lácteo gourmet","Fácil"],"partyRole":"Queso crema fresco para untar en pan caliente crujiente","drinkPairing":"Té a la menta, limonada con azahar o vino blanco afrutado","ingredients":[{"id":"lb-1","name":"Yogur natural entero o griego","amount":800,"unit":"g","category":"lacteo"},{"id":"lb-2","name":"Sal marina fina","amount":1,"unit":"cucharadita","category":"especia"},{"id":"lb-3","name":"Mezcla de especias Za'atar (tomillo, sésamo, zumaque)","amount":2,"unit":"cucharadas colmadas","category":"especia"},{"id":"lb-4","name":"Aceite de oliva virgen extra de cosecha temprana","amount":60,"unit":"ml","category":"despensa"},{"id":"lb-5","name":"Aceitunas negras arrugadas y tomatitos cherry","amount":null,"unit":"para decorar","category":"verdura"}],"steps":[{"stepNumber":1,"instruction":"Mezcla el yogur con la cucharadita de sal en un bol.","tip":"Usa yogur entero de máxima calidad.","durationMinutes":2},{"stepNumber":2,"instruction":"Coloca un paño fino o gasa de quesería sobre un colador apoyado en un cuenco hondo. Vierte el yogur y ata las puntas del paño.","tip":"Deja reposar en la nevera entre 18 y 24 horas para que drene todo el suero líquido.","durationMinutes":5},{"stepNumber":3,"instruction":"Abre el paño: encontrarás una masa compacta, untuosa y cremosa como un queso de untar.","tip":"Dispón el labneh en un plato hondo con surcos con la cuchara.","durationMinutes":2},{"stepNumber":4,"instruction":"Inunda los surcos con un baño generoso de AOVE y espolvorea abundante za'atar por encima.","tip":"Sirve con aceitunas y pan pita recién sacado del horno.","durationMinutes":2}],"regionalVariants":[{"name":"Labneh en Bolitas en Aceite (Labneh Makbouseh)","region":"Montes del Líbano","description":"Se deja colar 48 horas hasta que esté muy duro, se forman bolitas con las manos y se conservan en tarros de cristal sumergidas en AOVE con hierbas.","optionalAdditions":["Dejar colar 48h y formar bolitas"]}],"chefTips":["Es el untable más versátil: sirve de desayuno, de tapa o de acompañamiento para :"Aceitunas, alcaparras, anchoas, ajo y hierbas: 3-4 golpes de turbo de 1 s."},{"stepNumber":2,"instruction":"Añade aceite y limón: 5 s a velocidad 3. Debe quedar con textura."}]}},{"id":"vehiculos-dipear-crudites","title":"Vehículos para Dipear & Crudités Gourmet","subtitle":"La estación crujiente de pitas tostadas, crudités y panes artesanos","category":"acompanamientos","categoryLabel":"Acompañamientos","origin":"Mediterráneo Internacional","originFlag":"🌍","desc":"El éxito de una mesa mezze depende tanto de los untables como de los vehículos elegidos para disfrutarlos. Esta estación combina texturas: pitas recién horneadas con especias, crujientes crudités vegetales tallados en bastones fríos y panes crujientes tradicionales.","prepTime":15,"cookTime":10,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Imprescindible","Fresco","Colorido","Básico"],"partyRole":"La estación central de soporte crujiente para todos los dips","drinkPairing":"Acompaña a cualquier bebida de la fiesta","ingredients":[{"id":"vd-1","name":"Panes de pita artesanos","amount":6,"unit":"unidades","category":"panaderia"},{"id":"vd-2","name":"Zanahorias dulces crujientes","amount":4,"unit":"unidades","category":"verdura"},{"id":"vd-3","name":"Pepinos medianos tiernos","amount":2,"unit":"unidades","category":"verdura"},{"id":"vd-4","name":"Ramas de apio tierno blanco","amount":3,"unit":"ramas","category":"verdura"},{"id":"vd-5","name":"Pimientos dulces variados (baby bell peppers)","amount":6,"unit":"unidades","category":"verdura"},{"id":"vd-6","name":"Regañás sevillanas y picos camperos con AOVE","amount":150,"unit":"g","category":"panaderia"},{"id":"vd-7","name":"Aceite de oliva virgen extra y pimentón para pincelar pita","amount":30,"unit":"ml","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Corta la mitad de los panes de pita en triángulos de bocado (como nachos). Pincélalos c a-rellenar","title":"Empanada para Rellenar (Formato Fiesta)","subtitle":"Masa fina dorada al horno cortada en cuadraditos de bocado","category":"acompanamientos","categoryLabel":"Acompañamientos","origin":"Galicia / España","originFlag":"🇪🇸","desc":"La reina indiscutible de cualquier fiesta española. Masa hojaldrada o quebrada crujiente rellena con tu pisto de pollo, zarangollo o titaina valenciana en frío. Se hornea con un baño de huevo que le otorga un brillo dorado irresistible y se corta en dados de cóctel.","prepTime":20,"cookTime":35,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Fiesta estrella","Para hacer antes","Dorado","Crujiente"],"partyRole":"Bocado de mano consistente que vuela de la mesa","drinkPairing":"Cerveza fría o vino blanco joven","ingredients":[{"id":"ef-1","name":"Láminas de masa de empanada fresca (redondas o rectangulares)","amount":2,"unit":"láminas","category":"panaderia"},{"id":"ef-2","name":"Relleno de tu elección (Tu Pisto con pollo, Titaina o Zarangollo)","amount":500,"unit":"g (bien escurrido y FRÍO)","category":"despensa"},{"id":"ef-3","name":"Huevo campero batido para pintar","amount":1,"unit":"unidad","category":"lacteo"},{"id":"ef-4","name":"Semillas de sésamo o amapola para decorar (opcional)","amount":1,"unit":"cucharada","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Precalienta el horno a 200°C con calor arriba y abajo. Extiende la primera lámina de masa sobre una bandeja de horno cubierta con papel vegetal.","tip":"Pincha toda la base de la masa con un tenedor para que no suba excesivamente durante la cocción.","durationMinutes":5},{"stepNumber":2,"instruction":"Extiende el relleno elegido (debe estar TOTALMENTE FRÍO) de manera uniforme sobre la masa, dejando un margen libre de 2 cm en todo el borde.","tip":"Si pones el relleno caliente sobre la masa, la grasa fundirá la masa y no quedará crujiente.","durationMinutes":5},{"stepNumber":3,"instruction":"Cubre con la segunda lámina de masa. Dobla los bordes hacia dentro formando un cordón o repulgue firme sellando con los dedos o con un tenedor.","tip":"Haz un orificio pequeño en el centro (chimenea) para que escape el vapor y no reviente.","durationMinutes":5},{"stepNumber":4,"instruction":"Pinta toda la superficie con huevo batido y espolvorea sésamo. Hornea a 200°C durante 30-35 minutos hasta que esté intensamente dorada y crujiente.","tip":"Deja enfriar al menos 30 minutos antes de cortar con un cuchillo de sierra en cuadrados pequeños de cóctel.","durationMinutes":35}],"regionalVariants":[{"name":"Masa Casera con Aceite del Propio Sofrito","region":"Galicia Tradicional","description":"La auténtica masa gallega sustituye la mantequilla por 80ml del aceite colado del sofrito de la cebolla y pimiento, aportando un color ámbar y aroma fabuloso.","optionalAdditions":["Aceite colado del sofrito"]}],"chefTips":["Córtala en frío con tijeras de cocina o cuchillo de sierra para que los cortes salgan limpios y cuadrados sin desmoronar la empanada."],"robot":{"servings":8,"factor":1,"note":"El robot hace el relleno. Si quieres masa casera: 400 g de harina, 100 ml de aceite, 100 ml de vino blanco, 1 cucharadita de sal.","ingredients":["2 láminas · Láminas de masa de empanada fresca (redondas o rectangulares)","500 g (bien escurrido y FRÍO) · Relleno de tu elección (Tu Pisto con pollo, Titaina o Zarangollo)","1 unidad · Huevo campero batido para pintar","1 cucharada · Semillas de sésamo o amapola para decorar (opcional)"],"steps":[{"stepNumber":1,"instruction":"Masa casera opcional: harina, aceite, vino y sal: 20 s a velocidad 5 y 2 min en programa amasar. Reposa 30 min y estírala en dos láminas."},{"stepNumber":2,"instruction":"Relleno: prepara en el robot el pisto, la titaina o el zarangollo (pestaña Robot de cada receta) y déjalo enfriar del todo."},{"stepNumber":3,"instruction":"Monta, pinta con huevo y hornea a 200 °C 30-35 min."}]}},{"id":"empanaditas-fritas-maiz","title":"Empanaditas Fritas de Harina de Maíz","subtitle":"Crujientes por fuera y jugosas por dentro, ideales para rellenar de sofritos","category":"acompanamientos","categoryLabel":"Acompañamientos","origin":"Venezuela / Caribe","originFlag":"🇻🇪","desc":"El bocado caliente más adictivo de una fiesta. Masa fina y elástica de harina de maíz precocida, rellena de tus guisos jugosos favoritos (Asadillo, Zarangollo o pollo desmigado), sellada en media luna y frita hasta quedar con una costra dorada y crujiente.","prepTime":25,"cookTime":15,"difficulty":"Media","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Sin gluten","Crujiente","Picoteo caliente","Adicto"],"partyRole":"Pase de bocados calientes crujientes recién fritos","drinkPairing":"Cerveza rubia bien helada o cóctel de maracuyá","ingredients":[{"id":"em-1","name":"Harina de maíz blanco precocida (tipo Harina P.A.N.)","amount":300,"unit":"g","category":"despensa"},{"id":"em-2","name":"Agua tibia","amount":400,"unit":"ml","category":"despensa"},{"id":"em-3","name":"Sal fina","amount":1,"unit":"cucharadita","category":"especia"},{"id":"em-4","name":"Pizca de azúcar o papelón (toque secreto caribeño)","amount":0.5,"unit":"cucharadita","category":"despensa"},{"id":"em-5","name":"Relleno escurrido al gusto (Asadillo Manchego, Titaina o Pisto)","amount":300,"unit":"g","category":"despensa"},{"id":"em-6","name":"Aceite de girasol o maíz para freír","amount":300,"unit":"ml","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"En un bol amplio, vierte el agua tibia, la sal y la pizca de azúcar. Remueve para disolver.","tip":"Añade la harina de maíz en lluvia mientras mezclas con los dedos.","durationMinutes":3},{"stepNumber":2,"instruction":"Amasa durante 2-3 minutos hasta obtener una masa suave, elástica y homogénea que no se pegue a las manos ni se agriete. Deja reposar tapada 5 minutos.","tip":"Si notas la masa quebradiza, añade 1-2 cucharadas más de agua tibia.","durationMinutes":7},{"stepNumber":3,"instruction":"Coloca una bolsa de plástico limpia abierta sobre la mesa untada con una gota de aceite. Haz una bolita de masa del tamaño de una nuez grande. Aplástala con las manos o con un plato plano hasta formar un círculo fino de 2 mm.","tip":"El plástico es el secreto infalible para despegar la masa fina sin que se rompa.","durationMinutes":5},{"stepNumber":4,"instruction":"Pon una cucharadita colmada de relleno en el centro. Dobla el plástico sobre sí mismo formando una media luna. Presiona los bordes y recorta el sobrante con el borde de un cuenco o taza para que queden perfectas.","tip":"Asegúrate de que no quede aire atrapado dentro.","durationMinutes":8},{"stepNumber":5,"instruction":"Fríe en abundante aceite caliente a 180°C durante 3-4 minutos por lado hasta que estén infladas y bien doradas. Escurre en papel absorbente y sirve calientes.","tip":"¡Sírvelas recién hechas con el contraste crujiente del maíz!","durationMinutes":10}],"regionalVariants":[{"name":"Variante Empanada de Cazón o Pescado Guisado","region":"Isla de Margarita, Venezuela","description":"Rellenas de guiso de cazón o pescado blanco con ají dulce, pasas y sofrito criollo.","optionalAdditions":["Pescado blanco desmigado en sofrito dulce"]}],"chefTips":["Puedes rellenarlas, cerrarlas y mantenerlas tapadas en la nevera listas para freír justo en el momento en que lleguen tus invitados."],"robot":{"servings":6,"factor":1,"note":"El robot amasa la harina de maíz sin grumos. La fritura, en sartén.","ingredients":["300 g · Harina de maíz blanco precocida (tipo Harina P.A.N.)","400 ml · Agua tibia","1 cucharadita · Sal fina","0,5 cucharadita · Pizca de azúcar o papelón (toque secreto caribeño)","300 g · Relleno escurrido al gusto (Asadillo Manchego, Titaina o Pisto)","300 ml · Aceite de girasol o maíz para freír"],"steps":[{"stepNumber":1,"instruction":"Agua tibia, sal y azúcar: 5 s a velocidad 3."},{"stepNumber":2,"instruction":"Añade la harina de maíz: 1 min en programa amasar. Deja reposar 5 min."},{"stepNumber":3,"instruction":"Forma, rellena y fríe como en la receta original."}]}},{"id":"mini-arepas-viudas","title":"Mini Arepas Viudas de Maíz a la Plancha","subtitle":"Panecillos calientes de maíz tostado para abrir y rellenar en directo","category":"acompanamientos","categoryLabel":"Acompañamientos","origin":"Venezuela / Colombia","originFlag":"🇻🇪","desc":"El pan sin gluten por excelencia. Panecillos redondos dorados a la plancha con corteza tostada y corazón esponjoso y humeante. Se llaman \"viudas\" porque se sirven recién hechas en cestas calientes para que cada invitado las abra y las rellene a su antojo.","prepTime":15,"cookTime":15,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Sin gluten","Vegano","Recién hecho","Divertido"],"partyRole":"Estación de panecillos calientes para autoservicio","drinkPairing":"Cualquier cerveza o vino de la fiesta","ingredients":[{"id":"ar-1","name":"Harina de maíz precocida blanca o amarilla","amount":350,"unit":"g","category":"despensa"},{"id":"ar-2","name":"Agua tibia","amount":450,"unit":"ml","category":"despensa"},{"id":"ar-3","name":"Sal marina fina","amount":1,"unit":"cucharadita","category":"especia"},{"id":"ar-4","name":"Aceite de oliva para engrasar la sartén","amount":15,"unit":"ml","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"En un bol mezcla el agua tibia y la sal. Añade la harina de maíz progresivamente mezclando con una mano hasta que absorba todo el líquido.","tip":"Amasa 2 minutos hasta lograr una masa suave y moldeable como plastilina.","durationMinutes":5},{"stepNumber":2,"instruction":"Forma bolitas de masa de unos 40g (tamaño pelota de golf para formato mini fiesta). Aplástalas entre las palmas de las manos girándolas para crear discos de 1,5 cm de grosor.","tip":"Alisa los bordes con un dedo húmedo para evitar grietas al cocinarlas.","durationMinutes":5},{"stepNumber":3,"instruction":"Calienta una plancha o sartén gruesa con unas gotas de aceite. Cocina las mini arepas a fuego medio durante 5-6 minutos por lado hasta que formen una costra dorada.","tip":"Si golpeas suavemente el centro con un nudillo y suena hueco como un tambor, están en su punto perfecto.","durationMinutes":12},{"stepNumber":4,"instruction":"Sírvelas inmediatamente en una cesta de mimbre forrada con un paño de tela grueso para atrapar el vapor y conservarlas calientes.","tip":"Hazles un corte lateral con un cuchillo de sierra sin llegar al final para facilitar que los invitados las rellenen.","durationMinutes":2}],"regionalVariants":[{"name":"Arepitas con Queso Rallado en la Masa","region":"Los Llanos","description":"Se amasa con 100g de queso blanco costeño o feta rallado fino dentro de la masa antes de formar los discos.","optionalAdditions":["100g de queso blanco rallado en la masa"]}],"chefTips":["Si se enfrían, solo dales un golpe de calor en la tostadora o 4 minutos de horno antes de servir."],"robot":{"servings":6,"factor":1,"note":"El robot amasa. Las arepas se doran en sartén o plancha.","ingredients":["350 g · Harina de maíz precocida blanca o amarilla","450 ml · Agua tibia","1 cucharadita · Sal marina fina","15 ml · Aceite de oliva para engrasar la sartén"],"steps":[{"stepNumber":1,"instruction":"Agua tibia y sal: 5 s a velocidad 3."},{"stepNumber":2,"instruction":"Añade la harina de maíz: 1 min en programa amasar."},{"stepNumber":3,"instruction":"Forma bolitas de 40 g, aplánalas y dóralas en plancha 5-6 min por lado."}]}},{"id":"pan-pita-artesanal","title":"Pan de Pita Casero a la Sartén","subtitle":"Pitas esponjosas recién hinchadas con bolsillo interior hueco","category":"acompanamientos","categoryLabel":"Acompañamientos","origin":"Mediterráneo Oriental","originFlag":"🇬🇷","desc":"Hacer pan de pita casero a la sartén en casa es pura magia: en apenas dos minutos sobre el hierro caliente, la masa se infla como un globo aerostático, creando un bolsillo interior vaporoso y suave listo para rellenar de sofritos o untar en los hummus.","prepTime":25,"cookTime":15,"difficulty":"Media","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Pan casero","Vegano","Recién hecho","Impresionante"],"partyRole":"El pan supremo para rebañar todas las salsas del banquete","drinkPairing":"Ideal con cualquier plato del recetario","ingredients":[{"id":"pp-1","name":"Harina de trigo de fuerza o panadera","amount":400,"unit":"g","category":"panaderia"},{"id":"pp-2","name":"Agua tibia (a unos 35°C)","amount":250,"unit":"ml","category":"despensa"},{"id":"pp-3","name":"Levadura seca de panadero (o 15g fresca)","amount":5,"unit":"g (1 sobre)","category":"despensa"},{"id":"pp-4","name":"Aceite de oliva virgen extra","amount":20,"unit":"ml","category":"despensa"},{"id":"pp-5","name":"Sal fina","amount":1,"unit":"cucharadita colmada","category":"especia"},{"id":"pp-6","name":"Azúcar o miel (para activar la levadura)","amount":1,"unit":"cucharadita","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"En un bol mezcla el agua tibia, la levadura y el azúcar. Deja reposar 5 minutos hasta que forme una ligera espumilla.","tip":"La espuma confirma que la levadura está viva y lista para levantar el pan.","durationMinutes":5},{"stepNumber":2,"instruction":"Añade la harina, la sal y el AOVE. Amasa durante 8 minutos hasta obtener una masa lisa, brillante y no pegajosa. Cubre con un paño húmedo y deja levar 1 hora en lugar cálido.","tip":"Debe doblar su volumen inicial.","durationMinutes":10},{"stepNumber":3,"instruction":"Divide la masa en 6-8 porciones iguales, haz bolitas y déjalas reposar 10 min. Estira cada bola con un rodillo sobre mesa enharinada formando círculos de unos 4 mm de grosor.","tip":"No las dejes ni demasiado finas ni demasiado gruesas para que puedan inflarse.","durationMinutes":10},{"stepNumber":4,"instruction":"Calienta una sartén de hierro o antiadherente a fuego medio-alto (muy caliente y seca). Coloca la pita: a los 30 segundos empezarán a salir burbujas. Dale la vuelta y cocina 1 minuto: ¡verás cómo se infla completamente como un globo! Vuelve a girar 30 segundos.","tip":"Apila las pitas recién hechas dentro de un trapo de cocina limpio cerrado para que con el propio vapor queden súper blandas y flexibles.","durationMinutes":10}],"regionalVariants":[{"name":"Pitas Integrales de Espelta","region":"Mediterráneo Moderno","description":"Sustituye la mitad de la harina por harina integral de espelta para un sabor más rústico y tostado.","optionalAdditions":["200g harina integral de espelta"]}],"chefTips":["El calor muy fuerte de la sartén es lo que convierte el agua interna en vapor instantáneo que infla el bolsillo de la pita."],"robot":{"servings":6,"factor":1,"note":"400 g de harina está dentro del máximo del Compact (500 g).","ingredients":["400 g · Harina de trigo de fuerza o panadera","250 ml · Agua tibia (a unos 35°C)","5 g (1 sobre) · Levadura seca de panadero (o 15g fresca)","20 ml · Aceite de oliva virgen extra","1 cucharadita colmada · Sal fina","1 cucharadita · Azúcar o miel (para activar la levadura)"],"steps":[{"stepNumber":1,"instruction":"Agua, levadura y azúcar: 1 min a 37 °C, velocidad 2."},{"stepNumber":2,"instruction":"Añade harina, sal y aceite: 20 s a velocidad 4 y luego 3 min en programa amasar."},{"stepNumber":3,"instruction":"Deja levar 1 h tapada en un bol. Divide, estira y cuece en sartén muy caliente."}]}},{"id":"focaccia-ligur-romero","title":"Focaccia Ligur Crujiente de Romero y Sal","subtitle":"Masa aireada con alvéolos de AOVE, romero fresco y escamas de sal marina","category":"acompanamientos","categoryLabel":"Acompañamientos","origin":"Liguria, Italia","originFlag":"🇮🇹","desc":"El pan festivo por antonomasia de Génova. Una masa con alta hidratación, crujiente y dorada por fuera gracias a la salmuera de aceite y agua, con un interior esponjoso y aireado cubierto de romero fresco aromático y escamas de sal Maldon.","prepTime":25,"cookTime":25,"difficulty":"Media","baseServings":8,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Pan de fiesta","Aromático","Crujiente"],"partyRole":"Acompañamiento estrella para mojar en caponata y sofritos","drinkPairing":"Vino blanco de Cinque Terre o cerveza italiana Moretti","ingredients":[{"id":"fc-1","name":"Harina de trigo de fuerza","amount":500,"unit":"g","category":"panaderia"},{"id":"fc-2","name":"Agua tibia","amount":380,"unit":"ml (alta hidratación)","category":"despensa"},{"id":"fc-3","name":"Levadura seca de panadería","amount":6,"unit":"g","category":"despensa"},{"id":"fc-4","name":"Aceite de oliva virgen extra de calidad","amount":80,"unit":"ml","category":"despensa"},{"id":"fc-5","name":"Sal marina fina","amount":10,"unit":"g","category":"especia"},{"id":"fc-6","name":"Ramitas de romero fresco silvestre","amount":3,"unit":"ramitas","category":"verdura"},{"id":"fc-7","name":"Sal en escamas (Maldon)","amount":1,"unit":"cucharada colmada","category":"especia"},{"id":"fc-8","name":"Salmuera (30ml agua + 30ml AOVE + 1 cdta sal)","amount":null,"unit":"para el baño final","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"En un bol mezcla la harina, el agua tibia, la levadura y 20ml de AOVE. Mezcla con cuchara o espátula (la masa será muy pegajosa e hidratada). Incorpora la sal fina y realiza pliegues de afuera hacia el centro durante 2 minutos.","tip":"No intentes amasar a mano sobre mesa seca; la alta hidratación crea los grandes alvéolos de la focaccia auténtica.","durationMinutes":10},{"stepNumber":2,"instruction":"Engrasa generosamente una bandeja de horno con AOVE. Vierte la masa, tápala y déjala fermentar durante 1 hora y media hasta que burbujee.","tip":"Extiende la masa con suavidad con las yemas de los dedos engrasadas hasta ocupar la bandeja.","durationMinutes":10},{"stepNumber":3,"instruction":"Vierte la salmuera (mezcla batida de agua tibia y AOVE) por encima. Con las yemas de los diez dedos, hunde firmemente la masa hasta el fondo de la bandeja creando los famosos hoyuelos ligures (fossette).","tip":"Verás burbujas de aire gigantes explotar en la masa: esa es la firma de una masa viva.","durationMinutes":5},{"stepNumber":4,"instruction":"Espolvorea las hojitas de romero fresco y abundante sal en escamas. Hornea a 220°C durante 20-25 minutos hasta que la superficie esté dorada y crujiente.","tip":"Pincela con un hilo de AOVE nada más sacarla del horno y córtala en barras o cuadrados.","durationMinutes":25}],"regionalVariants":[{"name":"Focaccia con Tomates Cherry y Aceitunas Negras","region":"Puglia (Focaccia Barese)","description":"Se introducen mitades de tomates cherry maduros y aceitunas negras arrugadas dentro de los hoyuelos antes de hornear.","optionalAdditions":["Tomatitos cherry partidos a la mitad","Aceitunas negras"]}],"chefTips":["Al enfriar, córtala en tiras rectangulares verticales para colocar en vasos al centro de la mesa."],"robot":{"servings":6,"factor":0.8,"note":"A 0,8 (400 g de harina) para no forzar el motor con una masa tan hidratada.","ingredients":["400 g · Harina de trigo de fuerza","305 ml (alta hidratación) · Agua tibia","5 g · Levadura seca de panadería","65 ml · Aceite de oliva virgen extra de calidad","8 g · Sal marina fina","2,5 ramitas · Ramitas de romero fresco silvestre","0,75 cucharada colmada · Sal en escamas (Maldon)","para el baño final · Salmuera (30ml agua + 30ml AOVE + 1 cdta sal)"],"steps":[{"stepNumber":1,"instruction":"Agua, levadura y 20 ml de aceite: 1 min a 37 °C, velocidad 2."},{"stepNumber":2,"instruction":"Añade harina y sal: 3 min en programa amasar. La masa será muy pegajosa."},{"stepNumber":3,"instruction":"Pásala a una bandeja bien engrasada y fermenta 1 h 30 min. Sigue con la salmuera, los hoyos y el horno como en la receta original."}]}},{"id":"tequenos-venezolanos-queso","title":"Tequeños Tradicionales de Queso Blanco","subtitle":"El pasapalo rey de toda fiesta venezolana: masa crujiente y queso fundente","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Los Teques, Venezuela","originFlag":"🇻🇪","desc":"El mandamiento gastronómico indiscutible: \"Fiesta sin tequeños no es fiesta\". Dedos de queso blanco semiduro y salado (tipo queso llanero o paisa) envueltos con precisión en una fina tira de masa hojaldrada a base de mantequilla y huevo. Se fríen al momento para lograr una corteza dorada y un interior elástico y fundente.","prepTime":35,"cookTime":10,"difficulty":"Media","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Pasapalo rey","Queso fundente","Fiesta venezolana","Crujiente"],"partyRole":"El bocado caliente número uno de bienvenida que vuela de la bandeja","drinkPairing":"Cerveza Polar helada, refresco Kolita o cóctel de ron añejo venezolano","ingredients":[{"id":"tq-1","name":"Harina de trigo de todo uso","amount":350,"unit":"g","category":"panaderia"},{"id":"tq-2","name":"Queso blanco duro o semiduro llanero (o queso latino de freír)","amount":400,"unit":"g cortado en bastones de 1x1x7 cm","category":"lacteo"},{"id":"tq-3","name":"Mantequilla sin sal derretida","amount":60,"unit":"g","category":"lacteo"},{"id":"tq-4","name":"Huevo campero mediano","amount":1,"unit":"unidad","category":"lacteo"},{"id":"tq-5","name":"Agua tibia con 1 cucharadita de sal y 1 de azúcar","amount":120,"unit":"ml","category":"despensa"},{"id":"tq-6","name":"Aceite de girasol para freír","amount":500,"unit":"ml","category":"despensa"},{"id":"tq-7","name":"Salsa tártara o salsa de ajo casera para mojar","amount":null,"unit":"para acompañar","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"En un bol amplio, coloca la harina tamizada con un volcán en el centro. Vi
