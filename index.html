s 60g (tamaño mediano de fiesta) y aplana en discos de 1,5 cm de grosor.","tip":"Si los bordes se agrietan, moja tus dedos con agua tibia y alísalos.","durationMinutes":8},{"stepNumber":2,"instruction":"Asa las arepas en sartén o plancha con un hilo de aceite a fuego medio durante 5-6 minutos por lado hasta que tengan costra tostada. Si quieres, termina 5 minutos al horno a 200°C para que se inflen y suenen huecas al tacto.","tip":"El horneado final crea una cáscara súper crujiente que contrasta con el relleno cremoso.","durationMinutes":12},{"stepNumber":3,"instruction":"Para el relleno: en un bol hondo, machaca 1 aguacate y medio con un tenedor dejando algunos tropezones. El medio aguacate restante córtalo en cubitos firmes.","tip":"Mezclar pulpa machacada con cubos enteros da una textura sublime.","durationMinutes":4},{"stepNumber":4,"instruction":"Añade el pollo desmechado, el ajo prensado, la cebolla picada, el cilantro, la mayonesa, el zumo de lima, sal y pimienta. Mezcla todo con suavidad hasta tener una crema verde untuosa y consistente.","tip":"Prueba y ajusta de sal y lima.","durationMinutes":4},{"stepNumber":5,"instruction":"Abre las arepas calientes por la mitad con cuchillo de sierra sin llegar al fondo. Unta una nuez de mantequilla dentro y rellena generosamente con la mezcla de Reina Pepiada.","tip":"Sírvelas templadas de inmediato.","durationMinutes":2}],"regionalVariants":[{"name":"Sifrina (Reina Pepiada con Queso Amarillo)","region":"Areperas de Caracas","description":"La misma base de reina pepiada coronada con una lluvia de queso gouda amarillo rallado en hebras gruesas.","optionalAdditions":["Queso amarillo gouda rallado"]}],"chefTips":["Prepara el relleno de pollo unas horas antes para que absorba todo el sabor, pero añade el aguacate fresco cerca de la hora de servir."],"robot":{"servings":6,"factor":1,"note":"El robot amasa la masa de arepas y cuece y desmecha el pollo.","ingredients":["350 g · Harina de maíz blanco precocida (Harina P.A.N.)","450 ml · Agua tibia con 1 cdta de sal","450 g · Pechuga de pollo cocida y desmechada en hebras finas","2 unidades · Aguacates Hass grandes maduros","0,5 unidad · Cebolla dulce o cebolleta finamente picada","1 diente · Diente de ajo prensado","3 cucharadas · Cilantro fresco picado finísimo","3 cucharadas colmadas · Mayonesa de buena calidad","20 ml · Zumo de lima fresca","1 cucharadita · Sal marina y pimienta negra molida","30 g · Mantequilla para untar las arepas calientes"],"steps":[{"stepNumber":1,"instruction":"Pollo: 500 ml de agua con sal en el vaso y la pechuga en el cestillo: 20 min a 100 °C, velocidad 4. Escurre."},{"stepNumber":2,"instruction":"Pollo cocido en trozos: 3-4 s a velocidad 4 (giro inverso) para desmecharlo. Reserva."},{"stepNumber":3,"instruction":"Vaso limpio: agua tibia con sal y harina de maíz, 1 min en programa amasar. Forma y asa las arepas en sartén."},{"stepNumber":4,"instruction":"Relleno: aguacate, cebolla, ajo, cilantro, mayonesa, lima, sal y pimienta: 5 s a velocidad 4. Añade el pollo y mezcla 10 s a velocidad 2 (giro inverso)."}]}},{"id":"arepa-pelua-carne-mechada","title":"Arepa Pelúa (Carne Mechada y Queso Amarillo)","subtitle":"Falda de ternera en sofrito criollo jugoso y lluvia de queso gouda","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Venezuela","originFlag":"🇻🇪","desc":"Bautizada como \"Pelúa\" por el aspecto desgreñado que le dan las hebras de carne mechada sobresaliendo junto a las virutas de queso amarillo derretido. La carne de ternera se cocina hasta deshilacharse en hilos finos y se guisa en un sofrito criollo de pimientos dulces, cebolla, ajo y comino.","prepTime":25,"cookTime":45,"difficulty":"Media","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Carne mechada","Queso fundido","Sin gluten","Contundente"],"partyRole":"Arepa caliente contundente y sabrosa para el momento cumbre","drinkPairing":"Cerveza tostada o copa de vino tinto joven","ingredients":[{"id":"ap-1","name":"Carne de ternera para mechar (falda o aleta)","amount":600,"unit":"g cocida y desmechada en hebras finas","category":"carne_pescado"},{"id":"ap-2","name":"Cebolla picada en brunoise fina","amount":1.5,"unit":"unidades","category":"verdura"},{"id":"ap-3","name":"Pimiento rojo y verde en cubitos pequeños","amount":1.5,"unit":"unidades","category":"verdura"},{"id":"ap-4","name":"Tomates maduros triturados o rallados","amount":3,"unit":"unidades","category":"verdura"},{"id":"ap-5","name":"Dientes de ajo picados","amount":3,"unit":"dientes","category":"verdura"},{"id":"ap-6","name":"Comino molido y achiote u onoto en polvo","amount":1,"unit":"cucharadita de cada uno","category":"especia"},{"id":"ap-7","name":"Caldo de la cocción de la carne","amount":150,"unit":"ml","category":"despensa"},{"id":"ap-8","name":"Aceite de oliva o vegetal","amount":40,"unit":"ml","category":"despensa"},{"id":"ap-9","name":"Queso amarillo tipo Gouda o Edam rallado grueso","amount":200,"unit":"g","category":"lacteo"},{"id":"ap-10","name":"Masa de arepas asadas calientes","amount":6,"unit":"unidades recién hechas","category":"panaderia"}],"steps":[{"stepNumber":1,"instruction":"En una cazuela con aceite, sofríe la cebolla, los pimientos y el ajo con una pizca de sal a fuego medio durante 10 minutos hasta que estén bien pochados.","tip":"Añade el comino y el onoto/achiote para darle el tono dorado rojizo tradicional.","durationMinutes":10},{"stepNumber":2,"instruction":"Agrega el tomate triturado y cocina 8 minutos hasta que reduzca el agua. Vierte la carne mechada deshilachada y el caldo de carne.","tip":"Tapa y cocina a fuego bajo 15 minutos para que la carne se impregne del sofrito sin secarse.","durationMinutes":15},{"stepNumber":3,"instruction":"Abre las arepas calientes recién sacadas del budare o plancha. Unta mantequilla.","tip":"Rellena con una porción generosa de carne mechada humeante y cubre inmediatamente con abundante queso amarillo rallado.","durationMinutes":4},{"stepNumber":4,"instruction":"El calor de la carne derretirá parcialmente el queso gouda, creando hilos fundentes irresistibles al morder.","tip":"Sirve acompañada de guasacaca.","durationMinutes":2}],"regionalVariants":[{"name":"Arepa Catira (Pollo y Queso Amarillo)","region":"Variante popular","description":"Se sustituye la carne mechada de ternera por pollo desmechado guisado con sofrito.","optionalAdditions":["Pollo desmechado guisado"]}],"chefTips":["Cocina la carne el día anterior en olla express con sal, laurel y cebolla; fría se desmecha con los dedos con asombrosa facilidad."],"robot":{"servings":4,"factor":0.6,"note":"A 0,6 de cantidad cabe el guiso. Para desmechar la carne cocida: 3 s a velocidad 4 con giro inverso.","ingredients":["360 g cocida y desmechada en hebras finas · Carne de ternera para mechar (falda o aleta)","1 unidades · Cebolla picada en brunoise fina","1 unidades · Pimiento rojo y verde en cubitos pequeños","1,75 unidades · Tomates maduros triturados o rallados","1,75 dientes · Dientes de ajo picados","0,5 cucharadita de cada uno · Comino molido y achiote u onoto en polvo","90 ml · Caldo de la cocción de la carne","25 ml · Aceite de oliva o vegetal","120 g · Queso amarillo tipo Gouda o Edam rallado grueso","4 unidades recién hechas · Masa de arepas asadas calientes"],"steps":[{"stepNumber":1,"instruction":"Cebolla, pimientos y ajo en trozos: 4 s a velocidad 5. Añade el aceite: 10 min a 120 °C, velocidad 1."},{"stepNumber":2,"instruction":"Añade tomate, comino y achiote: 8 min a 110 °C, velocidad 1, sin cubilete."},{"stepNumber":3,"instruction":"Añade la carne mechada y el caldo: 10 min a 100 °C, velocidad 1 (giro inverso)."},{"stepNumber":4,"instruction":"Rellena las arepas calientes con la carne y el queso rallado."}]}},{"id":"guasacaca-criolla-aguacate","title":"Guasacaca Criolla Tradicional","subtitle":"La salsa reina de Venezuela: emulsión de aguacate, pimiento, hierbas y vinagre","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Venezuela","originFlag":"🇻🇪","desc":"El aderezo insignia que acompaña a toda carne a la brasa, arepa, empanada o tequeño. A diferencia del guacamole mexicano, la guasacaca lleva un golpe fresco de vinagre blanco, abundante pimiento verde, cilantro, perejil y ajo emulsionados con aceite de oliva virgen extra. Fresca, aromática y picante al gusto.","prepTime":12,"cookTime":0,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegano","Sin gluten","Salsa estrella","Rápido"],"partyRole":"Salsa viva indispensable en la mesa para aderezar tequeños y arepas","drinkPairing":"Combina con cualquier comida venezolana","ingredients":[{"id":"gc-1","name":"Aguacates maduros","amount":2,"unit":"unidades medianas","category":"verdura"},{"id":"gc-2","name":"Pimiento verde italiano limpio sin semillas","amount":1,"unit":"unidad troceada","category":"verdura"},{"id":"gc-3","name":"Cebolla blanca o dulce","amount":0.5,"unit":"unidad","category":"verdura"},{"id":"gc-4","name":"Dientes de ajo pelados","amount":2,"unit":"dientes","category":"verdura"},{"id":"gc-5","name":"Hojas frescas de cilantro limpio","amount":1,"unit":"taza colmada","category":"verdura"},{"id":"gc-6","name":"Hojas frescas de perejil limpio","amount":0.5,"unit":"taza","category":"verdura"},{"id":"gc-7","name":"Vinagre blanco o de manzana","amount":35,"unit":"ml","category":"despensa"},{"id":"gc-8","name":"Aceite de oliva virgen extra o vegetal","amount":80,"unit":"ml","category":"despensa"},{"id":"gc-9","name":"Sal marina y pimienta negra molida","amount":1,"unit":"cucharadita","category":"especia"},{"id":"gc-10","name":"Pizca de chile jalapeño o ají dulce (opcional)","amount":1,"unit":"unidad","category":"verdura"}],"steps":[{"stepNumber":1,"instruction":"En el vaso de la licuadora o procesador de alimentos, coloca el pimiento verde troceado, la cebolla, los dientes de ajo, el cilantro, el perejil, el vinagre y la sal.","tip":"Tritura unos segundos primero las verduras con el vinagre para crear la base líquida aromática.","durationMinutes":3},{"stepNumber":2,"instruction":"Añade la pulpa de los dos aguacates y tritura con pulsaciones cortas.","tip":"Si te gusta rústica, tritúrala poco; si te gusta tipo crema emulsionada para biberón, licúa a velocidad continua.","durationMinutes":3},{"stepNumber":3,"instruction":"Con el motor en marcha lenta, vierte el aceite de oliva en hilo continuo para emulsionar como una mayonesa vegetal sedosa.","tip":"Ajusta el punto de sal y vinagre: debe tener una acidez fresca vivaz.","durationMinutes":3},{"stepNumber":4,"instruction":"Vierte en un bol o salsera. Gracias al vinagre blanco, la guasacaca no se oscurece con tanta facilidad como el guacamole.","tip":"Conserva en frío tapada.","durationMinutes":3}],"regionalVariants":[{"name":"Guasacaca Picadita a Cuchillo","region":"Llanos venezolanos","description":"En lugar de licuada, todos los ingredientes se cortan a cuchillo en daditos milimétricos (parecido a un pebre o vinagreta espesa).","optionalAdditions":["Corte a cuchillo sin licuar"]}],"chefTips":["Tenla en la mesa junto a los tequeños calientes: el contraste del queso caliente y la guasacaca ácida y fría es sublime."],"robot":{"servings":6,"factor":1,"note":"Receta perfecta para el robot.","ingredients":["2 unidades medianas · Aguacates maduros","1 unidad troceada · Pimiento verde italiano limpio sin semillas","0,5 unidad · Cebolla blanca o dulce","2 dientes · Dientes de ajo pelados","1 taza colmada · Hojas frescas de cilantro limpio","0,5 taza · Hojas frescas de perejil limpio","35 ml · Vinagre blanco o de manzana","80 ml · Aceite de oliva virgen extra o vegetal","1 cucharadita · Sal marina y pimienta negra molida","1 unidad · Pizca de chile jalapeño o ají dulce (opcional)"],"steps":[{"stepNumber":1,"instruction":"Pimiento, cebolla, ajo, cilantro, perejil, vinagre y sal: 10 s a velocidad 7."},{"stepNumber":2,"instruction":"Añade el aguacate: 10 s a velocidad 5."},{"stepNumber":3,"instruction":"Con el motor a velocidad 4, echa el aceite en hilo por la boca de la tapa durante 30 s."}]}},{"id":"cachapas-maiz-queso-mano","title":"Cachapas de Maíz Tierno con Queso de Mano","subtitle":"Tortas dulces doradas de choclo fresco con mantequilla y queso fundido","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Región Central / Llanos, Venezuela","originFlag":"🇻🇪","desc":"Uno de los manjares más tiernos y añorados de la cocina venezolana. Tortas doradas y esponjosas de granos de maíz tierno (choclo o elote) recién molidos con un toque dulce de azúcar y sal marina, asadas en budare o sartén caliente, bañadas en mantequilla que se derrite y dobladas en media luna envolviendo una rueda gruesa de queso de mano o telita jugoso.","prepTime":20,"cookTime":15,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Maíz dulce","Vegetariano","Sin gluten opcional","Manjar"],"partyRole":"Pase dulce-salado templado para amantes del maíz","drinkPairing":"Papelón con limón fresco bien frío","ingredients":[{"id":"ch-1","name":"Granos de maíz tierno dulce (fresco o mazorcas desgranadas)","amount":500,"unit":"g","category":"verdura"},{"id":"ch-2","name":"Leche entera","amount":60,"unit":"ml","category":"lacteo"},{"id":"ch-3","name":"Huevo campero","amount":1,"unit":"unidad","category":"lacteo"},{"id":"ch-4","name":"Harina de maíz precocida o maicena (para dar consistencia)","amount":2,"unit":"cucharadas","category":"despensa"},{"id":"ch-5","name":"Azúcar blanco o papelón rallado","amount":3,"unit":"cucharadas","category":"despensa"},{"id":"ch-6","name":"Sal marina fina","amount":1,"unit":"cucharadita","category":"especia"},{"id":"ch-7","name":"Mantequilla para engrasar la sartén y untar generosamente","amount":50,"unit":"g","category":"lacteo"},{"id":"ch-8","name":"Ruedas de Queso de Mano o Queso Mozzarella fresco en rodajas gruesas","amount":300,"unit":"g","category":"lacteo"}],"steps":[{"stepNumber":1,"instruction":"En la licuadora o procesador de alimentos, añade los granos de maíz tierno, la leche, el huevo, el azúcar y la sal.","tip":"Tritura con pulsaciones para no convertirlo en agua: la textura debe conservar pequeños trocitos de granos de maíz perceptibles.","durationMinutes":4},{"stepNumber":2,"instruction":"Vierte la mezcla en un bol. Si está demasiado líquida (según la humedad del maíz), añade las 2 cucharadas de harina de maíz o maicena y remueve. Deja reposar 10 minutos para que espese.","tip":"La consistencia debe ser similar a la masa espesa de pancakes o tortitas.","durationMinutes":10},{"stepNumber":3,"instruction":"Calienta una sartén antiadherente o plancha a fuego medio-bajo y engrasa con mantequilla. Vierte un cucharón de masa y extiéndelo con el dorso del cucharón en círculo de 15 cm y 1 cm de grosor.","tip":"Cocina durante 3-4 minutos hasta que salgan agujeritos y la base esté dorada y firme.","durationMinutes":5},{"stepNumber":4,"instruction":"Dale la vuelta con cuidado con una espátula ancha y cocina 2-3 minutos por el otro lado. Unta inmediatamente con abundante mantequilla encima.","tip":"Coloca una rueda de queso de mano en una mitad y dobla la cachapa en media luna.","durationMinutes":4}],"regionalVariants":[{"name":"Cachapa con Cochino Frito","region":"Carreteras de Miranda y El Junquito","description":"Servida con dados de cerdo fritos crujientes (chicharrón de carne) junto al queso de mano.","optionalAdditions":["Dados de cochino frito crujiente"]}],"chefTips":["Si no consigues mazorcas tiernas, puedes usar maíz dulce congelado descongelado y bien escurrido."],"robot":{"servings":6,"factor":1,"note":"La masa se hace en el robot. Las cachapas se cuajan en sartén.","ingredients":["500 g · Granos de maíz tierno dulce (fresco o mazorcas desgranadas)","60 ml · Leche entera","1 unidad · Huevo campero","2 cucharadas · Harina de maíz precocida o maicena (para dar consistencia)","3 cucharadas · Azúcar blanco o papelón rallado","1 cucharadita · Sal marina fina","50 g · Mantequilla para engrasar la sartén y untar generosamente","300 g · Ruedas de Queso de Mano o Queso Mozzarella fresco en rodajas gruesas"],"steps":[{"stepNumber":1,"instruction":"Maíz, leche, huevo, azúcar y sal: 30 s a velocidad 6. Debe quedar con algo de textura."},{"stepNumber":2,"instruction":"Si está muy líquida, añade la harina de maíz: 5 s a velocidad 3. Reposa 10 min."},{"stepNumber":3,"instruction":"Cocina en sartén con mantequilla como en la receta original y rellena con el queso."}]}},{"id":"mandocas-zulianas-anis","title":"Mandocas Zulianas con Queso y Papelón","subtitle":"Rosquillas de harina de maíz, plátano maduro, panela y anís dulce","category":"venezolana","categoryLabel":"Comida Venezolana","origin":"Estado Zulia, Venezuela","originFlag":"🇻🇪","desc":"Especialidad entrañable del estado Zulia. Rosquillas en forma de lazo o gota alargada hechas amasando harina de maíz con puré de plátano macho maduro, papelón disuelto, queso blanco rallado y semillas de anís dulce. Fritas hasta quedar doradas y caramelizadas por fuera y tiernas por dentro, servidas con queso blanco rallado que contrasta con el dulzor.","prepTime":20,"cookTime":15,"difficulty":"Fácil","baseServings":6,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Dulce y salado","Zuliano","Plátano macho","Tradicional"],"partyRole":"Bocado festivo dulce-salado para picoteo o merienda de fiesta","drinkPairing":"Café con leche o chocolate caliente especiado","ingredients":[{"id":"md-1","name":"Harina de maíz precocida amarilla o blanca","amount":300,"unit":"g","category":"despensa"},{"id":"md-2","name":"Plátano macho muy maduro (piel negra)","amount":1,"unit":"unidad grande hervida","category":"verdura"},{"id":"md-3","name":"Papelón (panela) disuelto en agua tibia","amount":100,"unit":"g en 250ml de agua","category":"despensa"},{"id":"md-4","name":"Queso blanco duro rallado fino","amount":120,"unit":"g","category":"lacteo"},{"id":"md-5","name":"Semillas de anís dulce entero","amount":1,"unit":"cucharadita","category":"especia"},{"id":"md-6","name":"Sal fina","amount":0.5,"unit":"cucharadita","category":"especia"},{"id":"md-7","name":"Aceite para freír","amount":400,"unit":"ml","category":"despensa"},{"id":"md-8","name":"Queso blanco llanero rallado para coronar al servir","amount":100,"unit":"g","category":"lacteo"}],"steps":[{"stepNumber":1,"instruction":"Cuece el plátano macho maduro en agua con sal hasta que esté bien tierno. Pélalo y haz un puré fino con el tenedor.","tip":"Cuanto más madura esté la piel del plátano (casi negra), más dulces y aromáticas quedarán las mandocas.","durationMinutes":10},{"stepNumber":2,"instruction":"En un bol amplio, mezcla el puré de plátano con la harina de maíz, las semillas de anís, la sal y la mitad del queso rallado. Ve agregando el agua de papelón tibia poco a poco mientras amasas.","tip":"Amasa hasta lograr una textura maleable similar a plastilina que no se pegue.","durationMinutes":5},{"stepNumber":3,"instruction":"Toma porciones de masa, haz cilindros o cordones con las palmas de las manos de 15 cm de largo y 1,5 cm de grosor. Junta los extremos formando una gota o herradura.","tip":"Presiona la unión para que no se abra en el aceite.","durationMinutes":8},{"stepNumber":4,"instruction":"Fríe en aceite caliente a 180°C durante 2-3 minutos por lado hasta que estén de un color caoba brillante y crujiente. Escurre sobre papel.","tip":"Sírvelas calientes coronadas con una generosa montaña de queso blanco rallado.","durationMinutes":8}],"regionalVariants":[{"name":"Mandocas con Clavo de Olor","region":"Costa Oriental del Lago","description":"El agua de papelón se aromatiza hirviéndola con 2 clavos de olor y canela en rama.","optionalAdditions":["Canela y clavo de olor en el papelón"]}],"chefTips":["El contraste entre el plátano dulce caramelizado y el queso blanco salado es una experiencia sensorial única."],"robot":{"servings":6,"factor":1,"note":"El robot cuece el plátano y amasa. La fritura, en sartén.","ingredients":["300 g · Harina de maíz precocida amarilla o blanca","1 unidad grande hervida · Plátano macho muy maduro (piel negra)","100 g en 250ml de agua · Papelón (panela) disuelto en agua tibia","120 g · Queso blanco duro rallado fino","1 cucharadita · Semillas de anís dulce entero","0,5 cucharadita · Sal fina","400 ml · Aceite para freír","100 g · Queso blanco llanero rallado para coronar al servir"],"steps":[{"stepNumber":1,"instruction":"Plátano en trozos en el cestillo con 500 ml de agua y sal en el vaso: 20 min a 100 °C, velocidad 4. Vacía el vaso."},{"stepNumber":2,"instruction":"Plátano pelado: 10 s a velocidad 5. Añade la harina de maíz, el anís, la sal y la mitad del queso."},{"stepNumber":3,"instruction":"Añade el agua de papelón tibia: 1 min en programa amasar."},{"stepNumber":4,"instruction":"Forma las herraduras y fríe a 180 °C."}]}}],ne=[{"id":"bizcocho-yogur-abuela-clasico","title":"Bizcocho Clásico de Yogur de la Abuela (Regla 1-2-3)","subtitle":"El bizcocho infalible más esponjoso con ralladura de limón y costra de azúcar","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"España","originFlag":"🇪🇸","desc":"El rey indiscutible de las meriendas familiares. La receta de oro donde el vasito del yogur sirve de medidor universal: 1 medida de aceite, 2 de azúcar y 3 de harina, aromatizado con ralladura de limón fresco de huerta y coronado con una capa de azúcar que forma una costra crujiente dorada en el horno.","prepTime":15,"cookTime":35,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Clásico de oro","Esponjoso","Fácil","Desayuno y fiesta"],"partyRole":"El bizcocho casero tradicional para la mesa de café y postres","drinkPairing":"Café con leche, infusión de rooibos o copa de vino dulce moscatel","ingredients":[{"id":"by-1","name":"Yogur natural o de limón (125g)","amount":1,"unit":"vasito (125g)","category":"lacteo"},{"id":"by-2","name":"Huevos camperos a temperatura ambiente","amount":3,"unit":"unidades (talla L)","category":"lacteo"},{"id":"by-3","name":"Aceite de girasol o de oliva suave","amount":1,"unit":"medida del vasito (100ml)","category":"despensa"},{"id":"by-4","name":"Azúcar blanco","amount":2,"unit":"medidas del vasito (200g)","category":"despensa"},{"id":"by-5","name":"Harina de trigo de repostería","amount":3,"unit":"medidas del vasito (240g)","category":"panaderia"},{"id":"by-6","name":"Levadura química en polvo (tipo Royal)","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"by-7","name":"Limón fresco (solo la ralladura sin la parte blanca)","amount":1,"unit":"limón","category":"verdura"},{"id":"by-8","name":"Pizca de sal fina","amount":1,"unit":"pizca","category":"especia"},{"id":"by-9","name":"Azúcar extra para espolvorear la superficie antes de hornear","amount":2,"unit":"cucharadas","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Precalienta el horno a 180°C con calor arriba y abajo. Engrasa un molde redondo de 22 cm con mantequilla y espolvorea harina (o fórralo con papel de horno).","tip":"Tener el molde listo y el horno a temperatura exacta evita que la masa espere y pierda gas.","durationMinutes":5},{"stepNumber":2,"instruction":"En un bol amplio, bate los 3 huevos con el azúcar durante 4-5 minutos con varillas eléctricas hasta que blanqueen, doblen su volumen y queden espumosos.","tip":"El batido prolongado de huevos con azúcar es el secreto para un bizcocho que sube recto y esponjoso.","durationMinutes":5},{"stepNumber":3,"instruction":"Añade el yogur, el aceite y la ralladura fina del limón. Bate a velocidad baja durante 1 minuto solo hasta integrar.","tip":"No batas de más en este paso para no expulsar el aire atrapado.","durationMinutes":2},{"stepNumber":4,"instruction":"Tamiza la harina con la levadura y la pizca de sal. Incorpórala al bol en dos tandas mezclando con espátula con movimientos envolventes de abajo hacia arriba.","tip":"Los movimientos envolventes mantienen la masa aireada.","durationMinutes":3},{"stepNumber":5,"instruction":"Vierte la masa en el molde. Espolvorea 2 cucharadas de azúcar por toda la superficie para crear la famosa costra crujiente. Hornea a 180°C durante 35-40 minutos.","tip":"¡No abras el horno durante los primeros 25 minutos! Comprueba con un palillo en el centro: si sale limpio y seco, está perfecto. Deja templar 10 min antes de desmoldar sobre rejilla.","durationMinutes":40}],"regionalVariants":[{"name":"Bizcocho de Yogur con Canela y Manzana en Dados","region":"Castilla y León","description":"Se añade 1 cucharadita de canela a la masa y dados pequeños de manzana reineta rebozados en harina para que no se hundan al fondo.","optionalAdditions":["Manzana en dados","Canela molida"]}],"chefTips":["Usa los huevos a temperatura ambiente: montan mucho más rápido y atrapan el doble de microburbujas."],"robot":{"servings":8,"factor":1,"note":"El robot monta y mezcla con la mariposa. Se hornea igual.","ingredients":["1 vasito (125g) · Yogur natural o de limón (125g)","3 unidades (talla L) · Huevos camperos a temperatura ambiente","1 medida del vasito (100ml) · Aceite de girasol o de oliva suave","2 medidas del vasito (200g) · Azúcar blanco","3 medidas del vasito (240g) · Harina de trigo de repostería","1 sobre (16g) · Levadura química en polvo (tipo Royal)","1 limón · Limón fresco (solo la ralladura sin la parte blanca)","1 pizca · Pizca de sal fina","2 cucharadas · Azúcar extra para espolvorear la superficie antes de hornear"],"steps":[{"stepNumber":1,"instruction":"Precalienta el horno a 180 °C. Azúcar y ralladura: 10 s a velocidad 10."},{"stepNumber":2,"instruction":"Coloca la mariposa. Añade los huevos: 4 min a 37 °C, velocidad 4, hasta que blanqueen."},{"stepNumber":3,"instruction":"Añade yogur y aceite: 20 s a velocidad 3. Quita la mariposa."},{"stepNumber":4,"instruction":"Añade harina, levadura y sal: 10 s a velocidad 3, terminando con espátula."},{"stepNumber":5,"instruction":"Molde, azúcar por encima y horno a 180 °C 35-40 min."}]}},{"id":"bizcocho-chocolate-intenso-pepitas","title":"Bizcocho de Chocolate Intenso con Pepitas Fundentes","subtitle":"Masa húmeda de cacao puro 100% con corazones de chocolate fundido","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Repostería Creativa","originFlag":"🍫","desc":"La perdición absoluta de los amantes del chocolate. Una miga húmeda, oscura y sedosa con cacao puro desgrasado, yogur griego para mantener la ternura y una generosa lluvia de pepitas de chocolate negro al 70% que se derriten creando bolsas cremosas al cortar cada porción.","prepTime":20,"cookTime":40,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Chocolate lovers","Miga húmeda","Gourmet","Irresistible"],"partyRole":"El centro dulce más deseado de la mesa de postres","drinkPairing":"Vaso de leche fría, café expreso o licor de avellana","ingredients":[{"id":"bc-1","name":"Harina de trigo de repostería","amount":200,"unit":"g","category":"panaderia"},{"id":"bc-2","name":"Cacao puro en polvo desgrasado 100% (tipo Valor)","amount":60,"unit":"g","category":"despensa"},{"id":"bc-3","name":"Pepitas o gotas de chocolate negro al 70%","amount":150,"unit":"g","category":"despensa"},{"id":"bc-4","name":"Huevos medianos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bc-5","name":"Azúcar moreno o panela","amount":180,"unit":"g","category":"despensa"},{"id":"bc-6","name":"Yogur griego natural sin azúcar","amount":125,"unit":"g","category":"lacteo"},{"id":"bc-7","name":"Aceite de girasol","amount":100,"unit":"ml","category":"despensa"},{"id":"bc-8","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bc-9","name":"Extracto natural de vainilla","amount":1,"unit":"cucharadita","category":"especia"},{"id":"bc-10","name":"Pizca de sal marina","amount":0.5,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Precalienta el horno a 175°C. Forra un molde tipo plum cake o redondo de 22 cm con papel sulfurizado.","tip":"Mezcla las pepitas de chocolate con 1 cucharada de harina para que no se vayan al fondo del molde al hornear.","durationMinutes":5},{"stepNumber":2,"instruction":"Bate los huevos con el azúcar moreno y la vainilla durante 4 minutos hasta tener una crema espesa.","tip":"El azúcar moreno aporta humedad y notas acarameladas al chocolate.","durationMinutes":4},{"stepNumber":3,"instruction":"Añade el yogur griego y el aceite batiendo suavemente. Tamiza encima la harina, el cacao en polvo, la levadura y la pizca de sal.","tip":"Tamizar el cacao es vital porque suele formar bolitas compactas.","durationMinutes":4},{"stepNumber":4,"instruction":"Integra con espátula de goma e incorpora dos tercios de las pepitas de chocolate enharinadas a la masa.","tip":"Vierte en el molde y reparte el resto de pepitas por encima para que queden visibles en la corteza.","durationMinutes":3},{"stepNumber":5,"instruction":"Hornea a 175°C durante 38-42 minutos. Pincha con brocheta de madera: debe salir sin masa líquida pero con alguna miga húmeda de chocolate fundido.","tip":"Deja enfriar sobre rejilla antes de desmoldar.","durationMinutes":40}],"regionalVariants":[{"name":"Bizcocho de Chocolate con Naranja Confitada","region":"Valencia","description":"Se añaden dados de naranja confitada y ralladura de naranja que armonizan con el chocolate negro de manera celestial.","optionalAdditions":["Dados de naranja confitada","Ralladura de naranja"]}],"chefTips":["Si lo calientas 15 segundos en el microondas antes de comer, las pepitas volverán a fundirse como lava líquida."],"robot":{"servings":8,"factor":1,"note":"El robot hace la masa. Las pepitas se añaden con espátula.","ingredients":["200 g · Harina de trigo de repostería","60 g · Cacao puro en polvo desgrasado 100% (tipo Valor)","150 g · Pepitas o gotas de chocolate negro al 70%","3 unidades · Huevos medianos camperos","180 g · Azúcar moreno o panela","125 g · Yogur griego natural sin azúcar","100 ml · Aceite de girasol","1 sobre (16g) · Levadura química en polvo","1 cucharadita · Extracto natural de vainilla","0,5 cucharadita · Pizca de sal marina"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 175 °C. Con la mariposa: huevos, azúcar y vainilla, 4 min a 37 °C, velocidad 4."},{"stepNumber":2,"instruction":"Añade yogur y aceite: 20 s a velocidad 3. Quita la mariposa."},{"stepNumber":3,"instruction":"Añade harina, cacao, levadura y sal: 10 s a velocidad 3."},{"stepNumber":4,"instruction":"Mezcla dos tercios de las pepitas con espátula, molde y horno a 175 °C 38-42 min."}]}},{"id":"bizcocho-naranja-entera-glaseado","title":"Bizcocho de Naranja Entera con Glaseado Cítrico","subtitle":"Naranja entera triturada con su cáscara limpia para una jugosidad extrema","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Comunidad Valenciana, España","originFlag":"🍊","desc":"La revelación cítrica de la repostería mediterránea. No lleva solo zumo: se tritura la naranja entera con su piel (bien lavada) junto a los huevos y el azúcar, lo que confiere una humedad densa, un color anaranjado deslumbrante y una fragancia que inunda toda la casa mientras se hornea. Terminado con un baño de glaseado translúcido de naranja.","prepTime":20,"cookTime":40,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Cítrico aromático","Ultra jugoso","Fruta entera","Elegante"],"partyRole":"Bizcocho aromático y fresco ideal para media tarde","drinkPairing":"Té negro Earl Grey o cava brut bien frío","ingredients":[{"id":"bn-1","name":"Naranja de mesa madura entera con piel fina","amount":1,"unit":"unidad grande (aprox 250g)","category":"verdura"},{"id":"bn-2","name":"Huevos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bn-3","name":"Azúcar blanco","amount":220,"unit":"g","category":"despensa"},{"id":"bn-4","name":"Aceite de girasol o AOVE arbequina suave","amount":100,"unit":"ml","category":"despensa"},{"id":"bn-5","name":"Yogur natural sin azúcar","amount":1,"unit":"vasito (125g)","category":"lacteo"},{"id":"bn-6","name":"Harina de trigo de repostería","amount":250,"unit":"g","category":"panaderia"},{"id":"bn-7","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bn-8","name":"Azúcar glas y zumo de naranja para el glaseado final","amount":100,"unit":"g azúcar + 2 cdas zumo","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Lava muy bien la naranja frotando la cáscara bajo el grifo. Córtala en trozos con piel, retirando las pepitas y la parte blanca central gruesa.","tip":"Usa naranjas de piel fina y sin tratar químicamente para un sabor puro sin amargor.","durationMinutes":5},{"stepNumber":2,"instruction":"En un vaso de batidora o robot de cocina, coloca los trozos de naranja con piel, los 3 huevos y el azúcar. Tritura a máxima potencia durante 2 minutos hasta conseguir una crema naranja densa, homogénea y espumosa.","tip":"La piel se pulveriza liberando los aceites esenciales de la corteza.","durationMinutes":3},{"stepNumber":3,"instruction":"Vierte la mezcla en un bol. Añade el aceite y el yogur y mezcla con varilla de mano.","tip":"Tamiza la harina con la levadura química e integra con movimientos suaves.","durationMinutes":4},{"stepNumber":4,"instruction":"Vierte en un molde engrasado y hornea a 180°C durante 40-45 minutos hasta que al pinchar con un palillo salga limpio.","tip":"Deja templar 10 minutos y desmolda sobre rejilla.","durationMinutes":42},{"stepNumber":5,"instruction":"Para el glaseado: mezcla en un cuenco el azúcar glas con 2 cucharadas de zumo de naranja hasta tener una textura de jarabe espeso. Vierte sobre el bizcocho tibio dejando que caiga por los laterales.","tip":"Al secarse formará una capa crujiente y translúcida irresistible.","durationMinutes":3}],"regionalVariants":[{"name":"Bizcocho de Mandarinas de Castellón","region":"Comarca de la Plana","description":"Se sustituye la naranja por 3 mandarinas enteras sin pepitas, resultando en un aroma aún más dulce y floral.","optionalAdditions":["3 mandarinas en lugar de naranja"]}],"chefTips":["Gana jugosidad al día siguiente: envuélvelo en papel de aluminio y estará aún más tierno y húmedo."],"robot":{"servings":8,"factor":1,"note":"El robot tritura la naranja con piel mejor que una batidora.","ingredients":["1 unidad grande (aprox 250g) · Naranja de mesa madura entera con piel fina","3 unidades · Huevos camperos","220 g · Azúcar blanco","100 ml · Aceite de girasol o AOVE arbequina suave","1 vasito (125g) · Yogur natural sin azúcar","250 g · Harina de trigo de repostería","1 sobre (16g) · Levadura química en polvo","100 g azúcar + 2 cdas zumo · Azúcar glas y zumo de naranja para el glaseado final"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 180 °C. Naranja en trozos, huevos y azúcar: 1 min a velocidad 10."},{"stepNumber":2,"instruction":"Añade aceite y yogur: 20 s a velocidad 4."},{"stepNumber":3,"instruction":"Añade harina y levadura: 10 s a velocidad 3."},{"stepNumber":4,"instruction":"Hornea a 180 °C 40-45 min."},{"stepNumber":5,"instruction":"Glaseado: azúcar glas y zumo, 10 s a velocidad 3. Viértelo sobre el bizcocho tibio."}]}},{"id":"bizcocho-zanahoria-nueces-especias","title":"Bizcocho de Zanahoria, Nueces y Especias (Carrot Cake)","subtitle":"Miga especiada con canela de Ceilán, jengibre, nueces crujientes y frosting opcional","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Internacional / Anglo-americano","originFlag":"🥕","desc":"Un clásico universal que nunca defrauda. La zanahoria finamente rallada aporta una humedad profunda y natural que mantiene el bizcocho tierno durante días, combinada con el calor reconfortante de la canela, la nuez moscada, el jengibre y el crujido mantecoso de las nueces tostadas.","prepTime":25,"cookTime":45,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Zanahoria jugosa","Especias cálidas","Nueces","Favorito"],"partyRole":"Bizcocho sofisticado para celebraciones y meriendas de fiesta","drinkPairing":"Té Chai especiado con leche o café con hielo","ingredients":[{"id":"bz-1","name":"Zanahorias frescas ralladas finas","amount":300,"unit":"g (aprox 3-4 unidades)","category":"verdura"},{"id":"bz-2","name":"Harina de trigo de repostería","amount":240,"unit":"g","category":"panaderia"},{"id":"bz-3","name":"Huevos camperos","amount":4,"unit":"unidades","category":"lacteo"},{"id":"bz-4","name":"Azúcar moreno o panela","amount":180,"unit":"g","category":"despensa"},{"id":"bz-5","name":"Aceite de girasol","amount":150,"unit":"ml","category":"despensa"},{"id":"bz-6","name":"Nueces peladas troceadas gruesas","amount":80,"unit":"g","category":"despensa"},{"id":"bz-7","name":"Canela molida de Ceilán","amount":1.5,"unit":"cucharadita","category":"especia"},{"id":"bz-8","name":"Jengibre molido y nuez moscada","amount":0.5,"unit":"cucharadita de cada uno","category":"especia"},{"id":"bz-9","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bz-10","name":"Bicarbonato de sodio","amount":0.5,"unit":"cucharadita","category":"despensa"},{"id":"bz-11","name":"Pizca de sal fina","amount":0.5,"unit":"cucharadita","category":"especia"},{"id":"bz-12","name":"Frosting de queso crema (opcional para decorar)","amount":150,"unit":"g queso crema + 50g mantequilla + 60g azúcar glas","category":"lacteo"}],"steps":[{"stepNumber":1,"instruction":"Pela y ralla las zanahorias por la parte fina del rallador. Tuesta las nueces picadas 4 minutos en sartén seca para despertar sus aceites.","tip":"Rallar fino permite que la zanahoria se funda con la masa creando una miga jugosísima sin hebras duras.","durationMinutes":10},{"stepNumber":2,"instruction":"En un bol grande bate los 4 huevos con el azúcar moreno durante 4 minutos hasta tener una mezcla cremosa y aireada. Vierte el aceite en hilo mientras sigues batiendo suavemente.","tip":"El aceite garantiza que el bizcocho permanezca blando incluso refrigerado.","durationMinutes":4},{"stepNumber":3,"instruction":"Tamiza la harina con la levadura, el bicarbonato, la canela, el jengibre, la nuez moscada y la sal. Añádelos al bol con movimientos envolventes.","tip":"Incorpora la zanahoria rallada y las nueces tostadas integrando todo.","durationMinutes":4},{"stepNumber":4,"instruction":"Vierte la masa en un molde de 22 cm forrado con papel de hornear. Hornea a 175°C durante 45-50 minutos.","tip":"Comprueba con brocheta en el centro: debe salir seca. Deja enfriar totalmente sobre rejilla.","durationMinutes":50},{"stepNumber":5,"instruction":"Si deseas coronarlo con frosting: bate el queso crema con la mantequilla a temperatura ambiente y el azúcar glas hasta lograr una crema suave. Extiéndela sobre el bizcocho frío con espátula.","tip":"Decora con medias nueces tostadas por encima.","durationMinutes":5}],"regionalVariants":[{"name":"Carrot Cake con Pasas Sultanas al Ron","region":"Versión clásica británica","description":"Se añaden 60g de uvas pasas hidratadas en ron añejo caliente escurridas dentro de la masa.","optionalAdditions":["Pasas maceradas en ron"]}],"chefTips":["El bicarbonato reacciona con la acidez de la zanahoria y el azúcar moreno, dando ese tono dorado tostado tan apetecible."],"robot":{"servings":8,"factor":1,"note":"El robot ralla la zanahoria y pica las nueces.","ingredients":["300 g (aprox 3-4 unidades) · Zanahorias frescas ralladas finas","240 g · Harina de trigo de repostería","4 unidades · Huevos camperos","180 g · Azúcar moreno o panela","150 ml · Aceite de girasol","80 g · Nueces peladas troceadas gruesas","1,5 cucharadita · Canela molida de Ceilán","0,5 cucharadita de cada uno · Jengibre molido y nuez moscada","1 sobre (16g) · Levadura química en polvo","0,5 cucharadita · Bicarbonato de sodio","0,5 cucharadita · Pizca de sal fina","150 g queso crema + 50g mantequilla + 60g azúcar glas · Frosting de queso crema (opcional para decorar)"],"steps":[{"stepNumber":1,"instruction":"Nueces: 3 s a velocidad 5. Reserva. Zanahorias en trozos: 6 s a velocidad 5. Reserva."},{"stepNumber":2,"instruction":"Con la mariposa: huevos y azúcar moreno, 4 min a 37 °C, velocidad 4. Añade el aceite en hilo a velocidad 3. Quita la mariposa."},{"stepNumber":3,"instruction":"Añade harina, levadura, bicarbonato, especias y sal: 10 s a velocidad 3. Añade zanahoria y nueces: 10 s a velocidad 2 (giro inverso)."},{"stepNumber":4,"instruction":"Hornea a 175 °C 45-50 min."},{"stepNumber":5,"instruction":"Frosting: queso crema, mantequilla y azúcar glas, 20 s a velocidad 4."}]}},{"id":"bizcocho-marmolado-vainilla-cacao","title":"Bizcocho Marmolado de Vainilla y Cacao Puro","subtitle":"El clásico dibujo en espiral entrelazando dos masas contrastadas","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Centroeuropa / Alemania (Marmorkuchen)","originFlag":"🇩🇪","desc":"Un deleite tanto visual como gustativo. Una misma masa sedosa de mantequilla y vainilla dividida en dos: una mitad se aromatiza con vainilla de Madagascar y la otra con cacao puro holandés. Al verterlas alternadas en el molde y dibujar una espiral con brocheta, cada rebanada revela un dibujo marmolado único.","prepTime":20,"cookTime":40,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Doble sabor","Visual","Mantequilla","Clásico"],"partyRole":"Bizcocho vistoso para cortar en rebanadas perfectas de cóctel","drinkPairing":"Capuchino espumoso, chocolate caliente o vaso de leche","ingredients":[{"id":"bm-1","name":"Mantequilla a temperatura ambiente (en pomada)","amount":150,"unit":"g","category":"lacteo"},{"id":"bm-2","name":"Azúcar blanco","amount":180,"unit":"g","category":"despensa"},{"id":"bm-3","name":"Huevos medianos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bm-4","name":"Harina de trigo de repostería","amount":260,"unit":"g","category":"panaderia"},{"id":"bm-5","name":"Leche entera","amount":100,"unit":"ml","category":"lacteo"},{"id":"bm-6","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bm-7","name":"Cacao puro en polvo sin azúcar","amount":30,"unit":"g (2 cdas colmadas)","category":"despensa"},{"id":"bm-8","name":"Leche extra para la masa de cacao","amount":30,"unit":"ml (2 cdas)","category":"lacteo"},{"id":"bm-9","name":"Extracto natural de vainilla","amount":1,"unit":"cucharada","category":"especia"},{"id":"bm-10","name":"Pizca de sal","amount":0.5,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"En un bol bate la mantequilla en pomada con el azúcar durante 4-5 minutos hasta que la mezcla blanquee y esté muy cremosa. Añade los huevos uno a uno, esperando que se integre bien cada uno antes de añadir el siguiente.","tip":"La mantequilla debe estar blanda al tacto, nunca derretida líquida.","durationMinutes":6},{"stepNumber":2,"instruction":"Añade la harina tamizada con la levadura y la sal, alternándola con los 100ml de leche entera. Bate a velocidad baja hasta tener una masa lisa y homogénea.","tip":"No batas en exceso para no endurecer la masa.","durationMinutes":3},{"stepNumber":3,"instruction":"Divide la masa en dos partes iguales en dos recipientes. A una mitad agrégale la vainilla líquida. A la otra mitad agrégale el cacao en polvo y las 2 cucharadas extra de leche para compensar la densidad.","tip":"La leche extra asegura que ambas masas tengan la misma consistencia al hornearse.","durationMinutes":3},{"stepNumber":4,"instruction":"En un molde de plum cake o de corona previamente engrasado, ve alternando cucharadas de masa blanca y masa oscura una sobre otra. Al terminar, introduce un cuchillo o brocheta y haz movimientos en zigzag o espiral de un extremo a otro.","tip":"Ese zigzag crea el característico efecto marmolado sin mezclar las masas por completo.","durationMinutes":4},{"stepNumber":5,"instruction":"Hornea a 180°C durante 40-45 minutos hasta que al pinchar salga limpio. Desmolda tibio sobre rejilla y espolvorea azúcar glas.","tip":"Al cortar cada rebanada verás un dibujo diferente.","durationMinutes":42}],"regionalVariants":[{"name":"Marmolado con Toque de Café Espresso","region":"Viena","description":"Se disuelve 1 cucharadita de café soluble en la leche de la masa de cacao para potenciar el amargor del chocolate.","optionalAdditions":["1 cdta café soluble"]}],"chefTips":["Se conserva esponjoso y fresco durante casi una semana bien tapado bajo campana de cristal."],"robot":{"servings":8,"factor":1,"note":"El robot bate la mantequilla en pomada.","ingredients":["150 g · Mantequilla a temperatura ambiente (en pomada)","180 g · Azúcar blanco","3 unidades · Huevos medianos camperos","260 g · Harina de trigo de repostería","100 ml · Leche entera","1 sobre (16g) · Levadura química en polvo","30 g (2 cdas colmadas) · Cacao puro en polvo sin azúcar","30 ml (2 cdas) · Leche extra para la masa de cacao","1 cucharada · Extracto natural de vainilla","0,5 cucharadita · Pizca de sal"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 180 °C. Mantequilla y azúcar: 1 min a velocidad 4. Añade los huevos de uno en uno: 20 s a velocidad 4 cada uno."},{"stepNumber":2,"instruction":"Añade harina, levadura, sal y leche: 15 s a velocidad 4."},{"stepNumber":3,"instruction":"Saca la mitad de la masa a un bol con la vainilla. Añade al vaso el cacao y la leche extra: 10 s a velocidad 3."},{"stepNumber":4,"instruction":"Alterna las dos masas en el molde, dibuja el marmolado y hornea a 180 °C 40-45 min."}]}},{"id":"bizcocho-manzana-canela-caramelizada","title":"Bizcocho de Manzanas Caramelizadas y Canela","subtitle":"Capas de finas láminas de manzana que se funden con la masa tierna","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Normandía / España","originFlag":"🍎","desc":"El bizcocho más meloso y jugoso del recetario. Manzanas reineta o fuji cortadas en láminas finísimas: la mitad se integra en la masa para aportar una humedad frutal impresionante, y la otra mitad se dispone en abanico sobre la superficie espolvoreada con canela y azúcar moreno que se carameliza en el horno.","prepTime":20,"cookTime":45,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Fruta fresca","Meloso","Canela","Tarta casera"],"partyRole":"Postre tibio reconfortante con bola de helado de vainilla","drinkPairing":"Sidra asturiana dulce, té especiado o vino dulce Pedro Ximénez","ingredients":[{"id":"bma-1","name":"Manzanas Reineta, Golden o Fuji","amount":3,"unit":"unidades grandes (aprox 500g)","category":"verdura"},{"id":"bma-2","name":"Harina de trigo de repostería","amount":220,"unit":"g","category":"panaderia"},{"id":"bma-3","name":"Huevos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bma-4","name":"Azúcar blanco","amount":150,"unit":"g","category":"despensa"},{"id":"bma-5","name":"Mantequilla derretida o aceite suave","amount":80,"unit":"g","category":"lacteo"},{"id":"bma-6","name":"Leche entera","amount":80,"unit":"ml","category":"lacteo"},{"id":"bma-7","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bma-8","name":"Canela molida de Ceilán","amount":1.5,"unit":"cucharadita","category":"especia"},{"id":"bma-9","name":"Azúcar moreno y dados de mantequilla para la cubierta","amount":2,"unit":"cucharadas","category":"despensa"},{"id":"bma-10","name":"Mermelada de albaricoque o melocotón para abrillantar","amount":2,"unit":"cucharadas con 1 cda agua","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Pela las manzanas y descorazónalas. Corta una manzana en dados pequeños y las otras dos en láminas muy finas con cuchillo o mandolina.","tip":"Rocía con unas gotas de zumo de limón para que no se oxiden.","durationMinutes":8},{"stepNumber":2,"instruction":"Bate los huevos con el azúcar durante 4 minutos hasta blanquear. Añade la mantequilla derretida tibia y la leche sin dejar de batir suavemente.","tip":"Tamiza la harina con la levadura y 1 cucharadita de canela e incorpora con espátula.","durationMinutes":4},{"stepNumber":3,"instruction":"Añade los dados de manzana a la masa y mezcla. Vierte la masa en un molde redondo de 22 cm con papel de hornear.","tip":"Los dados internos se desharán durante el horneado creando una textura casi de crema pastelera frutal.","durationMinutes":3},{"stepNumber":4,"instruction":"Coloca las láminas de manzana sobre la superficie en círculos concéntricos solapadas en abanico. Espolvorea con el azúcar moreno, media cucharadita de canela y pequeños daditos de mantequilla.","tip":"La mantequilla y el azúcar caramelizarán la manzana en el horno.","durationMinutes":5},{"stepNumber":5,"instruction":"Hornea a 180°C durante 45 minutos. Al salir, pincela la superficie caliente con la mermelada templada para darle un brillo de pastelería profesional.","tip":"Delicioso tanto tibio como frío.","durationMinutes":45}],"regionalVariants":[{"name":"Bizcocho Invisible de Manzana (Gâteau Invisible)","region":"Francia","description":"Lleva muchísima manzana y casi nada de masa: todas las láminas se bañan en masa líquida resultando en un pastel de capas que parece milhojas.","optionalAdditions":["5 manzanas en láminas con mitad de harina"]}],"chefTips":["La manzana Reineta aporta un toque ácido perfecto que contrasta con el dulzor del azúcar caramelizado."],"robot":{"servings":8,"factor":1,"note":"El robot pica la manzana en dados y hace la masa.","ingredients":["3 unidades grandes (aprox 500g) · Manzanas Reineta, Golden o Fuji","220 g · Harina de trigo de repostería","3 unidades · Huevos camperos","150 g · Azúcar blanco","80 g · Mantequilla derretida o aceite suave","80 ml · Leche entera","1 sobre (16g) · Levadura química en polvo","1,5 cucharadita · Canela molida de Ceilán","2 cucharadas · Azúcar moreno y dados de mantequilla para la cubierta","2 cucharadas con 1 cda agua · Mermelada de albaricoque o melocotón para abrillantar"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 180 °C. Una manzana en cuartos: 3 s a velocidad 4. Reserva. Lamina las otras dos a cuchillo."},{"stepNumber":2,"instruction":"Con la mariposa: huevos y azúcar, 4 min a 37 °C, velocidad 4. Añade mantequilla y leche: 15 s a velocidad 3. Quita la mariposa."},{"stepNumber":3,"instruction":"Añade harina, levadura y canela: 10 s a velocidad 3. Añade los dados de manzana: 5 s a velocidad 2 (giro inverso)."},{"stepNumber":4,"instruction":"Molde, láminas de manzana encima, azúcar moreno y mantequilla, y horno a 180 °C 45 min."}]}},{"id":"bizcocho-limon-semillas-amapola","title":"Bizcocho de Limón y Semillas de Amapola (Lemon Poppy)","subtitle":"El clásico anglosajón bañado en almíbar cítrico con crujido sutil","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Reino Unido / Repostería Internacional","originFlag":"🇬🇧","desc":"Elegancia pura para la hora del té. Una masa esponjosa perfumada con abundante ralladura y zumo de limones frescos, salpicada con diminutas semillas de amapola azul que aportan un contraste crujiente sofisticado. Al salir del horno se cala con un almíbar caliente de limón que lo mantiene intensamente jugoso durante días.","prepTime":15,"cookTime":40,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Cítrico elegante","Amapola crujiente","Calado jugoso","Gourmet"],"partyRole":"Bizcocho aromático y limpio para amantes de los cítricos","drinkPairing":"Té verde Sencha, infusión de menta o café aromático","ingredients":[{"id":"bl-1","name":"Harina de trigo de repostería","amount":220,"unit":"g","category":"panaderia"},{"id":"bl-2","name":"Semillas de amapola azul","amount":25,"unit":"g (aprox 2 cdas colmadas)","category":"especia"},{"id":"bl-3","name":"Mantequilla en pomada (o aceite de girasol)","amount":120,"unit":"g","category":"lacteo"},{"id":"bl-4","name":"Azúcar blanco","amount":180,"unit":"g","category":"despensa"},{"id":"bl-5","name":"Huevos camperos","amount":3,"unit":"unidades","category":"lacteo"},{"id":"bl-6","name":"Yogur natural o crème fraîche","amount":100,"unit":"g","category":"lacteo"},{"id":"bl-7","name":"Limones frescos (ralladura de 2 y zumo de 1)","amount":2,"unit":"unidades","category":"verdura"},{"id":"bl-8","name":"Levadura química en polvo","amount":1,"unit":"sobre (16g)","category":"despensa"},{"id":"bl-9","name":"Pizca de sal","amount":0.5,"unit":"cucharadita","category":"especia"},{"id":"bl-10","name":"Almíbar de calado: zumo de 1 limón + 40g azúcar","amount":null,"unit":"hervido 2 min","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"En un bol frota con las yemas de los dedos el azúcar con la ralladura de los 2 limones durante 1 minuto.","tip":"La fricción del azúcar con la ralladura extrae los aceites esenciales del limón multiplicando el aroma por diez.","durationMinutes":3},{"stepNumber":2,"instruction":"Añade la mantequilla en pomada y bate con varillas eléctricas durante 4 minutos hasta tener una pomada esponjosa. Añade los huevos uno a uno batiendo bien.","tip":"La emulsión debe quedar aireada.","durationMinutes":4},{"stepNumber":3,"instruction":"Añade el yogur y el zumo de medio limón. Tamiza encima la harina con la levadura y la sal, y agrega las semillas de amapola.","tip":"Mezcla suavemente con espátula para distribuir los puntos negros de amapola uniformemente.","durationMinutes":3},{"stepNumber":4,"instruction":"Vierte en molde de plum cake forrado y hornea a 175°C durante 40-45 minutos hasta que al pinchar salga seco.","tip":"Mientras se hornea, hierve el zumo del limón restante con los 40g de azúcar 2 minutos para el almíbar.","durationMinutes":42},{"stepNumber":5,"instruction":"Nada más sacar el bizcocho caliente del horno, pincha toda la superficie con una brocheta fina y vierte el almíbar de limón poco a poco con una cuchara.","tip":"El bizcocho absorberá el almíbar como una esponja quedando húmedo sin desmoronarse.","durationMinutes":3}],"regionalVariants":[{"name":"Lemon Poppy con Glaseado Blanco de Limón","region":"Pastelería de Londres","description":"Se cubre con un glaseado blanco opaco de azúcar glas y zumo de limón coronado con semillas de amapola espolvoreadas.","optionalAdditions":["Glaseado espeso de azúcar glas"]}],"chefTips":["Las semillas de amapola no solo aportan estética: dan un crujido pequeñito maravilloso en cada mordisco."],"robot":{"servings":8,"factor":1,"note":"El robot perfuma el azúcar con la ralladura.","ingredients":["220 g · Harina de trigo de repostería","25 g (aprox 2 cdas colmadas) · Semillas de amapola azul","120 g · Mantequilla en pomada (o aceite de girasol)","180 g · Azúcar blanco","3 unidades · Huevos camperos","100 g · Yogur natural o crème fraîche","2 unidades · Limones frescos (ralladura de 2 y zumo de 1)","1 sobre (16g) · Levadura química en polvo","0,5 cucharadita · Pizca de sal","hervido 2 min · Almíbar de calado: zumo de 1 limón + 40g azúcar"],"steps":[{"stepNumber":1,"instruction":"Azúcar y piel de 2 limones (sin la parte blanca): 15 s a velocidad 10."},{"stepNumber":2,"instruction":"Añade la mantequilla: 1 min a velocidad 4. Añade los huevos de uno en uno: 20 s a velocidad 4 cada uno."},{"stepNumber":3,"instruction":"Añade yogur y zumo, y luego harina, levadura, sal y amapola: 15 s a velocidad 3."},{"stepNumber":4,"instruction":"Hornea a 175 °C 40-45 min."},{"stepNumber":5,"instruction":"Almíbar: zumo de limón y 40 g de azúcar, 3 min a 100 °C, velocidad 2. Riega el bizcocho caliente."}]}},{"id":"bizcocho-platano-maduro-banana-bread","title":"Bizcocho Esponjoso de Plátano Maduro (Banana Bread)","subtitle":"El mejor aprovechamiento dulce: plátanos maduros, mantequilla y nueces","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Internacional","originFlag":"🍌","desc":"El aroma más reconfortante que puede salir de un horno. El auténtico Banana Bread artesano: plátanos maduros de piel moteada machacados a mano, combinados con mantequilla dorada, azúcar moreno, canela, nueces y pepitas de chocolate opcionales. Miga tierna, densa y deliciosamente caramelizada.","prepTime":15,"cookTime":50,"difficulty":"Fácil","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Aprovechamiento","Plátano dulce","Nueces","Desayuno estrella"],"partyRole":"Bizcocho denso y jugoso cortado en rebanadas gruesas","drinkPairing":"Café solo, batido de avena o té especiado","ingredients":[{"id":"bb-1","name":"Plátanos maduros con piel moteada o negra","amount":3,"unit":"unidades grandes (aprox 350g pulpa)","category":"verdura"},{"id":"bb-2","name":"Mantequilla sin sal derretida","amount":100,"unit":"g","category":"lacteo"},{"id":"bb-3","name":"Azúcar moreno o panela","amount":140,"unit":"g","category":"despensa"},{"id":"bb-4","name":"Huevos camperos","amount":2,"unit":"unidades","category":"lacteo"},{"id":"bb-5","name":"Harina de trigo de repostería","amount":220,"unit":"g","category":"panaderia"},{"id":"bb-6","name":"Bicarbonato de sodio","amount":1,"unit":"cucharadita","category":"despensa"},{"id":"bb-7","name":"Canela molida","amount":1,"unit":"cucharadita","category":"especia"},{"id":"bb-8","name":"Nueces peladas picadas en trozos medianos","amount":70,"unit":"g","category":"despensa"},{"id":"bb-9","name":"Extracto de vainilla y pizca de sal","amount":1,"unit":"cucharadita","category":"especia"},{"id":"bb-10","name":"Plátano extra cortado longitudinalmente para decorar la superficie (opcional)","amount":1,"unit":"unidad","category":"verdura"}],"steps":[{"stepNumber":1,"instruction":"En un plato hondo machaca los 3 plátanos maduros con un tenedor hasta tener un puré rústico con algún tropezón.","tip":"Cuanto más maduro y oscuro esté el plátano, más azúcares naturales tendrá y menos azúcar añadido necesitarás.","durationMinutes":4},{"stepNumber":2,"instruction":"En un bol amplio, mezcla con varilla de mano la mantequilla derretida con el azúcar moreno y la vainilla. Añade los 2 huevos y bate 1 minuto.","tip":"Incorpora el puré de plátano machacado.","durationMinutes":3},{"stepNumber":3,"instruction":"Tamiza encima la harina con el bicarbonato de sodio, la canela y la sal. Mezcla con espátula solo hasta que no haya harina visible. Añade las nueces picadas.","tip":"No batas de más: la masa de banana bread debe tratarse suavemente para que no quede gomosa.","durationMinutes":3},{"stepNumber":4,"instruction":"Vierte en un molde de plum cake forrado con papel vegetal. Si deseas, coloca las dos mitades del plátano extra en la superficie con el corte hacia arriba y espolvorea un poco de azúcar moreno.","tip":"Se caramelizará en el horno con un aspecto rústico precioso.","durationMinutes":3},{"stepNumber":5,"instruction":"Hornea a 175°C durante 50-55 minutos. Al pinchar en el centro debe salir limpio. Deja enfriar en el molde 15 minutos y pasa a rejilla.","tip":"Al día siguiente es todavía más jugoso y fácil de cortar en rebanadas limpias.","durationMinutes":52}],"regionalVariants":[{"name":"Banana Bread con Dulce de Leche","region":"Río de la Plata","description":"Se añaden cucharadas de dulce de leche repostero intercaladas en la masa antes de hornear creando vetas caramelizadas.","optionalAdditions":["Cucharadas de dulce de leche"]}],"chefTips":["Si tienes plátanos poniéndose negros en el frutero, nunca los tires: ¡este es su destino glorioso!"],"robot":{"servings":8,"factor":1,"note":"El robot pica las nueces y aplasta el plátano.","ingredients":["3 unidades grandes (aprox 350g pulpa) · Plátanos maduros con piel moteada o negra","100 g · Mantequilla sin sal derretida","140 g · Azúcar moreno o panela","2 unidades · Huevos camperos","220 g · Harina de trigo de repostería","1 cucharadita · Bicarbonato de sodio","1 cucharadita · Canela molida","70 g · Nueces peladas picadas en trozos medianos","1 cucharadita · Extracto de vainilla y pizca de sal","1 unidad · Plátano extra cortado longitudinalmente para decorar la superficie (opcional)"],"steps":[{"stepNumber":1,"instruction":"Nueces: 3 s a velocidad 5. Reserva."},{"stepNumber":2,"instruction":"Plátanos: 5 s a velocidad 4. Añade mantequilla derretida, azúcar, vainilla y huevos: 20 s a velocidad 4."},{"stepNumber":3,"instruction":"Añade harina, bicarbonato, canela y sal: 10 s a velocidad 3. Añade las nueces: 5 s a velocidad 2 (giro inverso)."},{"stepNumber":4,"instruction":"Hornea a 175 °C 50-55 min."}]}},{"id":"bizcocho-genoves-tartas-sin-levadura","title":"Bizcocho Genovés Tradicional para Tartas (Sin Levadura)","subtitle":"La técnica maestra de aireado de huevos para una esponja etérea y ligera","category":"bizcochos","categoryLabel":"Bizcochos Caseros","origin":"Génova, Italia / Pastelería Clásica","originFlag":"🇮🇹","desc":"La base universal de la alta pastelería europea. No lleva ni un gramo de levadura química ni grasas: su increíble altura y esponjosidad etérea se consiguen batiendo los huevos enteros con el azúcar al baño maría o a alta velocidad hasta alcanzar el \"punto de letra\". Es la esponja perfecta para emborrachar con almíbar, rellenar de nata o crema pastelera y hacer brazos de gitano o tartas de pisos.","prepTime":20,"cookTime":25,"difficulty":"Media","baseServings":8,"image":"https://images.unsplash.com/photo-1541518763669-27fef04b14ea?auto=format&fit=crop&w=800&q=80","tags":["Sin levadura","Pastelería clásica","Base de tartas","Etéreo"],"partyRole":"La base reina para tartas de cumpleaños y celebraciones","drinkPairing":"Cava brut, café de filtro o licor de frutas","ingredients":[{"id":"bg-1","name":"Huevos enteros a temperatura ambiente","amount":4,"unit":"unidades grandes (talla L)","category":"lacteo"},{"id":"bg-2","name":"Azúcar blanco","amount":120,"unit":"g (30g por huevo)","category":"despensa"},{"id":"bg-3","name":"Harina de trigo de repostería tamizada dos veces","amount":120,"unit":"g (30g por huevo)","category":"panaderia"},{"id":"bg-4","name":"Pizca de sal fina","amount":1,"unit":"pizca","category":"especia"},{"id":"bg-5","name":"Extracto natural de vainilla o ralladura de limón","amount":1,"unit":"cucharadita","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Precalienta el horno a 170°C con calor arriba y abajo. Forra la base de un molde desmontable de 20-22 cm con papel sulfurizado. Engrasa solo la base, ¡no los laterales!","tip":"No engrasar los laterales del molde permite que la masa se agarre al subir y no se desinfle en el centro.","durationMinutes":5},{"stepNumber":2,"instruction":"En un bol resistente al calor, pon los 4 huevos con el azúcar y la pizca de sal. Colócalo sobre un cazo con agua caliente a fuego mínimo (baño maría suave, el bol no debe tocar el agua) y bate con varillas eléctricas durante 8-10 minutos hasta alcanzar los 40°C y que la mezcla blanquee, triplique su volumen y forme el \"punto de cinta o de letra\".","tip":"Sabrás que está en su punto cuando al levantar las varillas puedes \"escribir\" sobre la masa y el trazo se mantiene visible unos segundos antes de fundirse.","durationMinutes":10},{"stepNumber":3,"instruction":"Retira del baño maría y añade la vainilla. Tamiza la harina en dos tandas sobre la masa.","tip":"Mezcla con espátula de silicona con movimientos envolventes lentos y delicados desde el centro hacia el fondo y subiendo por las paredes, girando el bol con la otra mano. ¡Cero prisas para no perder el aire!","durationMinutes":4},{"stepNumber":4,"instruction":"Vierte la masa con suavidad en el molde desde poca altura para no romper las burbujas. Da un golpecito seco sobre la mesa para asentar burbujas grandes.","tip":"Hornea a 170°C durante 25-28 minutos.","durationMinutes":28},{"stepNumber":5,"instruction":"¡Prohibido abrir el horno antes de los 20 minutos! Al salir, deja templar 5 minutos y pasa una espátula fina por el borde. Desmolda y deja enfriar boca abajo sobre una rejilla.","tip":"Enfriar boca abajo garantiza una superficie completamente plana para montar tartas.","durationMinutes":5}],"regionalVariants":[{"name":"Genovés de Chocolate para Tartas Selva Negra","region":"Alsacia y Selva Negra","description":"Se sustituyen 25g de harina por 25g de cacao puro en polvo tamizado junto a la harina.","optionalAdditions":["25g cacao puro tamizado"]}],"chefTips":["Al no llevar grasa (mantequilla ni aceite), es la esponja más sedienta del mundo: absorbe almíbar de licor, café o frutas sin deshacerse jamás."],"robot":{"servings":8,"factor":1,"note":"El robot sustituye el baño maría: monta los huevos templados con la mariposa.","ingredients":["4 unidades grandes (talla L) · Huevos enteros a temperatura ambiente","120 g (30g por huevo) · Azúcar blanco","120 g (30g por huevo) · Harina de trigo de repostería tamizada dos veces","1 pizca · Pizca de sal fina","1 cucharadita · Extracto natural de vainilla o ralladura de limón"],"steps":[{"stepNumber":1,"instruction":"Precalienta a 170 °C. Coloca la mariposa. Huevos, azúcar y sal: 6 min a 37 °C, velocidad 4."},{"stepNumber":2,"instruction":"Sin temperatura: 8 min más a velocidad 4, hasta que doble varias veces su volumen y forme cordón."},{"stepNumber":3,"instruction":"Quita la mariposa. Añade la vainilla y la harina tamizada a mano, con espátula y movimientos envolventes."},{"stepNumber":4,"instruction":"Al molde y al horno a 170 °C sin abrir antes de 20 min."}]}}],re=[{"id":"pisto-murciano-pollo","title":"Tu Pisto Murciano con Pollo","subtitle":"La receta estrella de la casa con sofrito meloso","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Murcia, España","originFlag":"🇪🇸","desc":"La receta reina de tus fiestas. Un sofrito denso, confitado y dulce donde los pimientos y la cebolla se funden, y los dados de pechuga de pollo se cocinan lentamente embebiéndose de todos los jugos del tomate frito.","prepTime":20,"cookTime":45,"difficulty":"Fácil","baseServings":4,"image":"https://images.unsplash.com/photo-1547592180-85f173990554?auto=format&fit=crop&w=800&q=80","tags":["Estrella de la casa","Sin gluten","Para preparar antes","Alto en proteína"],"partyRole":"Guiso estrella caliente o templado con abundante pan","drinkPairing":"Vino tinto joven de Jumilla (Monastrell) o cerveza rubia bien fría","ingredients":[{"id":"pmp-1","name":"Pimiento verde italiano","amount":2,"unit":"unidades grandes","category":"verdura"},{"id":"pmp-2","name":"Pimiento rojo carnoso","amount":2,"unit":"unidades grandes","category":"verdura"},{"id":"pmp-3","name":"Cebolla dulce o de Fuentes","amount":2,"unit":"unidades grandes","category":"verdura"},{"id":"pmp-4","name":"Pechuga de pollo de corral","amount":500,"unit":"g","note":"cortada en dados de 2 cm","category":"carne_pescado"},{"id":"pmp-5","name":"Tomate frito artesanal triturado","amount":400,"unit":"g","note":"de buena calidad o casero","category":"despensa"},{"id":"pmp-6","name":"Aceite de oliva virgen extra","amount":80,"unit":"ml","note":"generoso para confitar","category":"despensa"},{"id":"pmp-7","name":"Dientes de ajo","amount":2,"unit":"dientes","note":"laminados finos","category":"verdura"},{"id":"pmp-8","name":"Sal marina y pimienta negra","amount":null,"unit":"al gusto","category":"especia"},{"id":"pmp-9","name":"Pizca de azúcar (opcional si el tomate es ácido)","amount":1,"unit":"pizca","category":"despensa"}],"steps":[{"stepNumber":1,"instruction":"Lava y corta los pimientos verde y rojo en brunoise (dados pequeños y uniformes de 1 cm) y la cebolla en dados del mismo tamaño. La uniformidad es la clave de la textura.","tip":"No uses picadora eléctrica para las verduras o soltarán demasiada agua; el corte a cuchillo garantiza un confitado perfecto.","durationMinutes":10},{"stepNumber":2,"instruction":"En una cazuela ancha o sartén honda, calienta el aceite de oliva a fuego medio-alto. Añade los pimientos y la cebolla con una pizca de sal. Pocha removiendo con paciencia hasta que la verdura reduzca a la mitad y empiece a adquirir un tono dorado-acaramelado.","tip":"Si añades los ajos laminados o tomate natural rallado extra, incorpóralos en este punto para que el ajo no se queme.","durationMinutes":20},{"stepNumber":3,"instruction":"Vierte el tomate frito triturado. Baja el fuego a medio-bajo y deja cocinar unos 12-15 minutos chup-chup para que se concentre el sabor y el aceite empiece a aflorar a la superficie.","tip":"Prueba el sofrito y ajusta de sal o con una pizca de azúcar si notas acidez en el tomate.","durationMinutes":15},{"stepNumber":4,"instruction":"Salpimienta los dados de pechuga de pollo e incorpóralos directamente al pisto caliente. Remueve bien para que queden sumergidos. Tapa la cazuela y cocina a fuego suave durante 20-25 minutos.","tip":"El pollo se cocinará dentro de la salsa quedando ultra tierno y jugoso sin resecarse. Dejar reposar 1 hora antes de servir potencia el sabor un 200%.","durationMinutes":25}],"regionalVariants":[{"name":"Variante Huertana con Magra de Cerdo","region":"Campo de Cartagena y Vega Media","description":"En las ventas tradicionales murcianas se sustituye o combina el pollo con magra de cerdo ibérico en dados frita previamente.","optionalAdditions":["350g magra de cerdo en dados","1 hoja de laurel"]},{"name":"Variante con Huevo Pochado o de Codorniz para Fiesta","region":"Tapeo de Murcia Capital","description":"Servido en cazuelitas individuales de barro coronado con un huevo de codorniz frito con puntilla o huevo poché recién hecho para romper la yema con el pan.","optionalAdditions":["1 huevo de codorniz por ración","Pimentón de Murcia dulce"]}],"chefTips":["Gana muchísimo de un día para otro: prepáralo la víspera de la fiesta y solo caliéntalo suavemente antes de servir.","Sírvelo en cazuela de barro templado acompañado de hogaza de pan de pueblo con buena miga o picos camperos."],"robot":{"servings":3,"factor":0.75,"note":"El robot pica y pocha sin vigilar. A 3/4 de cantidad cabe en el vaso.","ingredients":["1,5 unidades grandes · Pimiento verde italiano","1,5 unidades grandes · Pimiento rojo carnoso","1,5 unidades grandes · Cebolla dulce o de Fuentes","375 g · Pechuga de pollo de corral","300 g · Tomate frito artesanal triturado","60 ml · Aceite de oliva virgen extra","1,5 dientes · Dientes de ajo","al gusto · Sal marina y pimienta negra","0,75 pizca · Pizca de azúcar (opcional si el tomate es ácido)"],"steps":[{"stepNumber":1,"instruction":"Cebolla y pimientos en trozos grandes al vaso: 4 s a velocidad 4. Si los quieres en brunoise perfecta, córtalos a cuchillo."},{"stepNumber":2,"instruction":"Añade el aceite y una pizca de sal: 15 min a 120 °C, velocidad 1 (giro inverso), sin cubilete."},{"stepNumber":3,"instruction":"Añade el tomate frito: 12 min a 100 °C, velocidad 1 (giro inverso), sin cubilete y con el cestillo sobre la tapa para que no salpique."},{"stepNumber":4,"instruction":"Añade el pollo en dados salpimentado: 10 min a 100 °C, velocidad 1 (giro inverso). Reposa 3 min y prueba de sal."}]}},{"id":"zarangollo-murciano","title":"Zarangollo Murciano Clásico","subtitle":"La joya de la huerta: calabacín confitado y huevo meloso","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Región de Murcia","originFlag":"🇪🇸","desc":"Sencillez rústica elevada al arte. Calabacines tiernos y cebolla pochados muy despacio en aceite de oliva virgen hasta caramelizarse, enlazados con huevos que cuajan lentamente fuera del fuego para una textura cremosa inigualable.","prepTime":15,"cookTime":35,"difficulty":"Fácil","baseServings":4,"image":"https://images.unsplash.com/photo-1540420773420-3366772f4999?auto=format&fit=crop&w=800&q=80","tags":["Vegetariano","Sin gluten","Tapa tradicional","Rápido"],"partyRole":"Tapa caliente o tibia para servir sobre tostas crujientes","drinkPairing":"Cerveza Estrella de Levante o vino blanco bien fresco (Verdejo o Macabeo)","ingredients":[{"id":"zm-1","name":"Calabacines medianos tiernos","amount":3,"unit":"unidades (aprox 700g)","category":"verdura"},{"id":"zm-2","name":"Cebolla grande dulce","amount":2,"unit":"unidades (aprox 400g)","category":"verdura"},{"id":"zm-3","name":"Huevos de gallinas camperas (L)","amount":4,"unit":"unidades","category":"lacteo"},{"id":"zm-4","name":"Aceite de oliva virgen extra","amount":100,"unit":"ml","category":"despensa"},{"id":"zm-5","name":"Sal marina","amount":1,"unit":"cucharadita","category":"especia"},{"id":"zm-6","name":"Pimienta negra recién molida","amount":null,"unit":"al gusto","category":"especia"},{"id":"zm-7","name":"Orégano seco silvestre (opcional tradicional)","amount":1,"unit":"pizca","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Pela los calabacines (puedes dejar alguna tira de piel si son finos y ecológicos) y córtalos en rodajas de medio centímetro y luego en cuartos. Corta la cebolla en juliana fina.","tip":"No los ralles ni cortes demasiado finos, o se desharán convirtiéndose en puré antes de confitarse.","durationMinutes":10},{"stepNumber":2,"instruction":"Calienta el AOVE en una sartén amplia a fuego medio-bajo. Añade primero la cebolla con un pellizco de sal durante 8 minutos hasta que transparente. Incorpora el calabacín y remueve bien.","tip":"Mantén el fuego suave. La verdura debe sudar y confitarse en su propio jugo y el aceite, sin quemarse ni tomar color excesivo.","durationMinutes":25},{"stepNumber":3,"instruction":"Cuando el calabacín esté totalmente tierno y translúcido, vuelca la verdura en un colador grande apoyado sobre un cuenco durante 5 minutos para escurrir el exceso de aceite.","tip":"Este paso es el secreto de los mejores bares de Murcia: evita que el zarangollo quede grasiento o aguado.","durationMinutes":5},{"stepNumber":4,"instruction":"Devuelve la verdura escurrida a la sartén a fuego mínimo. Bate los huevos ligeramente (sin espumar) con una pizca de sal. Viértelos sobre la verdura y remueve suavemente con espátula de madera apagando el fuego de inmediato.","tip":"El calor residual cuajará el huevo en una crema sedosa similar a un revuelto baboso.","durationMinutes":5}],"regionalVariants":[{"name":"Variante Murciana Tradicional (Sin Cebolla)","region":"Huerta de Murcia Antigua","description":"Los puristas más acérrimos defienden que el auténtico zarangollo del siglo XIX solo llevaba calabacín, huevo y sal, sin cebolla, dejando todo el protagonismo al frescor del calabacín.","optionalAdditions":["1 calabacín extra","Eliminar cebolla"]},{"name":"Variante con Patata Confitada","region":"Murcia Rural / Alquerías","description":"Muy habitual en hogares de campo: se añade 1 patata cortada en lascas finas que se confita junto a la cebolla antes del calabacín.","optionalAdditions":["1 patata mediana en lascas finas"]}],"chefTips":["Sírvelo tibio sobre tostas de pan de masa madre frotadas con medio diente de ajo.","El aceite escurrido en el paso 3 es un tesoro aromatizado: guárdalo para aliñar ensaladas o hacer mahonesa casera."],"robot":{"servings":2,"factor":0.5,"note":"Mitad de cantidades para que la verdura se poche bien. Para 4, haz dos tandas.","ingredients":["1,5 unidades · Calabacines medianos tiernos","1 unidades · Cebolla grande dulce","2 unidades · Huevos de gallinas camperas (L)","50 ml · Aceite de oliva virgen extra","0,5 cucharadita · Sal marina","al gusto · Pimienta negra recién molida","0,5 pizca · Orégano seco silvestre (opcional tradicional)"],"steps":[{"stepNumber":1,"instruction":"Cebolla en juliana (a cuchillo o 2 s a velocidad 4) con el aceite: 10 min a 120 °C, velocidad 1 (giro inverso)."},{"stepNumber":2,"instruction":"Añade el calabacín en cuartos de rodaja y la sal: 15-18 min a 120 °C, velocidad 1 (giro inverso), sin cubilete."},{"stepNumber":3,"instruction":"Escurre el exceso de aceite con el cestillo y devuelve la verdura al vaso."},{"stepNumber":4,"instruction":"Añade los huevos batidos: 3 min a 90 °C, velocidad 1 (giro inverso), hasta que cuajen jugosos."}]}},{"id":"titaina-valenciana","title":"Titaina Valenciana Tradicional","subtitle":"El sofrito marinero de pimiento, tomate y piñones de El Cabanyal","category":"sofritos","categoryLabel":"Sofritos y Guisos","origin":"Poblados Marítimos de Valencia","originFlag":"🇪🇸","desc":"Auténtica maravilla gastronómica de los marineros de Valencia. Pimiento rojo y verde confitados a fuego lentísimo con tomate concentrado, piñones tostados y atún (tradicionalmente tonyina de sorra o atún en salazón). Se degusta templada o fría mojando rosquilletas.","prepTime":20,"cookTime":50,"difficulty":"Media","baseServings":6,"image":"https://images.unsplash.com/photo-1594998893017-36147cbcae05?auto=format&fit=crop&w=800&q=80","tags":["Tradicional","Relleno de empanada","Pescado","Para preparar antes"],"partyRole":"Tapa de fiesta fría o templada, y relleno idóneo de mini empanadas","drinkPairing":"Vino blanco valenciano (Merseguera o Moscatel seco) o Vermut rojo artesanal","ingredients":[{"id":"tv-1","name":"Pimiento rojo maduro grueso","amount":2,"unit":"unidades","category":"verdura"},{"id":"tv-2","name":"Pimiento verde carnoso","amount":1,"unit":"unidad","category":"verdura"},{"id":"tv-3","name":"Tomates maduros triturados (o pera rallados)","amount":600,"unit":"g","category":"verdura"},{"id":"tv-4","name":"Piñones nacionales","amount":40,"unit":"g","category":"despensa"},{"id":"tv-5","name":"Tonyina de sorra (atún en salazón) o bonito del norte en conserva","amount":200,"unit":"g","note":"desmigado grueso","category":"carne_pescado"},{"id":"tv-6","name":"Dientes de ajo picados muy fino","amount":2,"unit":"dientes","category":"verdura"},{"id":"tv-7","name":"Aceite de oliva virgen extra","amount":90,"unit":"ml","category":"despensa"},{"id":"tv-8","name":"Pizca de sal y azúcar","amount":null,"unit":"al gusto","note":"ojo con la sal si usas atún en salazón","category":"especia"}],"steps":[{"stepNumber":1,"instruction":"Si utilizas tonyina de sorra tradicional en salazón, desálala en agua fría durante 2 horas cambiando el agua dos veces. Si usas bonito en conserva de buena calidad, escúrrelo bien y reserva.","tip":"La tonyina de sorra aporta una potencia marina y un umami incomparable.","durationMinutes":10},{"stepNumber":2,"instruction":"Corta los pimientos en cuadraditos pequeños y regulares. En una sartén amplia con abundante AOVE, sofríe los piñones hasta que tomen color dorado y retíralos con espumadera para que no se quemen.","tip":"Tostar los piñones primero en el mismo aceite impregna toda la grasa de su aroma a bosque mediterráneo.","durationMinutes":5},{"stepNumber":3,"instruction":"En ese mismo aceite, añade los ajos picados y los pimientos troceados a fuego suave. Cocina durante 25-30 minutos hasta que estén muy tiernos y confitados.","tip":"La paciencia es clave: el pimiento debe casi deshacerse al presionarlo.","durationMinutes":25},{"stepNumber":4,"instruction":"Añade el tomate triturado natural con media cucharadita de azúcar. Cocina a fuego lento durante 20 minutos hasta que el tomate pierda toda el agua y el aceite vuelva a subir a la superficie.","tip":"Sabrás que está en su punto cuando el sofrito brilla intensamente y no suelta líquido acuoso al empujarlo con la cuchara.","durationMinutes":20},{"stepNumber":5,"instruction":"Incorpora los piñones tostados y el atún desmigado en dados de 1 cm. Apaga el fuego a los 3 minutos para que el atún conserve su jugosidad. Deja enfriar a temperatura ambiente.","tip":"La titaina está infinitamente mejor servida del tiempo o reposada al día siguiente.","durationMinutes":5}],"regional
